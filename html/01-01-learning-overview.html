  <style>

<body>

  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-1. 전체 학습 주제 개요 및 기대 학습 성과 이해을 학습하겠습니다. 이 책에서 무엇을 배우고, 각 기술이 공장 자동화 시스템 안에서 어떻게 연결되는지 먼저 살펴보았습니다. 전체 지도를 이해하면 뒤에서 새로운 용어를 만나더라도 학습 위치를 잃지 않을 수 있습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 전기·전자·PLC·임베디드·소프트웨어의 관계를 설명할 수 있습니다. 컨베이어 실습이 전체 학습 과정에서 어떤 역할을 하는지 이해할 수 있습니다. 앞으로 학습할 기술의 순서와 최종 목표를 파악할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 학습을 시작하며에 관한 내용입니다. 기계 설계 과목을 끝냈습니다. 기초적인 내용만 진행을 했고, 오늘부터 기계 관련해서는 프로젝트 단위로 추가적인 내용을 공유할 예정입니다. 과정은 기초와 고급으로 구분했습니다. 필자 역시도 조금 더 복잡한 프로젝트는 시간이 걸립니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","기계 설계 과목을 끝냈습니다. 기초적인 내용만 진행을 했고, 오늘부터 기계 관련해서는 프로젝트 단위로 추가적인 내용을 공유할 예정입니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 전체 학습 로드맵에 관한 내용입니다. 우리는 이제 전기, 전자, 임베디드, PLC, Linux, Python, Web, ROS2를 위한 기초 과정을 시작하게 됩니다. 오늘은 그 이야기를 조금 더 상세히 해보고자 합니다. 1. 전기회로 2. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","먼저 전기회로 학습에서 꼭 알아야 할 내용을 정리해 보겠습니다. 오로지 전기 내용만을 갖고 컨베이어 한 개를 왕복 구동하게 만들어 봅니다. 이 과정에서 얻을 수 있는 내용을 다음과 같이 정리했습니다. 모터 구동 회로를 구성하고 센서 입력과 메모리 기능을 추가했습니다. 조건에 따라 컨베이어를 정방향 또는 역방향으로 회전하도록 구성했습니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","오로지 전기 내용만을 갖고 컨베이어 한 개를 왕복 구동하게 만들어 봅니다. 이 과정에서 얻을 수 있는 내용을 다음과 같이 정리했습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 PLC 학습에 관한 내용입니다. 릴레이는 공장 자동화의 기본 제어 소자입니다. 복잡한 릴레이 제어 기능을 프로그램으로 구현할 수 있도록 만든 대표적인 장치가 PLC입니다. 그래서 전기 이후에 PLC를 진행하게 되며, 전기 기초에서 만들었던 단순 동작 반복 시작으로 좀 더 복잡한 컨베이어와 로봇을 사용해 물류 라인을 제어해 봅니다. 단순히 컨베이어 한 개가 아니라 좀 더 복잡한 시나리오로 시퀀스 동작이 가능하도록 할 예정입니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","릴레이는 공장 자동화의 기본 제어 소자입니다. 복잡한 릴레이 제어 기능을 프로그램으로 구현할 수 있도록 만든 대표적인 장치가 PLC입니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 전자회로 학습에 관한 내용입니다. 전기 제어회로에서 릴레이가 스위치 역할을 한다면, 전자회로에서는 트랜지스터가 비슷한 역할을 했습니다. 전기와 전자는 다루는 전압, 전력, 부품과 적용 분야가 서로 겹치므로 명확한 경계를 정하기 어렵습니다. 다만, 하는 일에는 조금 차이가 있는데 전기는 주로 전기 패널과 케이블을 만들고, 전자는 PCB와 케이블을 만듭니다. 전기회로에서 만들었던 전기 패널을 전자회로로 변경해 PCB로 만들어 봅니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","전기 제어회로에서 릴레이가 스위치 역할을 한다면, 전자회로에서는 트랜지스터가 비슷한 역할을 했습니다. 전기와 전자는 다루는 전압, 전력, 부품과 적용 분야가 서로 겹치므로 명확한 경계를 정하기 어렵습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","전기 제어회로에서 릴레이가 스위치 역할을 한다면, 전자회로에서는 트랜지스터가 비슷한 역할을 했습니다. 전기와 전자는 다루는 전압, 전력, 부품과 적용 분야가 서로 겹치므로 명확한 경계를 정하기 어렵습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","임베디드 학습의 핵심 내용을 짚어보겠습니다. 네 번째 주제에서는 임베디드 환경을 구축했습니다. 릴레이 회로를 소형화한 것이 PLC라면, 트랜지스터 회로를 소형화한 것은 마이크로컨트롤러입니다. 마이크로컨트롤러를 사용한 시스템을 주로 임베디드 시스템이라고 합니다. 임베디드 환경은 크게 두 가지로 구분했습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","네 번째 주제에서는 임베디드 환경을 구축했습니다. 릴레이 회로를 소형화한 것이 PLC라면, 트랜지스터 회로를 소형화한 것은 마이크로컨트롤러입니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","먼저 Linux와 Python 학습에서 꼭 알아야 할 내용을 정리해 보겠습니다. 이번에는 OS가 있는 환경에서 구동을 해보기 위해 OS 중 하나인 Linux를 사용합니다. 가정용 PC에 Linux 환경을 구성할 수도 있습니다. 여기서는 라즈베리파이라고 하는 컨트롤러를 사용합니다. 라즈베리파이는 아두이노나 ESP32와 다르게 마이크로컨트롤러라고 보기보다는 미니PC에 가깝습니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","웹 환경 학습의 핵심 내용을 짚어보겠습니다. 자바스크립트와 웹 환경을 학습합니다. 여태까지 만들었던 환경은 User Interface를 구현하는 데 무리가 있었습니다. PLC 나 아두이노, 또 라즈베리파이에서 구동되는 컨베이어를 외부에서 조작하는 가장 간단한 방법입니다. 최근에는 바이브 코딩과 자동 코딩 방식이 널리 활용되고 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","먼저 ROS2 학습에서 꼭 알아야 할 내용을 정리해 보겠습니다. 마지막 주제는 ROS2입니다. 이 컨베이어와 로봇을 Linux 환경에서도 ROS2를 사용합니다. ROS2는 Robot Operating System의 약자로 로봇 소프트웨어를 개발하기 위한 미들웨어와 도구 모음입니다. Linux와 운영체제 과정에서 더 자세히 다루었습니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","다음은 핵심 정리에 관한 내용입니다. 하나의 자동화 설비에는 기계, 전기, 전자, 제어, 소프트웨어 기술이 함께 사용되었습니다. 컨베이어는 센서 입력, 모터 출력, 제어 로직을 한 번에 경험하기 좋은 실습 장치였습니다. 기초 개념을 익힌 뒤 PLC, 임베디드, Linux, 웹, ROS2 순으로 학습 범위를 확장했습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-01-learning-overview-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
