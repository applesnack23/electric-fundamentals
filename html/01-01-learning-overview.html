<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-1. 전체 학습 주제 개요 및 기대 학습 성과 이해 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-01-learning-overview-deck.html#1" title="1-1. 전체 학습 주제 개요 및 기대 학습 성과 이해 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-1. 전체 학습 주제 개요 및 기대 학습 성과 이해</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-1. 전체 학습 주제 개요 및 기대 학습 성과 이해 내용을 시작하겠습니다.","기계 설계 과목을 마쳤습니다. 지금까지는 기초적인 내용을 중심으로 진행했으며, 이제부터는 기계와 관련된 내용을 프로젝트 단위로 추가해 나갈 예정입니다. 굳이 구분하자면 기초 과정과 고급 과정으로 나눌 수 있습니다. 다만, 필자 역시 조금 더 복잡한 프로젝트를 완성하려면 많은 시간이 필요했습니다. 회사에서 진행했던 프로젝트들은 보안 문제로 인해 그대로 공개하기 어려웠습니다.","이러한 이야기를 먼저 하는 이유가 있습니다. 교육을 받으며 완성된 키트를 따라 제작하는 데에는 반나절 정도면 충분했습니다. 완성된 설계를 다시 그리는 일도 그리 오래 걸리지 않았습니다. 앞으로 진행할 고급 프로젝트 역시 학습자의 입장에서는 크게 어렵지 않을 수 있습니다. 하지만 어렵지 않게 따라 할 수 있는 프로젝트를 만들어 내기 까지는 많은 시행착오와 고통스러운 과정이 필요합니다.","이제부터는 기계 설계 기초 과정에서 벗어나 프로젝트 단위의 심화 과정으로 진행하겠습니다. 또한 기계 설계 기초 과정에서 제작했던 간단한 컨베이어를 실제로 구동하기 위한 내용들을 학습하겠습니다. 외형만 보면 단순한 컨베이어처럼 보일 수 있습니다. 하지만 이 키트를 제작하면서 센서와 모터를 사용했고, 모터의 회전수를 조절하기 위해 기계적인 기어비를 적용했습니다. 또한 동력을 전달하기 위해 타이밍 벨트를 사용했으며, 타이밍 벨트의 장력을 조절할 수 있도록 텐션 조절 장치도 구성했습니다.","이제부터는 기계 설계 기초 과정에서 벗어나 프로젝트 단위의 심화 과정으로 진행하겠습니다. 또한 기계 설계 기초 과정에서 제작했던 간단한 컨베이어를 실제로 구동하기 위한 내용들을 학습하겠습니다. 외형만 보면 단순한 컨베이어처럼 보일 수 있습니다.","첫 번째는 전기회로 입니다. 전기회로 과정에서는 전기적인 구성만으로 컨베이어 한 대를 왕복 구동해 보겠습니다. 먼저 모터를 구동할 수 있는 회로를 구성했습니다. 센서의 입력을 받아 모터를 동작시키고, 메모리 기능을 추가해 조건에 따라 컨베이어가 정방향 또는 역방향으로 회전하도록 구성했습니다. 이러한 회로는 전기에서 말하는 시퀀스 회로의 기초가 됩니다.","첫 번째는 전기회로 입니다. 전기회로 과정에서는 전기적인 구성만으로 컨베이어 한 대를 왕복 구동해 보겠습니다. 먼저 모터를 구동할 수 있는 회로를 구성했습니다.","두 번째는 PLC입니다. 컨베이어를 전기 회로만으로 왕복 구동하려면 동작 상태를 기억할 수 있는 메모리 기능이 필요했습니다. 전기 회로에서 이러한 역할을 수행하는 대표적인 장치가 릴레이입니다. 공장자동화 시스템에서도 릴레이는 매우 중요한 역할을 했습니다. 하지만 기능이 복잡해질수록 더 많은 릴레이가 필요했고, 회로의 크기와 배선도 함께 증가했습니다.","두 번째는 PLC입니다. 컨베이어를 전기 회로만으로 왕복 구동하려면 동작 상태를 기억할 수 있는 메모리 기능이 필요했습니다. 전기 회로에서 이러한 역할을 수행하는 대표적인 장치가 릴레이입니다.","세 번째는 전자회로입니다. 전기회로에 릴레이가 있다면, 전자회로에는 트랜지스터가 있습니다. 전기와 전자는 서로 겹치는 내용이 많기 때문에 명확하게 구분하기 어려운 경우가 많았습니다. 가볍게 설명할 때는 감전되었을 때 “앗, 따가워”라고 느낄 정도라면 전자이고, “으악” 할 정도라면 전기라는 농담을 하기도 했습니다. 또한 48V를 기준으로 전기와 전자를 나누거나, 릴레이를 사용하면 전기이고 트랜지스터를 사용하면 전자라고 설명하기도 했습니다.","세 번째는 전자회로입니다. 전기회로에 릴레이가 있다면, 전자회로에는 트랜지스터가 있습니다. 전기와 전자는 서로 겹치는 내용이 많기 때문에 명확하게 구분하기 어려운 경우가 많았습니다.","네 번째는 임베디드 환경입니다. 다수의 릴레이 회로를 소형화하고 프로그램으로 제어할 수 있도록 만든 장치가 PLC라면, 트랜지스터 회로와 다양한 전자 기능을 하나의 칩에 집적한 장치가 마이크로컨트롤러입니다. 이러한 마이크로컨트롤러를 이용해 특정 기능을 수행하도록 만든 시스템을 일반적으로 임베디드 시스템이라고 합니다. 임베디드 환경은 크게 운영체제의 사용 여부에 따라 구분할 수 있습니다. 이 과정에서는 운영체제가 없는 환경에서 C 또는 C++를 사용했습니다.","네 번째는 임베디드 환경입니다. 다수의 릴레이 회로를 소형화하고 프로그램으로 제어할 수 있도록 만든 장치가 PLC라면, 트랜지스터 회로와 다양한 전자 기능을 하나의 칩에 집적한 장치가 마이크로컨트롤러입니다. 이러한 마이크로컨트롤러를 이용해 특정 기능을 수행하도록 만든 시스템을 일반적으로 임베디드 시스템이라고 합니다.","다섯 번째는 운영체제입니다. 앞에서는 운영체제가 없는 환경에서 컨베이어와 로봇 시스템을 구동했습니다. 이제는 운영체제가 있는 환경에서 동일한 시스템을 구동해 보았습니다. 이를 위해 Linux를 사용했습니다. 일반 PC에 Linux를 설치해도 되지만, 이 과정에서는 라즈베리파이를 사용했습니다.","여섯 번째는 소프트웨어입니다. 소프트웨어 과정에서는 JavaScript와 Web 환경을 학습했습니다. PLC, 아두이노, 라즈베리파이만으로도 장비를 제어할 수 있었지만, 사용자가 장비를 쉽게 조작할 수 있는 사용자 인터페이스를 구현하는 데에는 한계가 있었습니다. 웹 환경은 PLC, 아두이노, 라즈베리파이에서 구동되는 컨베이어를 외부에서 조작할 수 있는 비교적 간단하고 범용적인 방법을 제공했습니다. 최근에는 바이브 코딩과 자동 코딩 방식이 빠르게 확산되었습니다.","일곱 번째는 ROS2입니다. 앞서 Linux 환경에서 구동했던 컨베이어와 로봇을 ROS2 기반으로도 제어했습니다. ROS2는 Robot Operating System 2의 약자로, 로봇 시스템을 개발하기 위한 소프트웨어 프레임워크입니다. 이름에는 Operating System이 포함되어 있지만 Windows나 Linux와 같은 일반적인 운영체제와는 성격이 다릅니다. Linux와 운영체제를 학습할 때 더 자세히 다루겠지만, 한 사람이 작은 프로그램을 개발할 때는 비교적 자유롭게 구조를 만들 수 있습니다.","마지막으로 이러한 시스템에 인공지능을 결합했습니다. 센서 데이터를 분석하거나, 카메라 영상을 인식하고, 장비의 상태를 판단하는 기능에 인공지능을 활용할 수 있었습니다. 기계 설계에서 시작한 하나의 컨베이어는 전기, PLC, 전자, 임베디드, Linux, 프로그래밍, ROS2, 인공지능으로 확장되었습니다. 각 과정은 서로 분리된 과목처럼 보일 수 있지만, 실제로는 하나의 장비를 동작시키기 위해 유기적으로 연결되어 있었습니다. 그 첫 단계로 컨베이어에 전원을 공급하고 왕복 운전할 수 있도록 구성했습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-01-learning-overview-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
