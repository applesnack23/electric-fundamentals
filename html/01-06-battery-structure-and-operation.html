&lt;h2 id=&quot;%EC%B5%9C%EC%B4%88%EC%9D%98-%EC%A0%84%EC%A7%80---%EB%B3%BC%ED%83%80%EC%A0%84%EC%A7%80&quot;&gt;최초의 전지 - 볼타전지&lt;/h2&gt;
&lt;ul&gt;

&lt;li&gt;전기가 흐를 수 있는 전해질로 소금물에 적신 종이를 사용합니다.&lt;/li&gt;
&lt;/ul&gt;

&lt;h2 id=&quot;%EA%B5%AC%EB%A6%AC%ED%8C%90&quot;&gt;구리판&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;구리판 구리판에서는 아연처럼 금속이 녹아 나오지는 않습니다.&lt;/li&gt;
&lt;li&gt;아연판에 축적된 전자는 도선을 따라 구리판으로 이동합니다.&lt;/li&gt;
&lt;li&gt;이 전자의 이동이 바로 전류입니다.&lt;/li&gt;

&lt;h2 id=&quot;%EB%B3%BC%ED%83%80-%EC%A0%84%EC%A7%80%EC%9D%98-%ED%8A%B9%EC%A7%95&quot;&gt;볼타 전지의 특징&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;수소 기체가 발생하여 성능이 점차 감소합니다.&lt;/li&gt;
&lt;li&gt;한 번 사용하면 다시 충전하여 사용할 수 없습니다.&lt;/li&gt;
&lt;li&gt;출력과 효율이 낮습니다.&lt;/li&gt;
&lt;/ul&gt;

&lt;h2 id=&quot;%EB%A6%AC%ED%8A%AC-%EC%9D%B4%EC%98%A8-%EB%B0%B0%ED%84%B0%EB%A6%AC&quot;&gt;리튬 이온 배터리&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;리튬 이온 배터리 앞에서 살펴본 볼타 전지는 한 번 사용하면 다시 사용할 수 없는 1차 전지입니다.&lt;/li&gt;
&lt;li&gt;현대에는 충전과 방전을 반복할 수 있는 2차 전지가 널리 사용되고 있으며, 그 대표적인 예가 리튬 이온 배터리입니…&lt;/li&gt;
&lt;li&gt;리튬은 매우 가벼우면서도 전자를 잃기 쉬운 금속입니다.&lt;/li&gt;
&lt;li&gt;이러한 특성 덕분에 작은 크기에서도 높은 전압과 높은 에너지 밀도를 얻을 수 있어 스마트폰, 노트북, 전기자동차…&lt;/li&gt;

배터리를 공부하다 보면 생각보다 다양한 종류와 원리가 있다는 것을 알게 됩니다. 하지만 현대의 배터리는 성능을 높이기 위해 많은 기술이 추가되어 있기 때문에 처음부터 이해하기에는 다소 어렵습니다.

배터리를 이해하는 가장 좋은 방법은 가장 단순한 구조의 전지부터 살펴보는 것입니다. 현대의 배터리 역시 이러한 기본 원리를 바탕으로 발전해 왔기 때문입니다.

인류 최초로 지속적인 전류를 만들어 낸 전지는 1800년 알레산드로 볼타(Alessandro Volta)가 발명한 볼타 전지입니다.

볼타 전지가 등장하기 전에는 정전기처럼 순간적으로 발생하는 전기만 사용할 수 있었습니다. 하지만 볼타는 화학 반응을 이용하여 전기를 지속적으로 만들어 낼 수 있는 방법을 고안했고, 이것이 최초의 배터리인 볼타 전지가 되었습니다.

볼타 전지는 매우 단순한 구조를 가지고 있습니다.

- 서로 다른 두 종류의 금속인 아연판(Zn)과 구리판(Cu)을 사용합니다.
- 전기가 흐를 수 있는 전해질로 소금물에 적신 종이를 사용합니다.

볼타는 아연판 → 소금물에 적신 종이 → 구리판의 순서로 여러 층을 쌓아 올려 전지를 만들었습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 구리판

구리판에서는 아연처럼 금속이 녹아 나오지는 않습니다.

아연판에 축적된 전자는 도선을 따라 구리판으로 이동합니다.

이 전자의 이동이 바로 **전류**입니다.

구리판에 도착한 전자는 소금물 속의 수소 이온($H^+$)과 반응하여 수소 기체를 생성합니다.

$$
2H^+ + 2e^- \rightarrow H_2
$$

생성된 수소 기체는 구리판 표면에 작은 기포 형태로 나타납니다.

이와 같이 화학 반응을 이용하여 지속적으로 전자가 이동하면서 전기가 발생합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 볼타 전지의 특징

볼타 전지는 최초로 지속적인 전류를 만들어 낸 전지였지만 몇 가지 단점도 가지고 있었습니다.

- 수소 기체가 발생하여 성능이 점차 감소합니다.
- 한 번 사용하면 다시 충전하여 사용할 수 없습니다.
- 출력과 효율이 낮습니다.

따라서 볼타 전지는 현대의 기준으로는 성능이 뛰어나지 않았지만, 이후 배터리 기술의 출발점이 되었다는 점에서 매우 중요한 의미를 가지고 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리튬 이온 배터리

앞에서 살펴본 볼타 전지는 한 번 사용하면 다시 사용할 수 없는 **1차 전지**입니다.

현대에는 충전과 방전을 반복할 수 있는 **2차 전지**가 널리 사용되고 있으며, 그 대표적인 예가 리튬 이온 배터리입니다.

리튬은 매우 가벼우면서도 전자를 잃기 쉬운 금속입니다. 이러한 특성 덕분에 작은 크기에서도 높은 전압과 높은 에너지 밀도를 얻을 수 있어 스마트폰, 노트북, 전기자동차 등에 가장 많이 사용되고 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리튬 이온 배터리의 구성

리튬 이온 배터리는 크게 네 가지 요소로 구성됩니다.

- 음극(Anode) : 흑연(Graphite, $C_6$)
- 양극(Cathode) : 리튬 코발트 산화물($LiCoO_2$)
- 전해질(Electrolyte) : EC, DMC, DEC 등의 유기 전해액
- 분리막(Separator) : 양극과 음극이 직접 접촉하지 않도록 분리하는 절연막

볼타 전지와 비교하면 다음과 같이 대응할 수 있습니다.

- 음극 → 아연판
- 양극 → 구리판
- 전해질 → 소금물&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리튬 이온 배터리의 충전

충전기를 연결하면 외부 전압이 배터리에 인가됩니다.

외부 전압에 의해 전자는 양극에서 음극으로 강제로 이동합니다.

리튬 이온($Li^+$) 역시 전해질을 통하여 음극으로 이동하며 흑연 내부에 저장됩니다.

이 과정에서 양극의 리튬은 일부만 이동합니다.

예를 들어 $LiCoO_2$ 는 $Li_{0.5}CoO_2$ 또는 $Li_{0.4}CoO_2$ 와 같은 상태가 됩니다.

반대로 음극은 $Li_{0.5}C_6$ 또는 $Li_{0.4}C_6$ 상태가 되면서 리튬 이온을 저장하게 됩니다.

배터리는 리튬 전체가 이동하는 것이 아니라 일부만 이동하면서 충전과 방전을 반복합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리튬 이온 배터리의 방전

충전된 배터리에 부하를 연결하면 저장되어 있던 리튬 이온이 다시 양극으로 이동합니다.

리튬 이온은 전해질을 통하여 이동하고, 전자는 외부 회로를 따라 이동하면서 전기를 공급합니다.

즉,

- 리튬 이온($Li^+$)은 전해질 내부를 이동합니다.
- 전자($e^-$)는 도선을 따라 이동합니다.

이 과정에서 전기 에너지가 발생하며 외부 장치를 동작시킬 수 있습니다.

방전이 계속되어 $Li_{0.5}CoO_2$ 가 다시 $LiCoO_2$ 상태가 되면 더 이상 전압을 만들 수 없으며 배터리는 완전히 방전된 상태가 됩니다.

이후 다시 외부 전압을 인가하면 리튬 이온이 다시 음극으로 이동하면서 충전이 이루어지고, 배터리를 반복해서 사용할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 1차 전지와 2차 전지의 차이

| 구분 | 1차 전지 | 2차 전지 |
| --- | --- | --- |
| 충전 | 불가능 | 가능 |
| 대표 제품 | 알카라인 건전지 | 리튬 이온 배터리 |
| 사용 횟수 | 1회 | 반복 사용 |
| 사용 분야 | 리모컨, 시계 | 스마트폰, 노트북, 전기자동차 |

볼타 전지는 1차 전지의 대표적인 예이며, 리튬 이온 배터리는 현대에서 가장 널리 사용되는 2차 전지입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;10&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리튬이온 배터리

앞서 이야기한 배터리는 한번 사용하고 마는 1차전지였다.

현대에는 충전과 방전을 반복할 수 있는 2차전지를 많이 사용하게 되는데, 이 때 많이 사용되는 재료가 리튬을 사용한 리튬이온 배터리다.

리튬은 지구상에서 가장 전자를 버리고 싶어하는 금속이기에 가볍고 작은 크기로 엄청나게 높은 전압을 만들어 낼 수 있다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;11&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리튬 이론 배터리의 4대 구성 요소

- 음극 (=아연판): $C_6$
- 양극 (=구리판): $LiCoO_2$
- 유기 화합물 (=소금물): EC, DMC, DEC

#### 리튬 이온 배터리의 충전과 방전

충전지에 외부 전압을 강제 입력하면, 전자가 도선을 통해 음극으로 강제 이동 되는데,

이 때 $Li^+$ 는 유기 화합물에 녹아  $Li_{0.5}CoO_2$ ~ $Li_{0.4}CoO_2$ 가 되며,
(리튬 전체가 이동하게 되면 배터리 기능을 할 수 없다.)

마찬가지로 음극은 $Li_{0.5}C_6$ ~ $Li_{0.4}C_6$ 이 된다.

충전지를 해제한 상태에서 음극과 양극을 도선으로 연결하면 $Li^+$ 는 유기화합물로 녹아 양극으로 이동하며, 전자($e^-$) 는 도선을 통해 양극으로 이동하며 전기를 발생시킨다. 이 때, $Li_{0.5}CoO_2$ 이 $LiCoO_2$ 되면 완전히 방전된 상태로 더 이상 전압을 만들어 내지 않는다.

다시 외부 전압을 강제 입력하면, 음극은 $Li_{0.5}C_6$ 이 되고, 양극은 $Li_{0.5}CoO_2$ 이 되서 전압을 만들 수 있는 상태가 됩니다.&lt;/p&gt;&lt;/div&gt;&lt;script&gt;/*!! License: https://unpkg.com/@marp-team/marp-cli@4.5.0/lib/bespoke.js.LICENSE.txt */

  <script>window.VIEWER_CONFIG={"scripts":["<article>\n  <h2>슬라이드 1. 1-06. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리)<\/h2>\n  <p class=\"screen\">[화면] 1-06. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>안녕하세요. 1-06. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리) 내용을 시작하겠습니다. 1-06. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리)의 핵심 개념을 실제 전기·전자 시스템과 연결해 학습하겠습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 2. 최초의 전지 - 볼타전지<\/h2>\n  <p class=\"screen\">[화면] 최초의 전지 - 볼타전지<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>최초의 전지 - 볼타전지 배터리를 공부하다 보면 생각보다 다양한 종류와 원리가 있다는 것을 알게 됩니다. 하지만 현대의 배터리는 성능을 높이기 위해 많은 기술이 추가되어 있기 때문에 처음부터 이해하기에는 다소 어렵습니다. 배터리를 이해하는 가장 좋은 방법은 가장 단순한 구조의 전지부터 살펴보는 것입니다. 현대의 배터리 역시 이러한 기본 원리를 바탕으로 발전해 왔기 때문입니다. 인류 최초로 지속적인 전류를 만들어 낸 전지는 1800년 알레산드로 볼타(Alessandro Volta)가 발명한 볼타 전지입니다. 볼타 전지가 등장하기 전에는 정전기처럼 순간적으로 발생하는 전기만 사용할 수 있었습니다. 하지만 볼타는 화학 반응을 이용하여 전기를 지속적으로 만들어 낼 수 있는 방법을 고안했고, 이것이 최초의 배터리인 볼타 전지가 되었습니다. 볼타 전지는 매우 단순한 구조를 가지고 있습니다. 서로 다른 두 종류의 금속인 아연판(Zn)과 구리판(Cu)을 사용합니다. 전기가 흐를 수 있는 전해질로 소금물에 적신 종이를 사용합니다. 볼타는 아연판 → 소금물에 적신 종이 → 구리판의 순서로 여러 층을 쌓아 올려 전지를 만들었습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 3. 아연판<\/h2>\n  <p class=\"screen\">[화면] 아연판<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>아연판 아연은 금속 원소이므로 내부에서는 금속 결합을 하고 있습니다. 금속 결합은 양이온인 $Zn^{2+}$ 사이를 자유전자가 이동하며 결합을 유지하는 구조입니다. 아연판이 소금물과 만나면 일부 아연 원자가 전자를 잃고 이온화됩니다. $$ Zn \\rightarrow Zn^{2+} + 2e^- $$ 생성된 아연 이온($Zn^{2+}$)은 소금물 속으로 녹아 들어가고, 잃어버린 전자는 아연판 내부에 남게 됩니다. 이 과정이 계속되면서 아연판에는 전자가 점점 많아지고, 결과적으로 음극(-극)이 형성됩니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 4. 구리판<\/h2>\n  <p class=\"screen\">[화면] 구리판<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>구리판 구리판에서는 아연처럼 금속이 녹아 나오지는 않습니다. 아연판에 축적된 전자는 도선을 따라 구리판으로 이동합니다. 이 전자의 이동이 바로 전류입니다. 구리판에 도착한 전자는 소금물 속의 수소 이온($H^+$)과 반응하여 수소 기체를 생성합니다. $$ 2H^+ + 2e^- \\rightarrow H_2 $$ 생성된 수소 기체는 구리판 표면에 작은 기포 형태로 나타납니다. 이와 같이 화학 반응을 이용하여 지속적으로 전자가 이동하면서 전기가 발생합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 5. 볼타 전지의 특징<\/h2>\n  <p class=\"screen\">[화면] 볼타 전지의 특징<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>볼타 전지의 특징 볼타 전지는 최초로 지속적인 전류를 만들어 낸 전지였지만 몇 가지 단점도 가지고 있었습니다. 수소 기체가 발생하여 성능이 점차 감소합니다. 한 번 사용하면 다시 충전하여 사용할 수 없습니다. 출력과 효율이 낮습니다. 따라서 볼타 전지는 현대의 기준으로는 성능이 뛰어나지 않았지만, 이후 배터리 기술의 출발점이 되었다는 점에서 매우 중요한 의미를 가지고 있습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 6. 리튬 이온 배터리<\/h2>\n  <p class=\"screen\">[화면] 리튬 이온 배터리<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>리튬 이온 배터리 앞에서 살펴본 볼타 전지는 한 번 사용하면 다시 사용할 수 없는 1차 전지입니다. 현대에는 충전과 방전을 반복할 수 있는 2차 전지가 널리 사용되고 있으며, 그 대표적인 예가 리튬 이온 배터리입니다. 리튬은 매우 가벼우면서도 전자를 잃기 쉬운 금속입니다. 이러한 특성 덕분에 작은 크기에서도 높은 전압과 높은 에너지 밀도를 얻을 수 있어 스마트폰, 노트북, 전기자동차 등에 가장 많이 사용되고 있습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 7. 리튬 이온 배터리의 구성<\/h2>\n  <p class=\"screen\">[화면] 리튬 이온 배터리의 구성<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>리튬 이온 배터리의 구성 리튬 이온 배터리는 크게 네 가지 요소로 구성됩니다. 음극(Anode) : 흑연(Graphite, $C_6$) 양극(Cathode) : 리튬 코발트 산화물($LiCoO_2$) 전해질(Electrolyte) : EC, DMC, DEC 등의 유기 전해액 분리막(Separator) : 양극과 음극이 직접 접촉하지 않도록 분리하는 절연막 볼타 전지와 비교하면 다음과 같이 대응할 수 있습니다. 음극 → 아연판 양극 → 구리판 전해질 → 소금물<\/p>\n<\/article>","<article>\n  <h2>슬라이드 8. 리튬 이온 배터리의 충전<\/h2>\n  <p class=\"screen\">[화면] 리튬 이온 배터리의 충전<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>리튬 이온 배터리의 충전 충전기를 연결하면 외부 전압이 배터리에 인가됩니다. 외부 전압에 의해 전자는 양극에서 음극으로 강제로 이동합니다. 리튬 이온($Li^+$) 역시 전해질을 통하여 음극으로 이동하며 흑연 내부에 저장됩니다. 이 과정에서 양극의 리튬은 일부만 이동합니다. 예를 들어 $LiCoO_2$ 는 $Li_{0.5}CoO_2$ 또는 $Li_{0.4}CoO_2$ 와 같은 상태가 됩니다. 반대로 음극은 $Li_{0.5}C_6$ 또는 $Li_{0.4}C_6$ 상태가 되면서 리튬 이온을 저장하게 됩니다. 배터리는 리튬 전체가 이동하는 것이 아니라 일부만 이동하면서 충전과 방전을 반복합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 9. 리튬 이온 배터리의 방전<\/h2>\n  <p class=\"screen\">[화면] 리튬 이온 배터리의 방전<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>리튬 이온 배터리의 방전 충전된 배터리에 부하를 연결하면 저장되어 있던 리튬 이온이 다시 양극으로 이동합니다. 리튬 이온은 전해질을 통하여 이동하고, 전자는 외부 회로를 따라 이동하면서 전기를 공급합니다. 즉, 리튬 이온($Li^+$)은 전해질 내부를 이동합니다. 전자($e^-$)는 도선을 따라 이동합니다. 이 과정에서 전기 에너지가 발생하며 외부 장치를 동작시킬 수 있습니다. 방전이 계속되어 $Li_{0.5}CoO_2$ 가 다시 $LiCoO_2$ 상태가 되면 더 이상 전압을 만들 수 없으며 배터리는 완전히 방전된 상태가 됩니다. 이후 다시 외부 전압을 인가하면 리튬 이온이 다시 음극으로 이동하면서 충전이 이루어지고, 배터리를 반복해서 사용할 수 있습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 10. 1차 전지와 2차 전지의 차이<\/h2>\n  <p class=\"screen\">[화면] 1차 전지와 2차 전지의 차이<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>1차 전지와 2차 전지의 차이<\/p>\n<\/article>","<article>\n  <h2>슬라이드 11. 리튬이온 배터리<\/h2>\n  <p class=\"screen\">[화면] 리튬이온 배터리<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>리튬이온 배터리 앞서 이야기한 배터리는 한번 사용하고 마는 1차전지였다. 현대에는 충전과 방전을 반복할 수 있는 2차전지를 많이 사용하게 되는데, 이 때 많이 사용되는 재료가 리튬을 사용한 리튬이온 배터리다. 리튬은 지구상에서 가장 전자를 버리고 싶어하는 금속이기에 가볍고 작은 크기로 엄청나게 높은 전압을 만들어 낼 수 있다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 12. 리튬 이론 배터리의 4대 구성 요소<\/h2>\n  <p class=\"screen\">[화면] 리튬 이론 배터리의 4대 구성 요소<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>리튬 이론 배터리의 4대 구성 요소 음극 (=아연판): $C_6$ 양극 (=구리판): $LiCoO_2$ 유기 화합물 (=소금물): EC, DMC, DEC 리튬 이온 배터리의 충전과 방전 충전지에 외부 전압을 강제 입력하면, 전자가 도선을 통해 음극으로 강제 이동 되는데, 이 때 $Li^+$ 는 유기 화합물에 녹아 $Li_{0.5}CoO_2$ ~ $Li_{0.4}CoO_2$ 가 되며, (리튬 전체가 이동하게 되면 배터리 기능을 할 수 없다.) 마찬가지로 음극은 $Li_{0.5}C_6$ ~ $Li_{0.4}C_6$ 이 된다. 충전지를 해제한 상태에서 음극과 양극을 도선으로 연결하면 $Li^+$ 는 유기화합물로 녹아 양극으로 이동하며, 전자($e^-$) 는 도선을 통해 양극으로 이동하며 전기를 발생시킨다. 이 때, $Li_{0.5}CoO_2$ 이 $LiCoO_2$ 되면 완전히 방전된 상태로 더 이상 전압을 만들어 내지 않는다. 다시 외부 전압을 강제 입력하면, 음극은 $Li_{0.5}C_6$ 이 되고, 양극은 $Li_{0.5}CoO_2$ 이 되서 전압을 만들 수 있는 상태가 됩니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 13. 핵심 내용 정리<\/h2>\n  <p class=\"screen\">[화면] 핵심 내용 정리<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>1-06. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리)에서 살펴본 개념은 이후 장의 회로 구성과 장치 제어를 이해하는 기초가 됩니다. 핵심 용어와 동작 흐름을 다시 확인한 뒤 다음 내용으로 넘어가겠습니다.<\/p>\n<\/article>"]};</script>
