&lt;ul&gt;

&lt;li&gt;그러나 일부 전류가 사람이나 장비 외함, 접지선을 통해 대지로 누설되면 L선과 N선의 전류가 서로 달라집니다.&lt;/li&gt;

전기회로에서는 정상적인 운전 전류보다 큰 전류가 흐르거나, 절연 불량으로 누설전류가 발생하는 등 다양한 이상 상태가 발생할 수 있습니다.

이러한 이상 상태를 그대로 방치하면 케이블과 부품이 과열되고 장비가 손상되며, 심한 경우에는 감전과 화재로 이어질 수 있습니다.

따라서 전기회로에서는 회로와 사람을 보호하기 위한 다양한 보호 장치를 사용합니다.

이번에는 퓨즈, 배선용 차단기, 회로 보호기, 누전 차단기와 같은 보호 장치를 살펴보고, 모터 회로에 사용하는 전자접촉기와 전자식 과전류 계전기의 역할도 함께 알아보겠습니다.

## Fuse

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-01.png)

퓨즈는 전기회로에 과전류가 흐르면 내부의 가는 도체가 열에 의해 녹아 끊어지면서 회로를 차단하는 보호 장치입니다.

퓨즈는 구조가 단순하며 비교적 저렴한 비용으로 과전류와 단락 사고로부터 회로를 보호할 수 있습니다.

**장점**

- 구조가 단순합니다.
- 가격이 비교적 저렴합니다.
- 차단 용량과 종류에 따라 매우 빠르게 회로를 차단할 수 있습니다.
- 별도의 기계적 동작 장치가 필요하지 않습니다.

**단점**

- 한 번 차단되면 다시 사용할 수 없습니다.
- 차단 후 새 퓨즈로 교체해야 합니다.
- 규격이 다른 퓨즈를 잘못 장착하면 회로를 보호하지 못할 수 있습니다.

퓨즈는 용도와 전류, 전압, 차단 용량, 동작 속도에 따라 다양한 종류가 있으며 일반적으로 전용 퓨즈 홀더와 함께 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 배선용 차단기 MCCB (=Molded Case Circuit Breaker)

MCCB는 Molded Case Circuit Breaker의 약자로, 배선과 전력 회로를 과전류 및 단락으로부터 보호하는 차단기입니다.

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-02.png)

일반적인 열동·전자식 MCCB는 다음 두 가지 방식으로 이상 전류를 검출합니다.

- 과부하 전류: 바이메탈의 열 변형을 이용하여 차단합니다.
- 단락 전류: 전자석의 자기력을 이용하여 빠르게 차단합니다.

따라서 MCCB는 단순히 열이 발생해야만 동작하는 장치라기보다, 과부하와 단락에 각각 다른 트립 원리를 사용하는 경우가 많습니다.

MCCB는 퓨즈와 달리 사고 원인을 제거한 후 손잡이를 조작하여 다시 사용할 수 있습니다.

제품에 따라 다음과 같이 극수가 구분됩니다.

- 2극
- 3극
- 4극

MCCB는 국내외 일부 현장에서 NFB(No-Fuse Breaker)라고 부르기도 합니다. 그러나 국제적으로는 MCCB라는 명칭을 사용하는 것이 더 명확합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 배선용 차단기의 선정

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-03.png)

MCCB를 선정할 때에는 다음 항목을 함께 확인해야 합니다.

- 정격전압
- 정격전류
- 극수
- 차단 용량
- 연결되는 케이블의 허용전류
- 부하의 기동전류
- 설치 환경과 주위 온도

차단기의 정격전류는 부하의 정상 운전 전류보다 커야 하지만, 케이블의 허용전류를 초과해서는 안 됩니다.

또한 예상되는 단락전류보다 충분히 큰 정격 차단 용량을 가진 제품을 선택해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 소형 차단기 MCB (=Miniature Circuit Breaker)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-04.png)

MCB는 Miniature Circuit Breaker의 약자로, 비교적 작은 용량의 분기 회로를 보호하는 소형 차단기입니다.

주로 다음과 같은 곳에 사용합니다.

- 조명 회로
- 콘센트 회로
- 소형 제어 회로
- 제어반 내부의 분기 회로

MCB 역시 과부하와 단락 보호 기능을 제공하지만, 일반적으로 MCCB보다 정격전류와 차단 용량의 범위가 작습니다.

## 회로 보호기 CP (=Circuit Protector)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-05.png)

회로 보호기(CP)는 제어회로와 전자회로의 소전류 분기 회로를 보호하기 위해 사용하는 장치입니다.

제품에 따라 다양한 시간-전류 특성을 선택할 수 있습니다.

- 순시형
- 고속형
- 중속형
- 저속형

다만 `순시형`, `고속형`, `중속형`, `저속형`의 정확한 동작 시간은 제조사와 모델마다 다르므로 제품의 시간-전류 특성표를 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### MCB·MCCB와 CP의 차이

MCCB와 MCB는 주로 배선과 전력 회로를 과전류 및 단락으로부터 보호합니다.

CP는 비교적 작은 제어회로나 전자부품이 연결된 분기 회로를 보호하는 용도로 많이 사용합니다.

| 구분 | MCCB·MCB | CP |
| --- | --- | --- |
| 주요 보호 대상 | 배선과 전력 회로 | 제어회로와 소형 부품 |
| 일반적인 용량 | 소형부터 대용량 | 주로 소용량 |
| 차단 특성 | 과부하·단락 보호 | 제품별 빠른 트립 특성 선택 가능 |
| 재사용 | 가능 | 가능 |
| 주요 사용 위치 | 주회로와 분기회로 | 제어반 내부 소형 분기회로 |

차단기의 명칭만으로 보호 성능을 판단해서는 안 됩니다. 실제 차단 속도와 보호 범위는 반드시 제조사의 시간-전류 곡선을 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 전자접촉기 (Magnetic Contactor)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-06.png)

전자접촉기(MC)는 모터나 히터와 같은 대용량 부하의 전원을 반복적으로 연결하고 차단하는 전자식 스위치입니다.

전자접촉기는 다음과 같이 동작합니다.

1. 코일에 제어 전원을 공급합니다.
2. 코일에서 자기장이 발생합니다.
3. 전자석의 힘으로 주접점이 연결됩니다.
4. 주접점을 통해 부하에 전원이 공급됩니다.
5. 보조접점을 통해 접촉기의 동작 상태를 확인하거나 시퀀스 회로를 구성합니다.

전자접촉기는 큰 전류를 자주 개폐할 수 있도록 설계되며, 접점에서 발생하는 아크를 줄이기 위한 아크 소호 구조를 가지고 있습니다.

전자접촉기는 부하의 전원을 개폐하는 장치이며, 그 자체만으로 모터의 과부하를 완전히 보호하는 장치는 아닙니다.

따라서 일반적으로 차단기 및 과부하 계전기와 조합하여 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 누전 차단기 ELCB

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-07.png)

누전 차단기는 회로에서 누설전류를 검출하면 전원을 차단하여 감전과 누전화재를 방지하는 장치입니다. ELB, ELCB 등의 명칭을 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 변류기 CT (=Current Transformer)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-08.png)

변류기(CT)는 큰 교류 전류를 측정 장치에서 사용할 수 있는 작은 전류로 변환하는 장치입니다.

도선에 교류 전류가 흐르면 주변에 변화하는 자기장이 형성되고, 이 자기장이 CT의 2차측 권선에 전류를 유도합니다.

1차측 전류와 2차측 전류의 비율을 변류비라고 합니다.

예를 들어 CT의 변류비가 100/5A라면 다음과 같습니다.

- 1차측 전류: 100A
- 2차측 전류: 5A
- 변류비: 20:1

따라서 2차측에서 3A가 측정되었다면 1차측 전류는 다음과 같습니다.

3A × 20 = 60A

CT를 사용할 때에는 정격 부담, 정확도 등급, 정격 주파수와 변류비를 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 변류기 + 전류계

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-09.png)

큰 전류를 직접 전류계에 연결하기 어려운 경우 CT를 사용하여 전류를 축소한 후 전류계에 입력합니다.

전류계는 CT의 변류비를 기준으로 실제 1차측 전류를 표시합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;10&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 전류 측정 테스터기

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-10.png)

전류 측정기는 케이블을 분리하지 않고도 전류를 측정할 수 있는 장비입니다.

교류용 전류 측정기는 CT와 유사하게 도선 주변의 자기장을 검출하여 전류를 측정합니다.

DC 전류까지 측정할 수 있는 전류 측정기는 일반적으로 홀 효과 센서를 사용합니다.

측정할 때에는 여러 가닥을 한 번에 물리지 않고 측정하려는 한 가닥의 케이블만 클램프 내부에 넣어야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;11&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 영상 변류기 ZCT (=Zero Current Transformer)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-11.png)

영상 변류기(ZCT)는 회로를 통해 나가는 전류와 되돌아오는 전류의 차이를 측정합니다.

정상적인 단상 회로에서는 다음 관계가 성립합니다.

L선을 통해 나간 전류 = N선을 통해 되돌아온 전류

따라서 두 전류의 벡터 합은 0이 됩니다.

그러나 일부 전류가 사람이나 장비 외함, 접지선을 통해 대지로 누설되면 L선과 N선의 전류가 서로 달라집니다.

ZCT는 이 차이인 잔류전류를 검출합니다.

3상 회로에서는 R, S, T와 필요한 경우 N을 모두 ZCT 내부로 통과시켜 정상 전류의 합이 0이 되도록 구성합니다.

보호접지선(PE)은 ZCT 내부를 통과시키지 않습니다.

이것이 누전 차단기의 원리 입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;12&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 누전 (누설 전류)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-12.png)

누설전류가 설정값을 초과하면 누전 보호 장치가 차단 신호를 발생시켜 회로의 전원을 차단합니다.

기존의 일반적인 AC형 누전 검출 장치는 순수한 교류 누설전류에 적합합니다.

그러나 인버터, SMPS, 전기자동차 충전기처럼 전력 반도체를 사용하는 장비에서는 맥동 DC나 평활 DC 성분이 포함된 누설전류가 발생할 수 있습니다.

이러한 회로에는 누설전류의 파형에 맞는 RCD 타입을 선택해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;13&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### RCD의 종류

RCD는 검출할 수 있는 잔류전류의 파형에 따라 구분합니다.

- Type AC: 정현파 AC 잔류전류를 검출합니다.
- Type A: AC와 맥동 DC 잔류전류를 검출합니다.
- Type F: 단상 인버터 부하에서 발생할 수 있는 복합 주파수 잔류전류에 대응합니다.
- Type B: AC, 맥동 DC 및 평활 DC 잔류전류를 검출할 수 있습니다.

전기자동차 충전기, 태양광 인버터, 주파수 인버터 등에서는 장비 제조사가 요구하는 RCD 타입을 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;14&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 다양한 차단기의 종류

전압과 차단 용량, 절연 및 아크 소호 방식에 따라 여러 종류의 차단기가 사용됩니다.

- MCB: 소형 차단기
- MCCB: 배선용 차단기
- ACB: 기중 차단기
- OCB: 유입 차단기
- VCB: 진공 차단기
- GCB: 가스 차단기
- MCB 또는 MBB로 불리는 자기 차단기 계열

저압 제어반에서는 MCB와 MCCB를 많이 사용하며, 고압·특고압 설비에서는 VCB와 GCB 등을 사용하지만 일반적인 자동화 설비에서는 잘 사용되지 않습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;15&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 잘못된 도면 표기

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-13.png)

현장 도면에서는 잘못된 도면 표기법이 많습니다.

IEC 규격에 따르면 전부 다르게 표현 되어야 하지만 동일하게 표기된 도면도 많고 잘못된 표기 방법도 많습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;16&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 도면 제작과 해석 방법

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-14.png)

도면을 그리는 사람은 정확한 규격대로 설계를 하면 좋겠지만 잘 되지 않는것이 현실입니다. 규격을 정확하게 지키는 것도 중요하지만, 더 중요한 것은 도면을 해석하는 사람이 불편을 겪지 않도록 표기 방법보다는 이름을 정확하게 정의하고, 제품의 모델명과 사양을 정확하게 기입하는 것입니다.

그러면, 해석하는 사람도 도면의 모델명을 보고 정확하게 해석할 수 있게 됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;17&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### SYMBOL LIST

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-15.png)

설계자는 전기 도면에 사용한 심벌과 약어를 정리한 Symbol List를 작성해야 합니다.

Symbol List 에 의도한 사양을 정확하게 정의 하는 것입니다. 그렇게 되면 추후에 잘못된 심벌을 관리하기에도 좋고, 또 잘못되었더라도 다른 사람이 설계자의 의도를 정확하게 이해할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;18&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 모터 보호 회로

모터는 기동할 때 정격전류보다 큰 기동전류가 흐르고, 운전 중에는 과부하나 결상, 구속 등의 이상 상태가 발생할 수 있습니다.

따라서 모터 회로에는 다음 기능이 필요합니다.

- 단락 보호
- 배선 보호
- 과부하 보호
- 전원 개폐
- 필요 시 결상 및 지락 보호

이 기능은 하나의 장치가 아니라 여러 장치를 조합하여 구성하는 경우가 많습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;19&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 전자식 과부하 계전기 (EOCR)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-16.png)

EOCR은 Electronic Over Current Relay의 약자로, 모터에 흐르는 전류를 감시하여 과부하, 결상, 불평형 등의 이상 상태를 검출하는 보호 계전기입니다.

EOCR은 모터 전원을 직접 차단하는 주접점을 가지고 있지 않은 경우가 많습니다.

따라서 이상 상태를 검출하면 EOCR의 출력 접점을 이용해 MC 코일 회로를 차단합니다.

결과적으로 MC의 주접점이 열리면서 모터 전원이 차단됩니다.

EOCR의 주요 설정 항목은 제품마다 다르지만 일반적으로 다음과 같습니다.

- LOAD 또는 Current: 모터 정격전류 설정
- D-TIME: 기동 중 큰 전류를 허용하는 지연 시간
- O-TIME: 운전 중 과전류가 지속될 때 차단하기까지의 지연 시간&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;20&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### EOCR 설정 방법

EOCR의 정확한 설정 방법은 반드시 제조사 매뉴얼과 모터 명판 정보를 기준으로 해야 합니다.

일반적인 설정 순서는 다음과 같습니다.

1. 모터 명판의 정격전류를 확인합니다.
2. LOAD 값을 모터 정격전류에 맞게 설정합니다.
3. 실제 기동 시간을 측정합니다.
4. D-TIME은 정상적인 기동 시간이 지나도록 여유를 두고 설정합니다.
5. O-TIME은 부하 특성과 허용 가능한 과부하 시간을 고려하여 설정합니다.
6. 실제 과부하 및 결상 시험이 가능한 경우 보호 동작을 확인합니다.

D-TIME과 O-TIME을 단순히 합산하여 항상 그 시간 뒤에 차단된다고 해석해서는 안 됩니다.

D-TIME은 주로 기동 구간을 무시하기 위한 시간이며, O-TIME은 기동 이후 과전류가 발생했을 때의 동작 지연 시간입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;21&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 일반적인 모터 구동 회로

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-17.png)

일반적인 모터 주회로는 다음 순서로 구성할 수 있습니다.

1. R, S, T 전원이 인가됩니다.
2. MCCB 또는 모터 보호 차단기를 통과합니다.
3. MC의 주접점을 통과합니다.
4. 과부하 계전기 또는 EOCR의 전류 검출부를 통과합니다.
5. 모터에 전원이 공급됩니다.

MC 코일이 ON되면 주접점이 닫히고 모터에 전원이 공급됩니다.

MCCB만 설치한 회로는 단락과 배선을 보호할 수 있지만, 설정과 제품 특성에 따라 모터의 지속적인 과부하를 충분히 보호하지 못할 수 있습니다.

따라서 일반적인 모터 회로에는 과부하 계전기, EOCR 또는 모터 보호용 차단기를 함께 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;22&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### AC-3와 AC-4 사용 범주

IEC 60947-4-1 에 정의된 부하 등급

- AC-3: 일반적인 모터 부하
- AC-4: 빈번한 기동/정지 부하

AC-3와 AC-4는 전자접촉기와 모터 스터터를 선정할 때 사용하는 대표적인 사용 범주입니다.

**AC-3**

일반적인 농형 유도 모터의 기동과 정상 운전 중 정지를 기준으로 합니다.

모터가 정상 속도에 도달한 후 접촉기를 개방하는 일반적인 운전에 사용합니다.

대표적인 적용 사례는 다음과 같습니다.

- 일반 컨베이어
- 펌프
- 팬
- 압축기

**AC-4**

플러깅, 인칭, 조깅, 빈번한 정·역회전처럼 높은 전류 상태에서 접점을 자주 개폐하는 운전을 기준으로 합니다.

대표적인 적용 사례는 다음과 같습니다.

- 빈번한 정·역회전
- 인칭 운전
- 조깅 운전
- 크레인과 호이스트
- 위치 맞춤을 위한 반복 운전

AC-4는 AC-3보다 접점에 훨씬 큰 전기적·기계적 부담을 줍니다.

따라서 같은 모터라도 AC-4 운전에서는 더 큰 용량의 접촉기가 필요할 수 있습니다.

**MCCB 선정**

- AC-3: 정격전류의 2.5 ~ 3배수
- AC-4: 정격전류의 3 ~ 3.5배수

**MC 선정**

- AC-3: 정격전류의 1.5 ~ 2배수
- AC-4: 정격전류의 2 ~ 2.5배수&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;23&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 역률

역률은 피상전력 중 실제로 일을 하는 유효전력의 비율입니다.

코일과 캐패시터가 포함된 교류 회로에서는 전압과 전류 사이에 위상차가 발생하여 무효전력이 생깁니다.

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-18.png)&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;24&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 효율

효율은 입력 전력 중 기계적인 출력으로 변환되는 비율입니다

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-19.png)

모터에서는 손실이 발생하므로 입력 전력이 모두 출력으로 변환되지는 않습니다.

정확한 역률과 효율은 모터 명판 또는 제조사 데이터시트를 확인해야 합니다.

명판 또는 제조사 데이터시트를 확인할 수 없는 경우에는 역률 0.9, 효율 0.9 와 같은 가정값을 사용하기도 하지만, 해당 모터의 사양을 적용하는 것이 가장 정확합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;25&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3상 모터의 정격전류 계산

3상 모터의 입력 전력은 다음과 같이 계산합니다.

$$

P_{in} = \sqrt{3} \times V_L \times I_L \times PF

$$

모터의 기계적 출력과 효율을 함께 고려하면 다음과 같습니다.

따라서 선전류는 다음과 같이 계산할 수 있습니다.

$$

\frac{P_{out}}

{\sqrt{3}\times V_L\times PF\times \eta}

$$

- $P_{out}$: 모터 출력
- $V_L$: 선간전압
- $I_L$: 선전류
- $PF$: 역률
- $\eta$: 효율&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;26&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 모터 전류 계산 예제

380V 3상 1kW 모터를 예로 들어보겠습니다.

다음과 같이 가정합니다.

- 출력: 1,000W
- 선간전압: 380V
- 역률: 0.9
- 효율: 0.9

$$
\frac{1000}
{\sqrt{3}\times380\times0.9\times0.9}
$$

계산 결과는 약 1.88A입니다.

따라서 이 모터의 예상 정격전류는 약 1.9A입니다.

만약 모터 명판이나 사양을 정확하게 확인할 수 있다면, 계산값보다 우선해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;27&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 차단기 선정 예제

MCCB 선정

- AC-3: 정격전류의 2.5 ~ 3배수
- AC-4: 정격전류의 3 ~ 3.5배수

MC 선정

- AC-3: 정격전류의 1.5 ~ 2배수
- AC-4: 정격전류의 2 ~ 2.5배수

AC-3 일 때, MC 는 3A, MCCB 는 5A

AC-4 일 때, MC 는 4A, MCCB 는 6A&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;28&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 여러 모터가 연결된 메인 차단기

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-20.png)

여러 모터가 하나의 메인 차단가에 연결된 경우 각 모터의 분기 보호 장치와 메인 차단기를 구분하여 선정해야 합니다.

메인 차단기의 용량을 단순히 각 모터용 차단기 정격의 합으로 계산하면 지나치게 크게 선정될 수 있습니다.

다음 항목을 함께 고려해야 합니다.

- 동시에 운전하는 모터의 수
- 동시에 기동할 가능성
- 가장 큰 모터의 기동 전류

예를 들어 3대의 모터가 동시에 운전하지만 한 대씩 순차적으로 기동한다면, 세 모터의 기동전류가 동시에 발생하지 않습니다.

3배 + 3배 + 3배는 약 15A 가 되며, 너무 큰 차단기가 선정이 되며, 메인차단기가 트립 될 수 있는 상태는 거의 없을 것입니다.

따라서 실제 운전 시나리오를 기준으로 메인 차단기를 선정해야 합니다.

원가 절감을 위해 지나치게 작은 차단기를 사용하면 불필요한 트립과 설비 정지가 발생할 수 있습니다. 반대로 지나치게 큰 차단기를 사용하면 케이블과 설비를 제대로 보호하지 못할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;29&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 계전기가 포함된 모터 구동 회로

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-21.png)

계전기가 포함된 모터 구동 회로에서는 EOCR 또는 과부하 계전기의 정상닫힘 접점을 MC 코일 회로에 직렬로 연결합니다.

모터 과부하가 검출되면 계전기의 접점이 열리고 MC 코일의 전원이 차단됩니다.

MC 코일이 OFF되면 주접점이 열리면서 모터의 전원이 차단됩니다.

시퀀스 회로의 구체적인 동작과 자기유지 회로는 이후 시퀀스 회로 장에서 자세히 살펴보겠습니다.

## N/F (=Noise Filter)

![전기회로의 보호와 모터 보호 장치](../assets/16-circuit-and-motor-protection-22.png)

노이즈 필터는 전원선을 통해 유입되거나 외부로 방출되는 고주파 노이즈를 줄이는 장치입니다.

주로 다음과 같은 장비의 입력단에 사용합니다.

- 인버터
- 서보 드라이브
- SMPS
- 산업용 제어 장비
- 정밀 측정 장비

노이즈 필터는 정격전압과 정격전류에 맞게 선정해야 하며, 접지 단자를 올바르게 연결해야 충분한 효과를 얻을 수 있습니다.

또한 노이즈 필터만 설치한다고 모든 노이즈 문제가 해결되는 것은 아닙니다.

다음 항목을 함께 고려해야 합니다.

- 보호접지
- 쉴드 케이블
- 동력선과 신호선의 분리
- 배선 거리
- 필터의 설치 위치
- 인버터와 모터 케이블 길이
- 제어반 내부의 접지 구조

## 차단기 선정

일반적으로 정격전류보다 조금 크게 선정하면 된다.

다만, 코일은 돌입전류 때문에 2.5배수 혹은 3배수를 계산해서 차단기를 선정해야 한다.

- 가장 정확한 것은 해당하는 차단기 특성과 부하의 돌입 전류 특성 그래프를 확인해야 하지만 현실적으로 어렵다.
- 변압기의 경우 130% 선에서 선정
- 모터의 경우 200% ~ 300% 선에서 선정

차단기 선정시 모터의 경우 2~3배의 안전률을 사용하기 때문에 모터는 보호할 수 없다.

- MCCB 의 경우 차단 속도가 느리기 때문에 2.5배 정도 사용
- CP의 경우 차단 속도가 빠르기 때문에 3배 정도 사용 (일반적으로 모터에 CP는 부적절 하기는 하다.)&lt;/p&gt;&lt;/div&gt;&lt;script&gt;/*!! License: https://unpkg.com/@marp-team/marp-cli@4.5.0/lib/bespoke.js.LICENSE.txt */

  <script>window.VIEWER_CONFIG={"scripts":["<article>\n  <h2>슬라이드 1. 1-16. 전기회로의 보호와 모터 보호 장치<\/h2>\n  <p class=\"screen\">[화면] 1-16. 전기회로의 보호와 모터 보호 장치<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>안녕하세요. 1-16. 전기회로의 보호와 모터 보호 장치 내용을 시작하겠습니다. 1-16. 전기회로의 보호와 모터 보호 장치의 핵심 개념을 실제 전기·전자 시스템과 연결해 학습하겠습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 2. Fuse<\/h2>\n  <p class=\"screen\">[화면] Fuse<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>전기회로에서는 정상적인 운전 전류보다 큰 전류가 흐르거나, 절연 불량으로 누설전류가 발생하는 등 다양한 이상 상태가 발생할 수 있습니다. 이러한 이상 상태를 그대로 방치하면 케이블과 부품이 과열되고 장비가 손상되며, 심한 경우에는 감전과 화재로 이어질 수 있습니다. 따라서 전기회로에서는 회로와 사람을 보호하기 위한 다양한 보호 장치를 사용합니다. 이번에는 퓨즈, 배선용 차단기, 회로 보호기, 누전 차단기와 같은 보호 장치를 살펴보고, 모터 회로에 사용하는 전자접촉기와 전자식 과전류 계전기의 역할도 함께 알아보겠습니다. Fuse 퓨즈는 전기회로에 과전류가 흐르면 내부의 가는 도체가 열에 의해 녹아 끊어지면서 회로를 차단하는 보호 장치입니다. 퓨즈는 구조가 단순하며 비교적 저렴한 비용으로 과전류와 단락 사고로부터 회로를 보호할 수 있습니다. 장점 구조가 단순합니다. 가격이 비교적 저렴합니다. 차단 용량과 종류에 따라 매우 빠르게 회로를 차단할 수 있습니다. 별도의 기계적 동작 장치가 필요하지 않습니다. 단점 한 번 차단되면 다시 사용할 수 없습니다. 차단 후 새 퓨즈로 교체해야 합니다. 규격이 다른 퓨즈를 잘못 장착하면 회로를 보호하지 못할 수 있습니다. 퓨즈는 용도와 전류, 전압, 차단 용량, 동작 속도에 따라 다양한 종류가 있으며 일반적으로 전용 퓨즈 홀더와 함께 사용합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 3. 배선용 차단기 MCCB (=Molded Case Circuit Breaker)<\/h2>\n  <p class=\"screen\">[화면] 배선용 차단기 MCCB (=Molded Case Circuit Breaker)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>배선용 차단기 MCCB (=Molded Case Circuit Breaker) MCCB는 Molded Case Circuit Breaker의 약자로, 배선과 전력 회로를 과전류 및 단락으로부터 보호하는 차단기입니다. 일반적인 열동·전자식 MCCB는 다음 두 가지 방식으로 이상 전류를 검출합니다. 과부하 전류: 바이메탈의 열 변형을 이용하여 차단합니다. 단락 전류: 전자석의 자기력을 이용하여 빠르게 차단합니다. 따라서 MCCB는 단순히 열이 발생해야만 동작하는 장치라기보다, 과부하와 단락에 각각 다른 트립 원리를 사용하는 경우가 많습니다. MCCB는 퓨즈와 달리 사고 원인을 제거한 후 손잡이를 조작하여 다시 사용할 수 있습니다. 제품에 따라 다음과 같이 극수가 구분됩니다. 2극 3극 4극 MCCB는 국내외 일부 현장에서 NFB(No-Fuse Breaker)라고 부르기도 합니다. 그러나 국제적으로는 MCCB라는 명칭을 사용하는 것이 더 명확합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 4. 배선용 차단기의 선정<\/h2>\n  <p class=\"screen\">[화면] 배선용 차단기의 선정<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>배선용 차단기의 선정 MCCB를 선정할 때에는 다음 항목을 함께 확인해야 합니다. 정격전압 정격전류 극수 차단 용량 연결되는 케이블의 허용전류 부하의 기동전류 설치 환경과 주위 온도 차단기의 정격전류는 부하의 정상 운전 전류보다 커야 하지만, 케이블의 허용전류를 초과해서는 안 됩니다. 또한 예상되는 단락전류보다 충분히 큰 정격 차단 용량을 가진 제품을 선택해야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 5. 소형 차단기 MCB (=Miniature Circuit Breaker)<\/h2>\n  <p class=\"screen\">[화면] 소형 차단기 MCB (=Miniature Circuit Breaker)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>소형 차단기 MCB (=Miniature Circuit Breaker) MCB는 Miniature Circuit Breaker의 약자로, 비교적 작은 용량의 분기 회로를 보호하는 소형 차단기입니다. 주로 다음과 같은 곳에 사용합니다. 조명 회로 콘센트 회로 소형 제어 회로 제어반 내부의 분기 회로 MCB 역시 과부하와 단락 보호 기능을 제공하지만, 일반적으로 MCCB보다 정격전류와 차단 용량의 범위가 작습니다. 회로 보호기 CP (=Circuit Protector) 회로 보호기(CP)는 제어회로와 전자회로의 소전류 분기 회로를 보호하기 위해 사용하는 장치입니다. 제품에 따라 다양한 시간-전류 특성을 선택할 수 있습니다. 순시형 고속형 중속형 저속형 다만 순시형, 고속형, 중속형, 저속형의 정확한 동작 시간은 제조사와 모델마다 다르므로 제품의 시간-전류 특성표를 확인해야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 6. MCB·MCCB와 CP의 차이<\/h2>\n  <p class=\"screen\">[화면] MCB·MCCB와 CP의 차이<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>MCB·MCCB와 CP의 차이 MCCB와 MCB는 주로 배선과 전력 회로를 과전류 및 단락으로부터 보호합니다. CP는 비교적 작은 제어회로나 전자부품이 연결된 분기 회로를 보호하는 용도로 많이 사용합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 7. 전자접촉기 (Magnetic Contactor)<\/h2>\n  <p class=\"screen\">[화면] 전자접촉기 (Magnetic Contactor)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>전자접촉기 (Magnetic Contactor) 전자접촉기(MC)는 모터나 히터와 같은 대용량 부하의 전원을 반복적으로 연결하고 차단하는 전자식 스위치입니다. 전자접촉기는 다음과 같이 동작합니다. 1. 코일에 제어 전원을 공급합니다. 2. 코일에서 자기장이 발생합니다. 3. 전자석의 힘으로 주접점이 연결됩니다. 4. 주접점을 통해 부하에 전원이 공급됩니다. 5. 보조접점을 통해 접촉기의 동작 상태를 확인하거나 시퀀스 회로를 구성합니다. 전자접촉기는 큰 전류를 자주 개폐할 수 있도록 설계되며, 접점에서 발생하는 아크를 줄이기 위한 아크 소호 구조를 가지고 있습니다. 전자접촉기는 부하의 전원을 개폐하는 장치이며, 그 자체만으로 모터의 과부하를 완전히 보호하는 장치는 아닙니다. 따라서 일반적으로 차단기 및 과부하 계전기와 조합하여 사용합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 8. 누전 차단기 ELCB<\/h2>\n  <p class=\"screen\">[화면] 누전 차단기 ELCB<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>누전 차단기 ELCB 누전 차단기는 회로에서 누설전류를 검출하면 전원을 차단하여 감전과 누전화재를 방지하는 장치입니다. ELB, ELCB 등의 명칭을 사용합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 9. 변류기 CT (=Current Transformer)<\/h2>\n  <p class=\"screen\">[화면] 변류기 CT (=Current Transformer)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>변류기 CT (=Current Transformer) 변류기(CT)는 큰 교류 전류를 측정 장치에서 사용할 수 있는 작은 전류로 변환하는 장치입니다. 도선에 교류 전류가 흐르면 주변에 변화하는 자기장이 형성되고, 이 자기장이 CT의 2차측 권선에 전류를 유도합니다. 1차측 전류와 2차측 전류의 비율을 변류비라고 합니다. 예를 들어 CT의 변류비가 100/5A라면 다음과 같습니다. 1차측 전류: 100A 2차측 전류: 5A 변류비: 20:1 따라서 2차측에서 3A가 측정되었다면 1차측 전류는 다음과 같습니다. 3A × 20 = 60A CT를 사용할 때에는 정격 부담, 정확도 등급, 정격 주파수와 변류비를 확인해야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 10. 변류기 + 전류계<\/h2>\n  <p class=\"screen\">[화면] 변류기 + 전류계<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>변류기 + 전류계 큰 전류를 직접 전류계에 연결하기 어려운 경우 CT를 사용하여 전류를 축소한 후 전류계에 입력합니다. 전류계는 CT의 변류비를 기준으로 실제 1차측 전류를 표시합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 11. 전류 측정 테스터기<\/h2>\n  <p class=\"screen\">[화면] 전류 측정 테스터기<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>전류 측정 테스터기 전류 측정기는 케이블을 분리하지 않고도 전류를 측정할 수 있는 장비입니다. 교류용 전류 측정기는 CT와 유사하게 도선 주변의 자기장을 검출하여 전류를 측정합니다. DC 전류까지 측정할 수 있는 전류 측정기는 일반적으로 홀 효과 센서를 사용합니다. 측정할 때에는 여러 가닥을 한 번에 물리지 않고 측정하려는 한 가닥의 케이블만 클램프 내부에 넣어야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 12. 영상 변류기 ZCT (=Zero Current Transformer)<\/h2>\n  <p class=\"screen\">[화면] 영상 변류기 ZCT (=Zero Current Transformer)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>영상 변류기 ZCT (=Zero Current Transformer) 영상 변류기(ZCT)는 회로를 통해 나가는 전류와 되돌아오는 전류의 차이를 측정합니다. 정상적인 단상 회로에서는 다음 관계가 성립합니다. L선을 통해 나간 전류 = N선을 통해 되돌아온 전류 따라서 두 전류의 벡터 합은 0이 됩니다. 그러나 일부 전류가 사람이나 장비 외함, 접지선을 통해 대지로 누설되면 L선과 N선의 전류가 서로 달라집니다. ZCT는 이 차이인 잔류전류를 검출합니다. 3상 회로에서는 R, S, T와 필요한 경우 N을 모두 ZCT 내부로 통과시켜 정상 전류의 합이 0이 되도록 구성합니다. 보호접지선(PE)은 ZCT 내부를 통과시키지 않습니다. 이것이 누전 차단기의 원리 입니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 13. 누전 (누설 전류)<\/h2>\n  <p class=\"screen\">[화면] 누전 (누설 전류)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>누전 (누설 전류) 누설전류가 설정값을 초과하면 누전 보호 장치가 차단 신호를 발생시켜 회로의 전원을 차단합니다. 기존의 일반적인 AC형 누전 검출 장치는 순수한 교류 누설전류에 적합합니다. 그러나 인버터, SMPS, 전기자동차 충전기처럼 전력 반도체를 사용하는 장비에서는 맥동 DC나 평활 DC 성분이 포함된 누설전류가 발생할 수 있습니다. 이러한 회로에는 누설전류의 파형에 맞는 RCD 타입을 선택해야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 14. RCD의 종류<\/h2>\n  <p class=\"screen\">[화면] RCD의 종류<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>RCD의 종류 RCD는 검출할 수 있는 잔류전류의 파형에 따라 구분합니다. Type AC: 정현파 AC 잔류전류를 검출합니다. Type A: AC와 맥동 DC 잔류전류를 검출합니다. Type F: 단상 인버터 부하에서 발생할 수 있는 복합 주파수 잔류전류에 대응합니다. Type B: AC, 맥동 DC 및 평활 DC 잔류전류를 검출할 수 있습니다. 전기자동차 충전기, 태양광 인버터, 주파수 인버터 등에서는 장비 제조사가 요구하는 RCD 타입을 확인해야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 15. 다양한 차단기의 종류<\/h2>\n  <p class=\"screen\">[화면] 다양한 차단기의 종류<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>다양한 차단기의 종류 전압과 차단 용량, 절연 및 아크 소호 방식에 따라 여러 종류의 차단기가 사용됩니다. MCB: 소형 차단기 MCCB: 배선용 차단기 ACB: 기중 차단기 OCB: 유입 차단기 VCB: 진공 차단기 GCB: 가스 차단기 MCB 또는 MBB로 불리는 자기 차단기 계열 저압 제어반에서는 MCB와 MCCB를 많이 사용하며, 고압·특고압 설비에서는 VCB와 GCB 등을 사용하지만 일반적인 자동화 설비에서는 잘 사용되지 않습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 16. 잘못된 도면 표기<\/h2>\n  <p class=\"screen\">[화면] 잘못된 도면 표기<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>잘못된 도면 표기 현장 도면에서는 잘못된 도면 표기법이 많습니다. IEC 규격에 따르면 전부 다르게 표현 되어야 하지만 동일하게 표기된 도면도 많고 잘못된 표기 방법도 많습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 17. 도면 제작과 해석 방법<\/h2>\n  <p class=\"screen\">[화면] 도면 제작과 해석 방법<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>도면 제작과 해석 방법 도면을 그리는 사람은 정확한 규격대로 설계를 하면 좋겠지만 잘 되지 않는것이 현실입니다. 규격을 정확하게 지키는 것도 중요하지만, 더 중요한 것은 도면을 해석하는 사람이 불편을 겪지 않도록 표기 방법보다는 이름을 정확하게 정의하고, 제품의 모델명과 사양을 정확하게 기입하는 것입니다. 그러면, 해석하는 사람도 도면의 모델명을 보고 정확하게 해석할 수 있게 됩니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 18. SYMBOL LIST<\/h2>\n  <p class=\"screen\">[화면] SYMBOL LIST<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>SYMBOL LIST 설계자는 전기 도면에 사용한 심벌과 약어를 정리한 Symbol List를 작성해야 합니다. Symbol List 에 의도한 사양을 정확하게 정의 하는 것입니다. 그렇게 되면 추후에 잘못된 심벌을 관리하기에도 좋고, 또 잘못되었더라도 다른 사람이 설계자의 의도를 정확하게 이해할 수 있습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 19. 모터 보호 회로<\/h2>\n  <p class=\"screen\">[화면] 모터 보호 회로<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>모터 보호 회로 모터는 기동할 때 정격전류보다 큰 기동전류가 흐르고, 운전 중에는 과부하나 결상, 구속 등의 이상 상태가 발생할 수 있습니다. 따라서 모터 회로에는 다음 기능이 필요합니다. 단락 보호 배선 보호 과부하 보호 전원 개폐 필요 시 결상 및 지락 보호 이 기능은 하나의 장치가 아니라 여러 장치를 조합하여 구성하는 경우가 많습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 20. 전자식 과부하 계전기 (EOCR)<\/h2>\n  <p class=\"screen\">[화면] 전자식 과부하 계전기 (EOCR)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>전자식 과부하 계전기 (EOCR) EOCR은 Electronic Over Current Relay의 약자로, 모터에 흐르는 전류를 감시하여 과부하, 결상, 불평형 등의 이상 상태를 검출하는 보호 계전기입니다. EOCR은 모터 전원을 직접 차단하는 주접점을 가지고 있지 않은 경우가 많습니다. 따라서 이상 상태를 검출하면 EOCR의 출력 접점을 이용해 MC 코일 회로를 차단합니다. 결과적으로 MC의 주접점이 열리면서 모터 전원이 차단됩니다. EOCR의 주요 설정 항목은 제품마다 다르지만 일반적으로 다음과 같습니다. LOAD 또는 Current: 모터 정격전류 설정 D-TIME: 기동 중 큰 전류를 허용하는 지연 시간 O-TIME: 운전 중 과전류가 지속될 때 차단하기까지의 지연 시간<\/p>\n<\/article>","<article>\n  <h2>슬라이드 21. EOCR 설정 방법<\/h2>\n  <p class=\"screen\">[화면] EOCR 설정 방법<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>EOCR 설정 방법 EOCR의 정확한 설정 방법은 반드시 제조사 매뉴얼과 모터 명판 정보를 기준으로 해야 합니다. 일반적인 설정 순서는 다음과 같습니다. 1. 모터 명판의 정격전류를 확인합니다. 2. LOAD 값을 모터 정격전류에 맞게 설정합니다. 3. 실제 기동 시간을 측정합니다. 4. D-TIME은 정상적인 기동 시간이 지나도록 여유를 두고 설정합니다. 5. O-TIME은 부하 특성과 허용 가능한 과부하 시간을 고려하여 설정합니다. 6. 실제 과부하 및 결상 시험이 가능한 경우 보호 동작을 확인합니다. D-TIME과 O-TIME을 단순히 합산하여 항상 그 시간 뒤에 차단된다고 해석해서는 안 됩니다. D-TIME은 주로 기동 구간을 무시하기 위한 시간이며, O-TIME은 기동 이후 과전류가 발생했을 때의 동작 지연 시간입니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 22. 일반적인 모터 구동 회로<\/h2>\n  <p class=\"screen\">[화면] 일반적인 모터 구동 회로<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>일반적인 모터 구동 회로 일반적인 모터 주회로는 다음 순서로 구성할 수 있습니다. 1. R, S, T 전원이 인가됩니다. 2. MCCB 또는 모터 보호 차단기를 통과합니다. 3. MC의 주접점을 통과합니다. 4. 과부하 계전기 또는 EOCR의 전류 검출부를 통과합니다. 5. 모터에 전원이 공급됩니다. MC 코일이 ON되면 주접점이 닫히고 모터에 전원이 공급됩니다. MCCB만 설치한 회로는 단락과 배선을 보호할 수 있지만, 설정과 제품 특성에 따라 모터의 지속적인 과부하를 충분히 보호하지 못할 수 있습니다. 따라서 일반적인 모터 회로에는 과부하 계전기, EOCR 또는 모터 보호용 차단기를 함께 사용합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 23. AC-3와 AC-4 사용 범주<\/h2>\n  <p class=\"screen\">[화면] AC-3와 AC-4 사용 범주<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>AC-3와 AC-4 사용 범주 IEC 60947-4-1 에 정의된 부하 등급 AC-3: 일반적인 모터 부하 AC-4: 빈번한 기동/정지 부하 AC-3와 AC-4는 전자접촉기와 모터 스터터를 선정할 때 사용하는 대표적인 사용 범주입니다. AC-3 일반적인 농형 유도 모터의 기동과 정상 운전 중 정지를 기준으로 합니다. 모터가 정상 속도에 도달한 후 접촉기를 개방하는 일반적인 운전에 사용합니다. 대표적인 적용 사례는 다음과 같습니다. 일반 컨베이어 펌프 팬 압축기 AC-4 플러깅, 인칭, 조깅, 빈번한 정·역회전처럼 높은 전류 상태에서 접점을 자주 개폐하는 운전을 기준으로 합니다. 대표적인 적용 사례는 다음과 같습니다. 빈번한 정·역회전 인칭 운전 조깅 운전 크레인과 호이스트 위치 맞춤을 위한 반복 운전 AC-4는 AC-3보다 접점에 훨씬 큰 전기적·기계적 부담을 줍니다. 따라서 같은 모터라도 AC-4 운전에서는 더 큰 용량의 접촉기가 필요할 수 있습니다. MCCB 선정 AC-3: 정격전류의 2.5 ~ 3배수 AC-4: 정격전류의 3 ~ 3.5배수 MC 선정 AC-3: 정격전류의 1.5 ~ 2배수 AC-4: 정격전류의 2 ~ 2.5배수<\/p>\n<\/article>","<article>\n  <h2>슬라이드 24. 역률<\/h2>\n  <p class=\"screen\">[화면] 역률<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>역률 역률은 피상전력 중 실제로 일을 하는 유효전력의 비율입니다. 코일과 캐패시터가 포함된 교류 회로에서는 전압과 전류 사이에 위상차가 발생하여 무효전력이 생깁니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 25. 효율<\/h2>\n  <p class=\"screen\">[화면] 효율<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>효율 효율은 입력 전력 중 기계적인 출력으로 변환되는 비율입니다 모터에서는 손실이 발생하므로 입력 전력이 모두 출력으로 변환되지는 않습니다. 정확한 역률과 효율은 모터 명판 또는 제조사 데이터시트를 확인해야 합니다. 명판 또는 제조사 데이터시트를 확인할 수 없는 경우에는 역률 0.9, 효율 0.9 와 같은 가정값을 사용하기도 하지만, 해당 모터의 사양을 적용하는 것이 가장 정확합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 26. 3상 모터의 정격전류 계산<\/h2>\n  <p class=\"screen\">[화면] 3상 모터의 정격전류 계산<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>3상 모터의 정격전류 계산 3상 모터의 입력 전력은 다음과 같이 계산합니다. $$ P_{in} = \\sqrt{3} \\times V_L \\times I_L \\times PF $$ 모터의 기계적 출력과 효율을 함께 고려하면 다음과 같습니다. 따라서 선전류는 다음과 같이 계산할 수 있습니다. $$ \\frac{P_{out}} {\\sqrt{3}\\times V_L\\times PF\\times \\eta} $$ $P_{out}$: 모터 출력 $V_L$: 선간전압 $I_L$: 선전류 $PF$: 역률 $\\eta$: 효율<\/p>\n<\/article>","<article>\n  <h2>슬라이드 27. 모터 전류 계산 예제<\/h2>\n  <p class=\"screen\">[화면] 모터 전류 계산 예제<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>모터 전류 계산 예제 380V 3상 1kW 모터를 예로 들어보겠습니다. 다음과 같이 가정합니다. 출력: 1,000W 선간전압: 380V 역률: 0.9 효율: 0.9 $$ \\frac{1000} {\\sqrt{3}\\times380\\times0.9\\times0.9} $$ 계산 결과는 약 1.88A입니다. 따라서 이 모터의 예상 정격전류는 약 1.9A입니다. 만약 모터 명판이나 사양을 정확하게 확인할 수 있다면, 계산값보다 우선해야 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 28. 차단기 선정 예제<\/h2>\n  <p class=\"screen\">[화면] 차단기 선정 예제<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>차단기 선정 예제 MCCB 선정 AC-3: 정격전류의 2.5 ~ 3배수 AC-4: 정격전류의 3 ~ 3.5배수 MC 선정 AC-3: 정격전류의 1.5 ~ 2배수 AC-4: 정격전류의 2 ~ 2.5배수 AC-3 일 때, MC 는 3A, MCCB 는 5A AC-4 일 때, MC 는 4A, MCCB 는 6A<\/p>\n<\/article>","<article>\n  <h2>슬라이드 29. 여러 모터가 연결된 메인 차단기<\/h2>\n  <p class=\"screen\">[화면] 여러 모터가 연결된 메인 차단기<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>여러 모터가 연결된 메인 차단기 여러 모터가 하나의 메인 차단가에 연결된 경우 각 모터의 분기 보호 장치와 메인 차단기를 구분하여 선정해야 합니다. 메인 차단기의 용량을 단순히 각 모터용 차단기 정격의 합으로 계산하면 지나치게 크게 선정될 수 있습니다. 다음 항목을 함께 고려해야 합니다. 동시에 운전하는 모터의 수 동시에 기동할 가능성 가장 큰 모터의 기동 전류 예를 들어 3대의 모터가 동시에 운전하지만 한 대씩 순차적으로 기동한다면, 세 모터의 기동전류가 동시에 발생하지 않습니다. 3배 + 3배 + 3배는 약 15A 가 되며, 너무 큰 차단기가 선정이 되며, 메인차단기가 트립 될 수 있는 상태는 거의 없을 것입니다. 따라서 실제 운전 시나리오를 기준으로 메인 차단기를 선정해야 합니다. 원가 절감을 위해 지나치게 작은 차단기를 사용하면 불필요한 트립과 설비 정지가 발생할 수 있습니다. 반대로 지나치게 큰 차단기를 사용하면 케이블과 설비를 제대로 보호하지 못할 수 있습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 30. 계전기가 포함된 모터 구동 회로<\/h2>\n  <p class=\"screen\">[화면] 계전기가 포함된 모터 구동 회로<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>계전기가 포함된 모터 구동 회로 계전기가 포함된 모터 구동 회로에서는 EOCR 또는 과부하 계전기의 정상닫힘 접점을 MC 코일 회로에 직렬로 연결합니다. 모터 과부하가 검출되면 계전기의 접점이 열리고 MC 코일의 전원이 차단됩니다. MC 코일이 OFF되면 주접점이 열리면서 모터의 전원이 차단됩니다. 시퀀스 회로의 구체적인 동작과 자기유지 회로는 이후 시퀀스 회로 장에서 자세히 살펴보겠습니다. N/F (=Noise Filter) 노이즈 필터는 전원선을 통해 유입되거나 외부로 방출되는 고주파 노이즈를 줄이는 장치입니다. 주로 다음과 같은 장비의 입력단에 사용합니다. 인버터 서보 드라이브 SMPS 산업용 제어 장비 정밀 측정 장비 노이즈 필터는 정격전압과 정격전류에 맞게 선정해야 하며, 접지 단자를 올바르게 연결해야 충분한 효과를 얻을 수 있습니다. 또한 노이즈 필터만 설치한다고 모든 노이즈 문제가 해결되는 것은 아닙니다. 다음 항목을 함께 고려해야 합니다. 보호접지 쉴드 케이블 동력선과 신호선의 분리 배선 거리 필터의 설치 위치 인버터와 모터 케이블 길이 제어반 내부의 접지 구조 차단기 선정 일반적으로 정격전류보다 조금 크게 선정하면 된다. 다만, 코일은 돌입전류 때문에 2.5배수 혹은 3배수를 계산해서 차단기를 선정해야 한다. 가장 정확한 것은 해당하는 차단기 특성과 부하의 돌입 전류 특성 그래프를 확인해야 하지만 현실적으로 어렵다. 변압기의 경우 130% 선에서 선정 모터의 경우 200% ~ 300% 선에서 선정 차단기 선정시 모터의 경우 2~3배의 안전률을 사용하기 때문에 모터는 보호할 수 없다. MCCB 의 경우 차단 속도가 느리기 때문에 2.5배 정도 사용 CP의 경우 차단 속도가 빠르기 때문에 3배 정도 사용 (일반적으로 모터에 CP는 부적절 하기는 하다.)<\/p>\n<\/article>","<article>\n  <h2>슬라이드 31. 핵심 내용 정리<\/h2>\n  <p class=\"screen\">[화면] 핵심 내용 정리<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>1-16. 전기회로의 보호와 모터 보호 장치에서 살펴본 개념은 이후 장의 회로 구성과 장치 제어를 이해하는 기초가 됩니다. 핵심 용어와 동작 흐름을 다시 확인한 뒤 다음 내용으로 넘어가겠습니다.<\/p>\n<\/article>"]};</script>
