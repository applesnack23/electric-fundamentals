&lt;h1 id=&quot;1-09-%EC%A0%91%EC%A7%80%EC%99%80-%EC%A4%91%EC%84%B1%EC%84%A0-%EA%B7%B8%EB%A6%AC%EA%B3%A0-%EB%85%B8%EC%9D%B4%EC%A6%88&quot;&gt;1-09. 접지와 중성선 그리고 노이즈&lt;/h1&gt;
&lt;p&gt;전기·전자 기초&lt;/p&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;
&lt;/foreignObject&gt;&lt;/svg&gt;&lt;svg data-marpit-svg=&quot;&quot; viewBox=&quot;0 0 1280 720&quot;&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot;&gt;&lt;section id=&quot;2&quot; data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;2&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot;&gt;
&lt;h2 id=&quot;%ED%95%99%EC%8A%B5-%EA%B0%9C%EC%9A%94&quot;&gt;학습 개요&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;지금까지 전기 회로를 구성하는 다양한 부품과 원리를 살펴보았습니다.&lt;/li&gt;
&lt;li&gt;하지만 실제 공장자동화 설비에서는 회로를 올바르게 설계하는 것만큼 중요한 것이 접지(Ground)와 노이즈(Noi…&lt;/li&gt;
&lt;li&gt;아무리 회로를 잘 설계하더라도 접지가 올바르지 않거나 노이즈 대책이 부족하면 장비가 오동작하거나 통신 오류가 발생…&lt;/li&gt;
&lt;li&gt;이번에는 접지의 역할과 중요성, 그리고 노이즈를 줄이기 위한 방법에 대해 알아보겠습니다.&lt;/li&gt;
&lt;/ul&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;
&lt;/foreignObject&gt;&lt;/svg&gt;&lt;svg data-marpit-svg=&quot;&quot; viewBox=&quot;0 0 1280 720&quot;&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot;&gt;&lt;section data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;3&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;--marpit-advanced-background-split:42%;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot; data-marpit-advanced-background=&quot;background&quot; data-marpit-advanced-background-split=&quot;right&quot;&gt;&lt;div data-marpit-advanced-background-container=&quot;true&quot; data-marpit-advanced-background-direction=&quot;horizontal&quot;&gt;&lt;figure style=&quot;background-image:url(&amp;quot;../assets/09-ground-neutral-and-noise-01.png&amp;quot;);background-size:contain;&quot;&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/section&gt;&lt;/foreignObject&gt;&lt;foreignObject width=&quot;58%&quot; height=&quot;720&quot;&gt;&lt;section id=&quot;3&quot; data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;3&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;--marpit-advanced-background-split:42%;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot; data-marpit-advanced-background=&quot;content&quot; data-marpit-advanced-background-split=&quot;right&quot;&gt;
&lt;h2 id=&quot;%EC%A0%91%EC%A7%80-%E6%8E%A5%E5%9C%B0-ground&quot;&gt;접지 (接地, Ground)&lt;/h2&gt;

&lt;ul&gt;
&lt;li&gt;접지 (接地, Ground) 접지는 전기 회로나 전기 장치를 대지(Earth)와 전기적으로 연결하는 것을 의미합니…&lt;/li&gt;
&lt;li&gt;대지는 매우 큰 전기 용량을 가지고 있으므로 일반적으로 0V의 기준 전위로 사용합니다.&lt;/li&gt;
&lt;li&gt;접지는 모든 전류를 흘려 보내기 위한 것이 아니라, 이상 상황이 발생했을 때 안전하게 전류를 방전하기 위한 기준점…&lt;/li&gt;
&lt;/ul&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;
&lt;/foreignObject&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot; data-marpit-advanced-background=&quot;pseudo&quot;&gt;&lt;section data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;3&quot; style=&quot;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot; data-marpit-advanced-background=&quot;pseudo&quot; data-marpit-advanced-background-split=&quot;right&quot;&gt;&lt;/section&gt;&lt;/foreignObject&gt;&lt;/svg&gt;&lt;svg data-marpit-svg=&quot;&quot; viewBox=&quot;0 0 1280 720&quot;&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot;&gt;&lt;section id=&quot;4&quot; data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;4&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot;&gt;
&lt;h2 id=&quot;%EC%A0%91%EC%A7%80%EC%9D%98-%EB%AA%A9%EC%A0%81&quot;&gt;접지의 목적&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;예기치 않은 고전압이나 과전류가 발생했을 때 전류를 안전하게 대지로 흘려보내 사람과 장비를 보호합니다.&lt;/li&gt;
&lt;li&gt;전기 장치의 기준 전위를 일정하게 유지하여 안정적인 동작을 돕습니다.&lt;/li&gt;
&lt;/ul&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;
&lt;/foreignObject&gt;&lt;/svg&gt;&lt;svg data-marpit-svg=&quot;&quot; viewBox=&quot;0 0 1280 720&quot;&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot;&gt;&lt;section data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;5&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;--marpit-advanced-background-split:42%;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot; data-marpit-advanced-background=&quot;background&quot; data-marpit-advanced-background-split=&quot;right&quot;&gt;&lt;div data-marpit-advanced-background-container=&quot;true&quot; data-marpit-advanced-background-direction=&quot;horizontal&quot;&gt;&lt;figure style=&quot;background-image:url(&amp;quot;../assets/09-ground-neutral-and-noise-02.png&amp;quot;);background-size:contain;&quot;&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/section&gt;&lt;/foreignObject&gt;&lt;foreignObject width=&quot;58%&quot; height=&quot;720&quot;&gt;&lt;section id=&quot;5&quot; data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;5&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;--marpit-advanced-background-split:42%;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot; data-marpit-advanced-background=&quot;content&quot; data-marpit-advanced-background-split=&quot;right&quot;&gt;
&lt;h2 id=&quot;%EC%A0%91%EC%A7%80%EC%9D%98-%EC%A4%91%EC%9A%94%EC%84%B1&quot;&gt;접지의 중요성&lt;/h2&gt;

&lt;ul&gt;
&lt;li&gt;접지의 중요성 접지는 안전을 위해 매우 중요합니다.&lt;/li&gt;
&lt;li&gt;사람이 접촉할 수 있는 부위 (Frame, Body, Cover, 문 손잡이 등) 에는 반드시 접지와 연결되어 있…&lt;/li&gt;
&lt;li&gt;접지는 안전뿐만 아니라 장비의 안정적인 동작에도 매우 중요한 역할을 합니다.&lt;/li&gt;
&lt;li&gt;특히 자동화 장비에서는 여러 장치가 하나의 시스템으로 연결되어 있기 때문에 기준 전위가 일정하지 않으면 통신 오류…&lt;/li&gt;
&lt;/ul&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;
&lt;/foreignObject&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot; data-marpit-advanced-background=&quot;pseudo&quot;&gt;&lt;section data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;5&quot; style=&quot;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot; data-marpit-advanced-background=&quot;pseudo&quot; data-marpit-advanced-background-split=&quot;right&quot;&gt;&lt;/section&gt;&lt;/foreignObject&gt;&lt;/svg&gt;&lt;svg data-marpit-svg=&quot;&quot; viewBox=&quot;0 0 1280 720&quot;&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot;&gt;&lt;section id=&quot;6&quot; data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;6&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot;&gt;
&lt;h2 id=&quot;%EC%A0%91%EC%A7%80-%EC%84%A4%EA%B3%84-%EC%8B%9C-%EC%A3%BC%EC%9D%98%EC%82%AC%ED%95%AD&quot;&gt;접지 설계 시 주의사항&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;접지 설계 시 주의사항 접지를 설계할 때 가장 중요한 것은 접지 루프(Ground Loop)가 발생하지 않도록 하…&lt;/li&gt;
&lt;li&gt;모든 접지는 하나의 기준점으로 모여 대지로 연결되어야 합니다.&lt;/li&gt;
&lt;li&gt;!image.png 만약 접지끼리 서로 연결되어 폐루프를 형성하면 노이즈 전류가 루프 내부를 계속 순환하게 됩니다.&lt;/li&gt;
&lt;li&gt;이러한 현상을 Ground Loop라고 합니다.&lt;/li&gt;
&lt;/ul&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;
&lt;/foreignObject&gt;&lt;/svg&gt;&lt;svg data-marpit-svg=&quot;&quot; viewBox=&quot;0 0 1280 720&quot;&gt;&lt;foreignObject width=&quot;1280&quot; height=&quot;720&quot;&gt;&lt;section id=&quot;7&quot; data-paginate=&quot;true&quot; data-footer=&quot;전기·전자 기초&quot; data-theme=&quot;qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9&quot; lang=&quot;C&quot; data-marpit-pagination=&quot;7&quot; style=&quot;--paginate:true;--footer:전기·전자 기초;--theme:qr026t7476l8v1absgp4r6ninb755sr8mg2ne1kzf9;&quot; data-marpit-pagination-total=&quot;11&quot; data-size=&quot;16:9&quot;&gt;
&lt;h2 id=&quot;%EB%85%B8%EC%9D%B4%EC%A6%88%EC%9D%98-%EB%B0%9C%EC%83%9D&quot;&gt;노이즈의 발생&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;노이즈의 발생 전류가 도선을 따라 흐르면 도선 주변에는 자기장이 형성됩니다.&lt;/li&gt;
&lt;li&gt;이 자기장이 다른 도선에 영향을 주면 전류가 유도되며, 이를 전자기 유도라고 합니다.&lt;/li&gt;
&lt;li&gt;원하지 않는 유도 전류가 발생하면 회로에는 노이즈가 발생합니다.&lt;/li&gt;
&lt;li&gt;이러한 노이즈는 센서 신호나 통신 신호를 왜곡하여 다양한 오동작의 원인이 됩니다.&lt;/li&gt;
&lt;/ul&gt;
&lt;footer&gt;전기·전자 기초&lt;/footer&gt;
&lt;/section&gt;

&lt;ul&gt;
&lt;li&gt;쉴드(Shield) 노이즈를 줄이는 가장 대표적인 방법 중 하나가 쉴드입니다.&lt;/li&gt;
&lt;li&gt;쉴드는 도선을 금속층으로 감싸 외부에서 발생하는 전자기장이 내부 도선에 영향을 주지 못하도록 차단하는 역할을 합니…&lt;/li&gt;

&lt;h2 id=&quot;%EC%89%B4%EB%93%9C-%EC%BC%80%EC%9D%B4%EB%B8%94&quot;&gt;쉴드 케이블&lt;/h2&gt;

&lt;ul&gt;
&lt;li&gt;쉴드 케이블 쉴드 케이블은 신호선을 금속 쉴드로 감싼 케이블입니다.&lt;/li&gt;
&lt;li&gt;외부에서 발생하는 자기장이 내부 도선에 유도되는 것을 줄여 통신 신호나 센서 신호를 안정적으로 전달할 수 있습니다.&lt;/li&gt;
&lt;li&gt;쉴드를 사용할 때 가장 중요한 점은 쉴드를 반드시 접지와 연결해야 한다는 것입니다.&lt;/li&gt;
&lt;li&gt;접지되지 않은 쉴드는 외부 노이즈를 흡수한 후 내부에 전하가 축적될 수 있습니다.&lt;/li&gt;
&lt;/ul&gt;

&lt;li&gt;노이즈는 센서 오동작, PLC 입력 오류, 통신 장애 등 다양한 문제를 발생시킬 수 있습니다.&lt;/li&gt;
&lt;li&gt;노이즈를 줄이는 가장 기본적인 방법은 올바른 접지를 설계하는 것입니다.&lt;/li&gt;
&lt;li&gt;또한 통신선이나 미세한 신호를 사용하는 회로에서는 쉴드 케이블을 사용하는 것이 매우 중요합니다.&lt;/li&gt;
&lt;/ul&gt;

지금까지 전기 회로를 구성하는 다양한 부품과 원리를 살펴보았습니다.

하지만 실제 공장자동화 설비에서는 회로를 올바르게 설계하는 것만큼 중요한 것이 접지(Ground)와 노이즈(Noise)입니다.

아무리 회로를 잘 설계하더라도 접지가 올바르지 않거나 노이즈 대책이 부족하면 장비가 오동작하거나 통신 오류가 발생할 수 있습니다.

이번에는 접지의 역할과 중요성, 그리고 노이즈를 줄이기 위한 방법에 대해 알아보겠습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 접지 (接地, Ground)

접지는 전기 회로나 전기 장치를 대지(Earth)와 전기적으로 연결하는 것을 의미합니다.

대지는 매우 큰 전기 용량을 가지고 있으므로 일반적으로 0V의 기준 전위로 사용합니다.

![접지와 중성선 그리고 노이즈](../assets/09-ground-neutral-and-noise-01.png)

접지는 모든 전류를 흘려 보내기 위한 것이 아니라, 이상 상황이 발생했을 때 안전하게 전류를 방전하기 위한 기준점의 역할을 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 접지의 목적

접지를 사용하는 대표적인 목적은 다음과 같습니다.

- 예기치 않은 고전압이나 과전류가 발생했을 때 전류를 안전하게 대지로 흘려보내 사람과 장비를 보호합니다.
- 전기 장치의 기준 전위를 일정하게 유지하여 안정적인 동작을 돕습니다.

만약 접지가 되어 있지 않다면 전류는 다른 경로를 통해 흐르게 되며, 감전이나 장비 손상의 원인이 될 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 접지의 중요성

![접지와 중성선 그리고 노이즈](../assets/09-ground-neutral-and-noise-02.png)

접지는 안전을 위해 매우 중요합니다. 사람이 접촉할 수 있는 부위 (Frame, Body, Cover, 문 손잡이 등) 에는 반드시 접지와 연결되어 있어야 합니다.

접지는 안전뿐만 아니라 장비의 안정적인 동작에도 매우 중요한 역할을 합니다.

특히 자동화 장비에서는 여러 장치가 하나의 시스템으로 연결되어 있기 때문에 기준 전위가 일정하지 않으면 통신 오류나 센서 오동작이 발생할 수 있습니다.

따라서 산업 현장에서는 접지를 안전 설계의 기본 요소로 고려합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 접지 설계 시 주의사항

접지를 설계할 때 가장 중요한 것은 **접지 루프(Ground Loop)**가 발생하지 않도록 하는 것입니다.

모든 접지는 하나의 기준점으로 모여 대지로 연결되어야 합니다.

!image.png

만약 접지끼리 서로 연결되어 폐루프를 형성하면 노이즈 전류가 루프 내부를 계속 순환하게 됩니다.

이러한 현상을 **Ground Loop**라고 합니다.

Ground Loop가 발생하면 노이즈가 증가하고 장비의 오동작이나 통신 장애가 발생할 수 있습니다.

또한 접지는 저항이 매우 작기 때문에 실제 현장에서 Ground Loop가 어디에서 발생했는지 찾기가 매우 어렵습니다.

이러한 문제를 방지하기 위해 모든 접지를 하나의 기준점으로 모으는 **스타(Star) 접지** 또는 **방사형 접지** 방식을 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 노이즈의 발생

전류가 도선을 따라 흐르면 도선 주변에는 자기장이 형성됩니다.

이 자기장이 다른 도선에 영향을 주면 전류가 유도되며, 이를 전자기 유도라고 합니다.

원하지 않는 유도 전류가 발생하면 회로에는 노이즈가 발생합니다.

이러한 노이즈는 센서 신호나 통신 신호를 왜곡하여 다양한 오동작의 원인이 됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 쉴드(Shield)

노이즈를 줄이는 가장 대표적인 방법 중 하나가 쉴드입니다.

쉴드는 도선을 금속층으로 감싸 외부에서 발생하는 전자기장이 내부 도선에 영향을 주지 못하도록 차단하는 역할을 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 쉴드 케이블

![접지와 중성선 그리고 노이즈](../assets/09-ground-neutral-and-noise-03.png)

쉴드 케이블은 신호선을 금속 쉴드로 감싼 케이블입니다.

외부에서 발생하는 자기장이 내부 도선에 유도되는 것을 줄여 통신 신호나 센서 신호를 안정적으로 전달할 수 있습니다.

쉴드를 사용할 때 가장 중요한 점은 쉴드를 반드시 접지와 연결해야 한다는 것입니다.

접지되지 않은 쉴드는 외부 노이즈를 흡수한 후 내부에 전하가 축적될 수 있습니다.

이렇게 전위가 높아지면 다른 장치로 방전되면서 오히려 새로운 노이즈나 정전기의 원인이 될 수 있습니다.

따라서 쉴드는 반드시 적절한 방법으로 접지하여 사용해야 합니다.

한편 전원 케이블은 대전류가 흐르므로 발열이 발생할 수 있습니다.

이러한 경우에는 쉴드를 사용하는 것보다 신호선과 충분한 거리를 확보하여 배선하는 것이 더 효과적인 경우도 많습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 노이즈

자동화 장비를 설계하면서 가장 많이 접하게 되는 문제 중 하나가 노이즈입니다.

노이즈는 센서 오동작, PLC 입력 오류, 통신 장애 등 다양한 문제를 발생시킬 수 있습니다.

노이즈를 줄이는 가장 기본적인 방법은 올바른 접지를 설계하는 것입니다.

또한 통신선이나 미세한 신호를 사용하는 회로에서는 쉴드 케이블을 사용하는 것이 매우 중요합니다.

이 외에도 통신선에서는 서로 두 가닥의 선을 꼬아 사용하는 트위스트 페어(Twisted Pair) 방식이 많이 사용됩니다.

트위스트 페어에 대한 내용은 통신을 학습하는 장에서 다시 자세히 살펴보겠습니다.&lt;/p&gt;&lt;/div&gt;&lt;script&gt;/*!! License: https://unpkg.com/@marp-team/marp-cli@4.5.0/lib/bespoke.js.LICENSE.txt */

  </main>
  <script>window.VIEWER_CONFIG={"scripts":["<article>\n  <h2>슬라이드 1. 1-09. 접지와 중성선 그리고 노이즈<\/h2>\n  <p class=\"screen\">[화면] 1-09. 접지와 중성선 그리고 노이즈<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>안녕하세요. 1-09. 접지와 중성선 그리고 노이즈 내용을 시작하겠습니다. 1-09. 접지와 중성선 그리고 노이즈의 핵심 개념을 실제 전기·전자 시스템과 연결해 학습하겠습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 2. 학습 개요<\/h2>\n  <p class=\"screen\">[화면] 학습 개요<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>지금까지 전기 회로를 구성하는 다양한 부품과 원리를 살펴보았습니다. 하지만 실제 공장자동화 설비에서는 회로를 올바르게 설계하는 것만큼 중요한 것이 접지(Ground)와 노이즈(Noise)입니다. 아무리 회로를 잘 설계하더라도 접지가 올바르지 않거나 노이즈 대책이 부족하면 장비가 오동작하거나 통신 오류가 발생할 수 있습니다. 이번에는 접지의 역할과 중요성, 그리고 노이즈를 줄이기 위한 방법에 대해 알아보겠습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 3. 접지 (接地, Ground)<\/h2>\n  <p class=\"screen\">[화면] 접지 (接地, Ground)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>접지 (接地, Ground) 접지는 전기 회로나 전기 장치를 대지(Earth)와 전기적으로 연결하는 것을 의미합니다. 대지는 매우 큰 전기 용량을 가지고 있으므로 일반적으로 0V의 기준 전위로 사용합니다. 접지는 모든 전류를 흘려 보내기 위한 것이 아니라, 이상 상황이 발생했을 때 안전하게 전류를 방전하기 위한 기준점의 역할을 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 4. 접지의 목적<\/h2>\n  <p class=\"screen\">[화면] 접지의 목적<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>접지의 목적 접지를 사용하는 대표적인 목적은 다음과 같습니다. 예기치 않은 고전압이나 과전류가 발생했을 때 전류를 안전하게 대지로 흘려보내 사람과 장비를 보호합니다. 전기 장치의 기준 전위를 일정하게 유지하여 안정적인 동작을 돕습니다. 만약 접지가 되어 있지 않다면 전류는 다른 경로를 통해 흐르게 되며, 감전이나 장비 손상의 원인이 될 수 있습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 5. 접지의 중요성<\/h2>\n  <p class=\"screen\">[화면] 접지의 중요성<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>접지의 중요성 접지는 안전을 위해 매우 중요합니다. 사람이 접촉할 수 있는 부위 (Frame, Body, Cover, 문 손잡이 등) 에는 반드시 접지와 연결되어 있어야 합니다. 접지는 안전뿐만 아니라 장비의 안정적인 동작에도 매우 중요한 역할을 합니다. 특히 자동화 장비에서는 여러 장치가 하나의 시스템으로 연결되어 있기 때문에 기준 전위가 일정하지 않으면 통신 오류나 센서 오동작이 발생할 수 있습니다. 따라서 산업 현장에서는 접지를 안전 설계의 기본 요소로 고려합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 6. 접지 설계 시 주의사항<\/h2>\n  <p class=\"screen\">[화면] 접지 설계 시 주의사항<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>접지 설계 시 주의사항 접지를 설계할 때 가장 중요한 것은 접지 루프(Ground Loop)가 발생하지 않도록 하는 것입니다. 모든 접지는 하나의 기준점으로 모여 대지로 연결되어야 합니다. !image.png 만약 접지끼리 서로 연결되어 폐루프를 형성하면 노이즈 전류가 루프 내부를 계속 순환하게 됩니다. 이러한 현상을 Ground Loop라고 합니다. Ground Loop가 발생하면 노이즈가 증가하고 장비의 오동작이나 통신 장애가 발생할 수 있습니다. 또한 접지는 저항이 매우 작기 때문에 실제 현장에서 Ground Loop가 어디에서 발생했는지 찾기가 매우 어렵습니다. 이러한 문제를 방지하기 위해 모든 접지를 하나의 기준점으로 모으는 스타(Star) 접지 또는 방사형 접지 방식을 사용합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 7. 노이즈의 발생<\/h2>\n  <p class=\"screen\">[화면] 노이즈의 발생<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>노이즈의 발생 전류가 도선을 따라 흐르면 도선 주변에는 자기장이 형성됩니다. 이 자기장이 다른 도선에 영향을 주면 전류가 유도되며, 이를 전자기 유도라고 합니다. 원하지 않는 유도 전류가 발생하면 회로에는 노이즈가 발생합니다. 이러한 노이즈는 센서 신호나 통신 신호를 왜곡하여 다양한 오동작의 원인이 됩니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 8. 쉴드(Shield)<\/h2>\n  <p class=\"screen\">[화면] 쉴드(Shield)<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>쉴드(Shield) 노이즈를 줄이는 가장 대표적인 방법 중 하나가 쉴드입니다. 쉴드는 도선을 금속층으로 감싸 외부에서 발생하는 전자기장이 내부 도선에 영향을 주지 못하도록 차단하는 역할을 합니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 9. 쉴드 케이블<\/h2>\n  <p class=\"screen\">[화면] 쉴드 케이블<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>쉴드 케이블 쉴드 케이블은 신호선을 금속 쉴드로 감싼 케이블입니다. 외부에서 발생하는 자기장이 내부 도선에 유도되는 것을 줄여 통신 신호나 센서 신호를 안정적으로 전달할 수 있습니다. 쉴드를 사용할 때 가장 중요한 점은 쉴드를 반드시 접지와 연결해야 한다는 것입니다. 접지되지 않은 쉴드는 외부 노이즈를 흡수한 후 내부에 전하가 축적될 수 있습니다. 이렇게 전위가 높아지면 다른 장치로 방전되면서 오히려 새로운 노이즈나 정전기의 원인이 될 수 있습니다. 따라서 쉴드는 반드시 적절한 방법으로 접지하여 사용해야 합니다. 한편 전원 케이블은 대전류가 흐르므로 발열이 발생할 수 있습니다. 이러한 경우에는 쉴드를 사용하는 것보다 신호선과 충분한 거리를 확보하여 배선하는 것이 더 효과적인 경우도 많습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 10. 노이즈<\/h2>\n  <p class=\"screen\">[화면] 노이즈<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>노이즈 자동화 장비를 설계하면서 가장 많이 접하게 되는 문제 중 하나가 노이즈입니다. 노이즈는 센서 오동작, PLC 입력 오류, 통신 장애 등 다양한 문제를 발생시킬 수 있습니다. 노이즈를 줄이는 가장 기본적인 방법은 올바른 접지를 설계하는 것입니다. 또한 통신선이나 미세한 신호를 사용하는 회로에서는 쉴드 케이블을 사용하는 것이 매우 중요합니다. 이 외에도 통신선에서는 서로 두 가닥의 선을 꼬아 사용하는 트위스트 페어(Twisted Pair) 방식이 많이 사용됩니다. 트위스트 페어에 대한 내용은 통신을 학습하는 장에서 다시 자세히 살펴보겠습니다.<\/p>\n<\/article>","<article>\n  <h2>슬라이드 11. 핵심 내용 정리<\/h2>\n  <p class=\"screen\">[화면] 핵심 내용 정리<\/p>\n  <p class=\"narration-label\">[내레이션]<\/p>\n  <p>1-09. 접지와 중성선 그리고 노이즈에서 살펴본 개념은 이후 장의 회로 구성과 장치 제어를 이해하는 기초가 됩니다. 핵심 용어와 동작 흐름을 다시 확인한 뒤 다음 내용으로 넘어가겠습니다.<\/p>\n<\/article>"]};</script>
