<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-3. 전압 분배와 전력 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-03-voltage-division-and-power-deck.html#1" title="1-3. 전압 분배와 전력 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-3. 전압 분배와 전력</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-3. 전압 분배와 전력을 학습하겠습니다. 회로에 저항을 여러 개 연결하면 전압과 전류가 연결 방식에 따라 나뉩니다. 이 원리를 이해하면 부품에 필요한 전압을 만들고, 부품이 견뎌야 할 전력을 계산할 수 있습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 직렬·병렬 저항의 합성 저항을 계산할 수 있습니다. 전압 분배 법칙으로 각 저항에 걸리는 전압을 구할 수 있습니다. 전력 공식을 사용해 부품의 정격 전력을 선정할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","먼저 합산 저항에서 꼭 알아야 할 내용을 정리해 보겠습니다. 저항의 직렬 연결 총 저항은 200Ω (100 + 100)이 됩니다. 저항의 병렬 연결 총 저항은 50Ω(1/(1/100 +1/100))이 됩니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","저항의 직렬 연결 총 저항은 200Ω (100 + 100)이 됩니다. 저항의 병렬 연결 총 저항은 50Ω(1/(1/100 +1/100))이 됩니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","전압 분배법칙의 핵심 내용을 짚어보겠습니다. 직렬연결에서의 전압 V=I×R에 의해 전류는 50mA 각 저항에 걸리는 전압은 V=I×R에 의해 5V 병렬연결에서의 전압 저항 하나당 폐회로가 되기 때문에 각 저항에 걸리는 전압과 전류는 10V, 100mA. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","직렬연결에서의 전압 V=I×R에 의해 전류는 50mA 각 저항에 걸리는 전압은 V=I×R에 의해 5V 병렬연결에서의 전압 저항 하나당 폐회로가 되기 때문에 각 저항에 걸리는 전압과 전류는 10V, 100mA. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","전력(電力, electric power)의 핵심 내용을 짚어보겠습니다. 전력은 전기 에너지가 할 수 있는 일의 능력을 측정하는 단위이며 Watt를 사용합니다. P = V×I P는 전력, V는 전압 I는 전류 이 공식에서 얻을 수 있는 내용은 아래와 같습니다. → 전압이 높아지면 전기 에너지가 할 수 있는 일의 능력이 좋아집니다. → 전류가 높아지면 전기 에너지가 할 수 있는 일의 능력이 좋아집니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 마력과 전력에 관한 내용입니다. 기계적 마력 (Mechanical Horsepower): 745.7W. 전기적 마력 (Electrical Horsepower): 746~756W. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다음은 전력 공식의 예에 관한 내용입니다. 2A = 2000mA = 0.002kA. 24V = 24000mV = 0.024kV. 12Ω = 12000mΩ = 0.012kΩ. 48W = 48000mW = 0.048kW. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","2A = 2000mA = 0.002kA. 24V = 24000mV = 0.024kV. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 부하의 전력이란에 관한 내용입니다. 부하에서 전력을 계산하는 이유는 부하가 할 수 있는 일(즉, 부하가 버틸 수 있는 에너지)을 계산 저항과 같은 경우 버틸 수 있는 전력을 넘어가게 되면 터집니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","부하에서 전력을 계산하는 이유는 부하가 할 수 있는 일(즉, 부하가 버틸 수 있는 에너지)을 계산 저항과 같은 경우 버틸 수 있는 전력을 넘어가게 되면 터집니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","먼저 저항의 선택에서 꼭 알아야 할 내용을 정리해 보겠습니다. 저항의 중요 요소는 저항 값과 전력입니다. 저항 값은 전압과 전류를 알고 있을 때, V = I × R 공식으로 유추할 수 있습니다. R=I/V 임이 유추 되며, P = V × I 공식을 사용할 수 있습니다. 예를 들어 5V에서 10mA의 전류를 사용하고 싶다면 R=5V/10mA가 되어 500Ω이 되며, 전력은 P = 5V × 10mA가 되어 0.05W가 됩니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","저항의 중요 요소는 저항 값과 전력입니다. 저항 값은 전압과 전류를 알고 있을 때, V = I × R 공식으로 유추할 수 있습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 핵심 정리에 관한 내용입니다. 직렬회로에서는 전류가 같고 전압이 저항 값에 비례해 나뉩니다. 병렬회로에서는 전압이 같고 전류가 각 경로로 나뉩니다. 전력은 단위 시간에 사용한 에너지이며 $P=VI$로 계산했습니다. 저항은 계산값보다 여유가 있는 정격 전력의 제품을 선정해야 합니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-03-voltage-division-and-power-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
