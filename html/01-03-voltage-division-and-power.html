<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-3. 전압 분배와 전력 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-03-voltage-division-and-power-deck.html#1" title="1-3. 전압 분배와 전력 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-3. 전압 분배와 전력</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-3. 전압 분배와 전력 내용을 시작하겠습니다. 이번에는 옴의 법칙인 V = IR을 더 자세히 이해하기 위해 저항의 연결 방식과 특성을 살펴보겠습니다. 이어서 옴의 법칙과 함께 전기회로에서 가장 많이 사용되는 전력 공식인 P = VI에 대해서도 알아보겠습니다.","여러 개의 저항을 연결하면 연결 방식에 따라 전체 저항값이 달라집니다. 저항의 연결 방식은 크게 직렬 연결과 병렬 연결로 구분됩니다. **저항의 직렬 연결** 저항을 직렬로 연결하면 각 저항의 값을 모두 더해 전체 저항을 계산합니다. 100Ω 저항 두 개를 직렬로 연결한 경우 전체 저항은 다음과 같습니다. R = 100Ω + 100Ω = 200Ω 따라서 전체 저항은 200Ω이 됩니다.","여러 개의 저항을 연결하면 연결 방식에 따라 전체 저항값이 달라집니다. 저항의 연결 방식은 크게 직렬 연결과 병렬 연결로 구분됩니다. **저항의 직렬 연결** 저항을 직렬로 연결하면 각 저항의 값을 모두 더해 전체 저항을 계산합니다.","**직렬 회로에서의 전압** 직렬 회로에서는 전체 전압이 각 저항의 크기에 비례하여 분배됩니다. 예를 들어 100Ω 저항 두 개를 직렬로 연결하고 10V를 인가하면 전체 저항은 200Ω이 됩니다. 옴의 법칙에 따라 회로에 흐르는 전류는 다음과 같습니다. I = V ÷ R I = 10V ÷ 200Ω = 0.05A 따라서 회로에는 50mA의 전류가 흐릅니다. 각 저항에 걸리는 전압은 다음과 같습니다.","**직렬 회로에서의 전압** 직렬 회로에서는 전체 전압이 각 저항의 크기에 비례하여 분배됩니다. 예를 들어 100Ω 저항 두 개를 직렬로 연결하고 10V를 인가하면 전체 저항은 200Ω이 됩니다. 옴의 법칙에 따라 회로에 흐르는 전류는 다음과 같습니다.","전력은 전기 에너지가 일정한 시간 동안 할 수 있는 일의 크기를 의미합니다. 전력의 단위는 와트(Watt, W)를 사용합니다. 전력은 다음 공식으로 계산합니다. P = V × I - P : 전력(Power) - V : 전압(Voltage) - I : 전류(Current) 이 공식을 통해 다음과 같은 관계를 알 수 있습니다. - 같은 전류에서는 전압이 높아질수록 전력이 커집니다.","마력(Horsepower, HP)은 말이 할 수 있는 일의 능력을 기준으로 만든 동력 단위입니다. 모터나 엔진의 출력 성능을 표현할 때 주로 사용합니다. 일반적으로 1HP는 약 746W입니다. - 기계 마력(Mechanical Horsepower) : 745.7W - 전기 마력(Electrical Horsepower) : 약 746W.","전압, 전류, 저항은 옴의 법칙을 이용해 계산합니다. V = I × R 예를 들어 전류가 2A이고 저항이 12Ω인 경우 전압은 다음과 같습니다. - V = 2A × 12Ω = 24V - I = 24V ÷ 12Ω = 2A - R = 24V ÷ 2A = 12Ω - P = 24V × 2A = 48W 따라서 이 회로의 전압은 24V, 전류는 2A, 저항은 12Ω, 전력은 48W입니다.","전압, 전류, 저항은 옴의 법칙을 이용해 계산합니다. V = I × R 예를 들어 전류가 2A이고 저항이 12Ω인 경우 전압은 다음과 같습니다. - V = 2A × 12Ω = 24V - I = 24V ÷ 12Ω = 2A - R = 24V ÷ 2A = 12Ω - P = 24V × 2A = 48W 따라서 이 회로의 전압은 24V, 전류는 2A, 저항은 12Ω, 전력은 48W입니다.","전기에서는 값의 크기에 따라 m(Milli), k(Kilo)와 같은 접두어를 사용합니다. - m(Milli) : 1/1,000 - k(Kilo) : 1,000 앞의 계산값을 변환하면 다음과 같습니다. - 2A = 2,000mA = 0.002kA - 24V = 24,000mV = 0.024kV - 12Ω = 12,000mΩ = 0.012kΩ - 48W = 48,000mW = 0.048kW 단위를 변환할 때에는 숫자뿐 아니라 단위도 함께 변환해야 합니다.","부하에서 전력을 계산하는 이유는 해당 부하가 소비하거나 처리하는 전기 에너지의 크기를 확인하기 위해서입니다. 전력은 부하가 사용할 수 있는 에너지의 크기를 나타냅니다. 모터에서는 출력과 소비 전력을 확인하는 기준이 되며, 히터에서는 발생하는 열의 크기를 판단하는 기준이 됩니다. 저항과 같은 부품은 허용 전력을 초과하면 과도한 열이 발생합니다. 이 상태가 계속되면 저항이 변색되거나 손상되고, 심한 경우에는 파손될 수도 있습니다.","부하에서 전력을 계산하는 이유는 해당 부하가 소비하거나 처리하는 전기 에너지의 크기를 확인하기 위해서입니다. 전력은 부하가 사용할 수 있는 에너지의 크기를 나타냅니다. 모터에서는 출력과 소비 전력을 확인하는 기준이 되며, 히터에서는 발생하는 열의 크기를 판단하는 기준이 됩니다.","저항을 선택할 때에는 저항값과 허용 전력을 함께 고려해야 합니다. 저항값은 옴의 법칙으로 계산합니다. R = V ÷ I 예를 들어 5V 전원에서 10mA의 전류를 사용하려면 먼저 전류를 A 단위로 변환합니다. 10mA = 0.01A 필요한 저항은 다음과 같습니다. R = 5V ÷ 0.01A = 500Ω 저항에서 소비되는 전력은 다음과 같습니다.","저항을 선택할 때에는 저항값과 허용 전력을 함께 고려해야 합니다. 저항값은 옴의 법칙으로 계산합니다. R = V ÷ I 예를 들어 5V 전원에서 10mA의 전류를 사용하려면 먼저 전류를 A 단위로 변환합니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-03-voltage-division-and-power-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
