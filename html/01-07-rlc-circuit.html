<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-7. RLC 회로 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-07-rlc-circuit-deck.html#1" title="1-7. RLC 회로 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-7. RLC 회로</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-7. RLC 회로을 학습하겠습니다. 저항(R), 인덕터(L), 커패시터(C)는 회로의 전압과 전류가 변하는 모습을 결정하는 기본 수동소자입니다. 각 소자가 에너지를 소비하거나 저장하는 방식에 주목했습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 저항·인덕터·커패시터의 역할을 비교할 수 있습니다. 회로 조건에 맞는 저항과 커패시터를 선정할 수 있습니다. RLC 회로에서 각 소자가 신호와 에너지에 미치는 영향을 이해할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","먼저 저항 선정에서 꼭 알아야 할 내용을 정리해 보겠습니다. R = (5V - 1.8V) / 0.02A 저항 160Ω 이상인 200Ω 선택 (이상도 가능하지만 밝기가 어두워짐) 이때 200Ω 저항에 걸리는 전압은 3.2V 이기 때문에 전류를 계산하면 V = I × R에 의해 I = 3.2V / 200Ω = 16mA 이때, 필요 전력은 P = V × I에 의해 P = 3.2V × 16mA = 51mW의 전력이 가능한 저항을 선택. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","R = (5V - 1.8V) / 0.02A 저항 160Ω 이상인 200Ω 선택 (이상도 가능하지만 밝기가 어두워짐) 이때 200Ω 저항에 걸리는 전압은 3.2V 이기 때문에 전류를 계산하면 V = I × R에 의해 I = 3.2V / 200Ω = 16mA 이때, 필요 전력은 P = V × I에 의해 P = 3.2V × 16mA = 51mW의 전력이 가능한 저항을 선택. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 선정된 저항에 관한 내용입니다. 200Ω에 0.25W (1/4W) 면 충분 한 개에 20원짜리 제품을 사용하면 더 저렴합니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","200Ω에 0.25W (1/4W) 면 충분 한 개에 20원짜리 제품을 사용하면 더 저렴합니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","먼저 커패시터(C)에서 꼭 알아야 할 내용을 정리해 보겠습니다. 전하를 충전하는 특징이 있습니다. 배터리와 다르게 빠르게 충전되고 빠르게 방전됩니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","전하를 충전하는 특징이 있습니다. 배터리와 다르게 빠르게 충전되고 빠르게 방전됩니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","먼저 커패시터 선정에서 꼭 알아야 할 내용을 정리해 보겠습니다. 주로 사용되는 곳이 전원부이다 보니 사용되어야 하는 소자나 CPU에 요구되는 커패시터가 존재 해당 CPU와 소자등의 안정화와 연관이 깊기 때문에 제조사 추천 커패시터를 사용하면 됩니다. (별도 계산을 하면서 적용해본 적이 없습니다.). 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","먼저 인덕터(L)에서 꼭 알아야 할 내용을 정리해 보겠습니다. 인덕터는 전류가 흐를 때 자기장을 형성하여 에너지를 저장하는 소자입니다. 커패시터가 전압의 급격한 변화를 방해한다면, 인덕터는 전류의 급격한 변화를 방해했습니다. 인덕터는 전류 변화를 싫어합니다. 전류가 갑자기 증가하거나 감소하려고 하면 이를 방해하는 특징이 있습니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","인덕터는 전류가 흐를 때 자기장을 형성하여 에너지를 저장하는 소자입니다. 커패시터가 전압의 급격한 변화를 방해한다면, 인덕터는 전류의 급격한 변화를 방해했습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","인덕터의 특징의 핵심 내용을 짚어보겠습니다. 전류를 저장합니다. 자기장을 이용합니다. 전류 변화에 저항합니다. 코일 형태로 제작됩니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","전류를 저장합니다. 자기장을 이용합니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","다음은 RLC 회로에 관한 내용입니다. R → Resistor. 전류 제한. L → 인덕터. 전압 저장. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다음은 핵심 정리에 관한 내용입니다. 저항은 전류를 제한하고 전기에너지를 주로 열로 소비했습니다. 커패시터는 전기장에 에너지를 저장하며 전압의 급격한 변화를 방해했습니다. 인덕터는 자기장에 에너지를 저장하며 전류의 급격한 변화를 방해했습니다. RLC 소자를 조합하면 필터, 공진회로, 전원 안정화 회로를 구성할 수 있습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-07-rlc-circuit-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
