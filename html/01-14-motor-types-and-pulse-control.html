<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>1-14. AC, DC, BLDC, 스테핑 모터, 서보 모터의 펄스 제어 방식 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-14-motor-types-and-pulse-control-deck.html#1" title="1-14. AC, DC, BLDC, 스테핑 모터, 서보 모터의 펄스 제어 방식 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-14. AC, DC, BLDC, 스테핑 모터, 서보 모터의 펄스 제어 방식</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-14. AC, DC, BLDC, 스테핑 모터, 서보 모터의 펄스 제어 방식을 학습하겠습니다. 모터는 전원 방식과 구조에 따라 속도, 토크, 정밀도, 유지보수 특성이 달라집니다. AC, DC, BLDC, 스테핑, 서보 모터의 제어 방식을 비교하고 피드백 제어의 기초를 살펴보았습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 주요 모터 종류의 구조와 용도를 비교할 수 있습니다. PWM, V/F, FOC 제어의 목적과 차이를 이해할 수 있습니다. 피드백과 PID 제어가 오차를 줄이는 과정을 설명할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","AC 모터 제어 방식의 핵심 내용을 짚어보겠습니다. f = 주파수. P = 극수. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 V/F (=Voltage / Frequency)에 관한 내용입니다. AC → DC → PWM → AC. 자세한 내용은 전력 변환기 내용 참조. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","AC → DC → PWM → AC. 자세한 내용은 전력 변환기 내용 참조. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 FOC (=Field Oriented Control)에 관한 내용입니다. *고가의 인버터 혹은 서보 모터에서 주력으로 사용* 주파수 변경 → 속도 변경 전압 변경 → 토크 변경 V/F 제어는 토크 제어 불가능 홀 센서를 사용해 현재 위치와 속도를 감시하면서 전압과 주파수를 정밀하게 제어. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다음은 V/F vs FOC에 관한 내용입니다. V/F 실시간 제어 기능 없음 FOC 피드백 을 기반으로 실시간 제어 포함. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","V/F 실시간 제어 기능 없음 FOC 피드백 을 기반으로 실시간 제어 포함. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","DC 모터 제어 방식의 핵심 내용을 짚어보겠습니다. V = 공급전압. E = 역기전력. I = 전류. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","V = 공급전압. E = 역기전력. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","다음은 PWM (=Pulse Width Modulation)에 관한 내용입니다. 듀티를 변화시켜 원하는 전압으로 변환할 수 있습니다. 실제 전압을 만들어내는 과정은 전자실습 (마이크로컨트롤러) 과정에서 진행합니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","듀티를 변화시켜 원하는 전압으로 변환할 수 있습니다. 실제 전압을 만들어내는 과정은 전자실습 (마이크로컨트롤러) 과정에서 진행합니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 BLDC 모터에 관한 내용입니다. BLDC(=Brushless DC) 모터는 이름에서 알 수 있듯이 브러시가 없는 DC 모터입니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","BLDC(=Brushless DC) 모터는 이름에서 알 수 있듯이 브러시가 없는 DC 모터입니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","DC vs BLDC의 핵심 용어를 그림과 연결해 전체 흐름을 정리해 보겠습니다.","그림의 구성 요소와 전류 또는 신호의 흐름을 차례로 확인하겠습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","모터 비교의 핵심 용어를 그림과 연결해 전체 흐름을 정리해 보겠습니다.","서보 모터의 핵심 내용을 짚어보겠습니다. 서보 시스템은 DC 모터, AC 모터, BLDC 모터 등에 엔코더와 제어기를 결합해 정밀 제어할 때 사용됩니다. 서보라는 말은 특정 모터 구조보다 피드백을 이용해 위치·속도·토크를 정밀하게 제어하는 시스템을 뜻합니다. 서보 모터는 반드시 엔코더와 모터 드라이브를 포함해야 합니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 제어기에 관한 내용입니다. 제어기의 목표는 기준값과 측정값 사이의 오차를 줄이는 것입니다. 현재 오차를 확인하고 다음 제어 주기의 출력값을 보정했습니다. 제어 주기가 짧을수록 변화에 빠르게 반응할 수 있지만, 센서 노이즈와 연산 부하도 함께 고려해야 합니다. MV(t) : 출력, 𝐾_𝑝 : 비례 상수, 𝐾_𝑖 : 적분 상수, 𝐾_𝑑 : 미분 상수. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","제어기의 목표는 기준값과 측정값 사이의 오차를 줄이는 것입니다. 현재 오차를 확인하고 다음 제어 주기의 출력값을 보정했습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 PID Controller에 관한 내용입니다. $MV(t) = K_pe(t)$. Error에 대한 출력 변화를 증가. $MV(t)=K_i ∫_0^te(t)dt$. 적분(과거의 Error를 반영)해 출력 변화를 증가 : 정상상태 오차 감소. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다음은 핵심 정리에 관한 내용입니다. AC 모터는 주파수로 속도를, 전압으로 자속과 토크 특성을 제어했습니다. DC 모터는 전압과 PWM 듀티비로 속도를 조절하기 쉬웠습니다. BLDC와 서보 시스템은 센서 피드백을 이용해 위치와 속도를 정밀하게 제어했습니다. PID 제어기는 현재·누적·변화 추세의 오차를 조합해 출력값을 보정했습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-14-motor-types-and-pulse-control-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
