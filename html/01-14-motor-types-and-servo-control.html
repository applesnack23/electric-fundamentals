    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }

<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-14-motor-types-and-servo-control-deck.html#1" title="1-14. AC, DC, BLDC, 스테핑 모터와 서보 제어 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-14. AC, DC, BLDC, 스테핑 모터와 서보 제어</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-14. AC, DC, BLDC, 스테핑 모터와 서보 제어 내용을 시작하겠습니다. 모터는 전기 에너지를 회전 운동으로 변환하는 장치입니다. 하지만 모터의 종류에 따라 속도와 토크를 제어하는 방법이 서로 다릅니다. AC 모터는 주파수와 전압을 조절하고, DC 모터는 주로 전압이나 PWM을 이용합니다. BLDC 모터는 전자적인 정류가 필요하며, 스테핑 모터는 펄스의 개수와 주파수로 위치와 속도를 제어합니다.","AC 모터의 회전속도는 전원의 주파수와 모터의 극수에 따라 결정됩니다. 동기속도는 다음과 같이 계산합니다. - $N_s$: 동기속도(rpm) - $f$: 전원 주파수(Hz) - $P$: 모터 극수 예를 들어 4극 모터에 60Hz 전원을 공급하면 동기속도는 다음과 같습니다. 유도 모터는 실제 운전 시 슬립(Slip)이 발생하므로 실제 회전속도는 동기속도보다 약간 낮습니다.","V/F 제어는 전압(Voltage)과 주파수(Frequency)의 비율을 일정하게 유지하는 방식이며, 실시간 제어 기능은 없습니다. 범용 인버터에서 가장 널리 사용하는 기본적인 제어 방식입니다. 인버터 내부에서는 일반적으로 다음과 같은 전력 변환이 이루어집니다. AC 입력 → DC 정류 → PWM 스위칭 → 가변 주파수 AC 출력 주파수를 낮추면 모터 속도가 감소하고, 주파수를 높이면 모터 속도가 증가합니다. 하지만 주파수만 변경하면 모터 내부 자속이 달라질 수 있으므로 전압도 함께 변경합니다.","V/F에 관한 시각 자료입니다. V/F의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","FOC(Field-Oriented Control)는 모터 전류를 자속 성분과 토크 성분으로 분리하여 제어하는 방식이며, Feedback 을 기반으로 실시간 제어를 포함합니다. 우리말로는 자속 기준 제어 또는 벡터 제어라고 표현합니다. FOC는 3상 전류를 수학적으로 변환하여 모터의 자속과 토크를 독립적으로 제어합니다. 기본적인 변환 과정은 다음과 같습니다. 3상 전류(a, b, c) → Clarke 변환 → αβ 좌표계 → Park 변환 → dq 좌표계 - d축 전류: 모터의 자속을 제어합니다.","FOC (=Field Oriented Control)에 관한 시각 자료입니다. FOC (=Field Oriented Control)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","V/F 제어와 FOC 비교의 핵심 개념을 정리하겠습니다.","DC 모터는 공급 전압에 따라 속도가 비교적 직관적으로 변합니다. 일반적으로 다음과 같이 이해할 수 있습니다. - 전압 증가 → 회전속도 증가 - 전압 감소 → 회전속도 감소 - 극성 변경 → 회전 방향 변경 DC 모터의 기본 전압 관계는 다음과 같습니다. - $V$: 공급 전압 - $E$: 역기전력 - $I$: 전류 - $R$: 전기자 저항 모터가 회전하면 역기전력($E$)이 발생합니다. 모터가 정지해 있을 때는 역기전력이 거의 없으므로 큰 기동 전류가 흐를 수 있습니다.","DC 모터 제어 방식에 관한 시각 자료입니다. DC 모터 제어 방식의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","DC 모터의 속도는 PWM(Pulse Width Modulation)을 이용하여 제어할 수 있습니다. PWM은 전원을 매우 빠르게 ON/OFF하면서 ON 상태의 비율을 조절하는 방식입니다. 이 비율을 듀티비(Duty Ratio)라고 합니다. 예를 들어 12V 전원에서 듀티비를 50%로 설정하면 모터는 평균적으로 약 6V에 해당하는 에너지를 공급받습니다. - Duty 100% → 최대 출력 - Duty 50% → 약 절반의 평균 출력 - Duty 0% → 출력 없음 실제로는 전압 자체를 낮추는 것이 아니라 매우 빠르게 ON/OFF하여 평균 전력을 조절합니다.","PWM (=Pulse Width Modulation)에 관한 시각 자료입니다. PWM (=Pulse Width Modulation)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","BLDC(Brushless DC) 모터는 브러시가 없는 DC 모터입니다. 일반 DC 모터는 브러시와 정류자를 이용하여 코일에 흐르는 전류 방향을 기계적으로 변경합니다. BLDC 모터는 브러시 대신 전력 반도체를 이용하여 전류 방향을 전자적으로 전환합니다. 이를 전자 정류(Electronic Commutation)라고 합니다. BLDC 모터는 일반적으로 다음 요소가 필요합니다.","BLDC 모터에 관한 시각 자료입니다. BLDC 모터의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","DC 모터와 BLDC 모터 비교의 핵심 개념을 정리하겠습니다.","스테핑 모터는 입력 펄스에 따라 일정한 각도씩 회전하는 모터입니다. 펄스 한 개가 입력될 때마다 정해진 스텝 각도만큼 이동합니다. 예를 들어 스텝 각도가 1.8°인 모터는 200개의 펄스를 입력하면 한 바퀴 회전합니다. 스테핑 모터에서는 다음과 같이 제어합니다.","스테핑 모터에 관한 시각 자료입니다. 스테핑 모터의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","모터 비교의 핵심 개념을 정리하겠습니다.","서보(Servo)는 특정한 모터 종류를 의미하기보다, 명령한 위치와 속도, 토크를 정확하게 따라가도록 구성한 폐루프 제어 시스템을 의미합니다. 서보 시스템은 일반적으로 다음 요소로 구성됩니다. - 모터 - 엔코더 또는 리졸버 - 서보 드라이브 - 상위 제어기 서보 모터는 반드시 피드백 장치를 사용하여 실제 위치와 속도를 측정합니다. 서보 드라이브는 목표값과 실제값을 비교하여 오차를 계산하고, 오차가 줄어들도록 출력을 계속 보정합니다. 서보 시스템에는 다양한 모터를 사용할 수 있습니다.","서보 시스템의 목표는 명령값과 실제값의 오차를 줄이는 것입니다. - Setpoint: 목표값 - Process Value: 실제 측정값 - Error: 목표값과 실제값의 차이 제어기는 현재 오차를 계산하고 다음 제어 주기에 적용할 출력을 결정합니다. 이 과정을 매우 빠르게 반복하면서 목표 위치나 속도를 유지합니다. 응답 주기가 짧을수록 변화에 빠르게 대응할 수 있지만, 제어기와 센서의 성능도 함께 높아야 합니다.","폐루프 제어기에 관한 시각 자료입니다. 폐루프 제어기의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","PID 제어기는 비례(P), 적분(I), 미분(D) 세 가지 제어를 결합한 방식입니다. - $MV(t)$: 제어 출력 - $e(t)$: 오차 - $K_p$: 비례 게인 - $K_i$: 적분 게인 - $K_d$: 미분 게인.","P 제어는 현재 오차의 크기에 비례하여 출력을 만듭니다. 오차가 크면 출력도 크게 증가하고, 오차가 작으면 출력도 작아집니다. **특징** - 응답이 빠릅니다. - 구조가 단순합니다. - 정상상태 오차가 남을 수 있습니다.","P 제어에 관한 시각 자료입니다. P 제어의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","I 제어는 과거의 오차를 누적하여 출력에 반영합니다. 작은 오차가 오랫동안 지속되더라도 적분값이 증가하여 최종적으로 오차를 줄입니다. **특징** - 정상상태 오차를 제거하는 데 유리합니다. - 응답이 느려질 수 있습니다. - 적분값이 과도하게 누적되는 Integral Windup이 발생할 수 있습니다.","I 제어에 관한 시각 자료입니다. I 제어의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","D 제어는 오차의 변화 속도를 이용합니다. 오차가 빠르게 변하면 큰 출력을 만들어 변화에 미리 대응합니다. **특징** - 급격한 변화에 빠르게 대응합니다. - 오버슈트와 진동을 줄이는 데 도움을 줍니다. - 센서 노이즈에 민감합니다.","코드의 동작 순서는 다음과 같습니다. 1. 목표값과 실제값의 차이인 오차를 계산합니다. 2. 오차를 시간에 따라 누적하여 적분값을 계산합니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-14-motor-types-and-servo-control-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
