<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-2. 전압, 전류, 저항의 개념 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-02-voltage-current-resistance-deck.html#1" title="1-2. 전압, 전류, 저항의 개념 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-2. 전압, 전류, 저항의 개념</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-2. 전압, 전류, 저항의 개념 내용을 시작하겠습니다.","전기는 전하의 이동과 그에 따른 여러 현상을 다루는 분야입니다. 전기 회로를 이해하려면 전압, 전류, 저항의 의미와 세 개념이 서로 어떤 관계를 맺는지 먼저 알아야 합니다.","전기는 자유전자가 이동하면서 발생합니다. 하지만 자유전자가 스스로 움직이는 것은 아닙니다. 전자를 움직이게 하는 힘이 필요하며, 그 힘을 전압(Voltage)이라고 합니다. 전압이 발생하면 전위가 높은 곳에 있는 전자가 전위가 낮은 방향으로 밀려나고, 밀려난 전자는 다시 앞의 전자를 밀어내면서 연속적으로 이동하게 됩니다. 이처럼 전압에 의해 전자가 이동하는 현상을 전류(Current)라고 합니다.","전압은 전기를 흐르게 하는 힘이며, 단위는 볼트(Volt, V)를 사용합니다. 전압은 반드시 전위차(Potential Difference)가 있을 때 발생합니다. 예를 들어 한 지점의 전위가 27V이고 다른 지점의 전위가 3V라면 두 지점의 전위차는 24V입니다. 즉, 실제 전압은 24V가 됩니다. 전압이 형성되면 도선 주변에는 전기장이 형성되며, 전류가 흐르면 자기장도 함께 형성됩니다.","전압(電壓, Voltage)에 관한 시각 자료입니다. 전압(電壓, Voltage)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","폐회로는 회로가 완전히 연결된 상태를 의미합니다. 회로가 닫혀 있으므로 전류가 흐를 수 있습니다.","폐회로(Closed Circuit)에 관한 시각 자료입니다. 폐회로(Closed Circuit)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","개회로는 회로가 끊어진 상태를 의미합니다. 회로가 열려 있으므로 전류가 흐르지 않습니다.","개회로(Open Circuit)에 관한 시각 자료입니다. 개회로(Open Circuit)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","그림에 표시된 27V와 3V는 기준점이 없기 때문에 절대적인 의미를 가지지 않습니다. 실제 전기 회로에서는 항상 기준점을 정하여 전압을 표시합니다. 이 책에서는 24V 전원을 기준으로 다음과 같이 표기하겠습니다. - P24 : +24V - N24 : 0V 즉, P24는 N24를 기준으로 +24V의 전위를 가지며, N24는 기준점이므로 0V가 됩니다. 다만 다른 회로에서는 기준점이 달라질 수 있으므로 같은 지점이라도 0V가 아닐 수도 있습니다.","기준 전압에 관한 시각 자료입니다. 기준 전압의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","전류는 전자가 이동하는 흐름입니다. 단위는 암페어(Ampere, A)를 사용합니다. 1A는 1초 동안 1쿨롱(C)의 전하가 이동하는 양을 의미합니다. 전압이 발생하면 자유전자가 이동하게 되고, 그 결과 전류가 흐르게 됩니다. 전류가 흐르면 도선 주변에는 자기장이 형성되며 다양한 전기적 현상이 발생합니다.","왼쪽 그림은 전자의 실제 이동 방향으로 낮은 전위에서 높은 전위로 이동합니다. 반면 전류는 오른쪽 그림과 같이 높은 전위에서 낮은 전위 방향으로 정의되어 있습니다. 이는 전자의 실제 이동 방향이 밝혀지기 전에 전류의 방향을 먼저 정의했기 때문입니다. 현재도 대부분의 전기 회로와 교재에서는 전류의 방향을 기준으로 설명하고 있습니다. 우리는 높은 전위에서 낮은 전위로 이동하는 전류만 기억을 하면 됩니다.","전자의 이동 방향에 관한 시각 자료입니다. 전자의 이동 방향의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","전류가 흐르는 회로에는 일반적으로 부하(Load)가 존재합니다. 하지만 부하 없이 전원을 직접 연결하면 매우 큰 전류가 흐르게 됩니다. 이러한 상태를 쇼트(Short Circuit) 또는 단락이라고 합니다. 쇼트가 발생하면 매우 큰 전류가 흐르면서 도선이 과열되고 화재나 장비 손상이 발생할 수 있습니다. 따라서 회로에는 반드시 전류를 적절하게 제한하는 요소가 필요합니다.","쇼트(단락, Short Circuit)에 관한 시각 자료입니다. 쇼트(단락, Short Circuit)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","저항은 전류의 흐름을 방해하는 성질이며, 단위는 옴(Ohm, Ω)을 사용합니다. 저항은 다양한 종류와 값을 가지며 일반적으로 색 띠(Color Code)를 이용하여 값을 표시합니다. 다만 실무에서는 색 띠를 모두 외우기보다는 테스터기를 이용하여 저항 값을 측정하는 경우가 훨씬 많습니다. 자주 사용하지 않는다면 색 띠를 암기하는 것보다 측정 방법을 익히는 것이 더욱 효율적입니다.","저항(抵抗, Resistance)에 관한 시각 자료입니다. 저항(抵抗, Resistance)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","전기에서 가장 중요한 공식 중 하나가 바로 옴의 법칙입니다. **V = I × R** - V : 전압(Voltage) - I : 전류(Current) - R : 저항(Resistance) 이 공식을 통해 다음과 같은 관계를 알 수 있습니다. - 같은 전압에서는 저항이 커질수록 전류는 작아집니다. - 같은 저항에서는 전압이 높아질수록 전류는 커집니다. 이 공식은 앞으로 전기 회로를 설계하고 분석하는 과정에서 가장 자주 사용하게 되는 기본 공식입니다.","전압, 전류, 저항의 관계에 관한 시각 자료입니다. 전압, 전류, 저항의 관계의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-02-voltage-current-resistance-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
