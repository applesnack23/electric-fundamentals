  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }

</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-02-voltage-current-resistance-deck.html#1" title="1-2. 전압, 전류, 저항의 개념 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-2. 전압, 전류, 저항의 개념</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>

  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-2. 전압, 전류, 저항의 개념을 학습하겠습니다. 전압, 전류, 저항은 모든 전기회로를 설명하는 가장 기본적인 세 가지 물리량입니다. 물의 압력과 흐름을 떠올리면 세 개념의 관계를 비교적 쉽게 이해할 수 있습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 전압, 전류, 저항의 의미와 단위를 구분할 수 있습니다. 폐회로와 개회로에서 전류가 흐르는 조건을 설명할 수 있습니다. 옴의 법칙을 사용해 전압·전류·저항을 계산할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","전기(電氣, Electricity)의 핵심 내용을 짚어보겠습니다. 전기를 조금 더 자세히 이해해보고자 잠시 화학 이야기를 시작합니다. 전체 교육 과정은 기계, 전기, 전자, PLC, 디지털 트윈, 소프트웨어, ROS2, 비전, 피지컬 AI로 구성했습니다. 이 장에서는 그중 전기·전자 분야의 가장 기초적인 내용을 다루었습니다. 각 기술은 서로 독립되어 있지 않고 많은 부분에서 연결되었습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 전압, 전류, 저항에 관한 내용입니다. 전압은 두 지점 사이의 전위차이며 전하를 이동시키는 원인이 되었습니다. 도체의 양 끝에 전압을 가하면 도체 내부에 전기장이 형성되고 전하가 이동했습니다. 단위 시간 동안 흐르는 전하의 양을 전류라고 합니다. 실제 도체에서는 이동하는 전자가 원자 격자와 충돌했습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","전압(電壓 : 전기의 압력, Voltage)의 핵심 내용을 짚어보겠습니다. 전압의 단위는 볼트(V)입니다. 영어 용어는 voltage이며, 물리량의 이름과 단위를 구분해야 합니다. 전압은 폐회로에서의 전위차에 의해 발생합니다. 그림과 같이 3V 전위를 갖는 낮은 전위와 27V 전위를 갖는 높은 전위가 있을 때, 이 둘의 전위차는 24V가 됩니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","전압의 단위는 볼트(V)입니다. 영어 용어는 voltage이며, 물리량의 이름과 단위를 구분해야 합니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","먼저 폐회로와 개회로에서 꼭 알아야 할 내용을 정리해 보겠습니다. 폐회로 (Closed Circuit) 닫힌 회로: 전기가 흐릅니다. 개회로 (Open Circuit) 열린 회로: 전기가 흐르지 않습니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","폐회로 (Closed Circuit) 닫힌 회로: 전기가 흐릅니다. 개회로 (Open Circuit) 열린 회로: 전기가 흐르지 않습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 기준 전압에 관한 내용입니다. 표기된 27V와 3V는 기준점이 없기 때문에 의미 없는 수치입니다. 앞으로 우리는 이러한 도면에서의 전압 표기는 P24와 N24로 구분합니다. 24 V 전압원에서의 낮은 전위와 높은 전위를 구분합니다. 즉 폐회로에서의 기준이 되며, P24는 N24를 기준으로 24V의 전위를 갖고, N24는 P24를 기준으로 0V의 전위를 갖습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","표기된 27V와 3V는 기준점이 없기 때문에 의미 없는 수치입니다. 앞으로 우리는 이러한 도면에서의 전압 표기는 P24와 N24로 구분합니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 전류(電流 : 전기의 흐름, Ampere)에 관한 내용입니다. 단위는 암페어(A)이며, 1 A는 1초 동안 1쿨롱(C)의 전하가 이동하는 전류입니다. 전자는 원자 내에서 마이너스 전하를 가진 입자로, 전위차가 존재할 때 전자는 낮은 전위에서 높은 전위로 이동하게 되는데 이것을 전류라고 합니다. 전압이 생기고 전류가 흐르면 도선 주위에 자기장이 형성되며, 그 즉시 전기의 효력이 발생하게 됩니다. 전류는 흐르는 방향에 따라 직류와 교류 2가지로 구분됩니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다음은 전자/전류 이동 방향에 관한 내용입니다. 전자의 이동 방향 전자는 낮은 전위에서 높은 전위로 이동을 합니다. 전류의 이동 방향 전류는 높은 전위에서 낮은 전위로 이동을 합니다. 전자의 이동 방향을 과학적으로 측정하지 못했을 때, 당연히 높은 전위에서 낮은 전위로 이동할 것이라는 생각 때문에 과거부터 쌓여온 모든 문서는 높은 전위에서 낮은 전위로 흐른다고 설명하고 있고, 지금도 그렇게 사용하고 있습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","전자의 이동 방향 전자는 낮은 전위에서 높은 전위로 이동을 합니다. 전류의 이동 방향 전류는 높은 전위에서 낮은 전위로 이동을 합니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 쇼트 (단락, 短絡, Short Circuit)에 관한 내용입니다. 전위차가 있는 폐회로는 전기가 흐른다는 것을 표현할 때 항상 부하(LOAD)를 포함하는 회로를 만듭니다. 이때, 부하가 존재하지 않는다면 전위차가 있는 만큼 최대 전류가 흐르게 됩니다. 이것을 쇼트라고 표현하며 고전류가 흐르게 되므로 매우 위험한 상황이 됩니다. 부하는 전류를 제한하게 하며, 이것을 저항 (抵抗, Resistance) 라 합니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","전위차가 있는 폐회로는 전기가 흐른다는 것을 표현할 때 항상 부하(LOAD)를 포함하는 회로를 만듭니다. 이때, 부하가 존재하지 않는다면 전위차가 있는 만큼 최대 전류가 흐르게 됩니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","저항 (抵抗, Resistance)의 핵심 내용을 짚어보겠습니다. 저항은 전기 회로에서 전류의 흐름을 방해하는 물질의 특성이며, 당위는 Ohm(Ω)을 사용합니다. 다양한 종류의 저항이 있고, 저항마다 저항의 수치가 다르며 아래 그림과 같이 색으로 구분을 합니다. 하지만 저항 값을 알기 위해 특별히 저항의 색상을 알고 있어야 하는 경우가 아니라면 그냥 테스터기로 저항 값을 알아내는 것을 추천합니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","저항은 전기 회로에서 전류의 흐름을 방해하는 물질의 특성이며, 당위는 Ohm(Ω)을 사용합니다. 다양한 종류의 저항이 있고, 저항마다 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","먼저 전압, 전류, 저항의 관계에서 꼭 알아야 할 내용을 정리해 보겠습니다. 전기과 혹은 전자과에서 아주 유명한 공식입니다. V = I×R V는 전압, I는 전류, R은 저항입니다. 이 공식에서 얻을 수 있는 내용은 아래와 같습니다. → 같은 전압에서 저항이 높으면 전류가 낮아집니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","전기과 혹은 전자과에서 아주 유명한 공식입니다. V = I×R V는 전압, I는 전류, R은 저항입니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 핵심 정리에 관한 내용입니다. 전압은 전하를 움직이게 하는 전위차이며 단위는 볼트(V)입니다. 전류는 단위 시간 동안 이동한 전하의 양이며 단위는 암페어(A)입니다. 저항은 전류의 흐름을 방해하는 정도이며 단위는 옴(Ω)입니다. 옴의 법칙은 $V=IR$이며, 세 값 중 두 값을 알면 나머지 값을 계산할 수 있습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-02-voltage-current-resistance-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
