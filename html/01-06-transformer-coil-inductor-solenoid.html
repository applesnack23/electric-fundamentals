<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-6. 변압기, 코일, 인덕터, 솔레노이드 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-06-transformer-coil-inductor-solenoid-deck.html#1" title="1-6. 변압기, 코일, 인덕터, 솔레노이드 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-6. 변압기, 코일, 인덕터, 솔레노이드</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-6. 변압기, 코일, 인덕터, 솔레노이드 내용을 시작하겠습니다.","앞에서는 직류와 교류의 차이, 그리고 교류가 장거리 송전에 적합한 이유를 살펴보았습니다. 이번에는 교류를 이해하기 위해 반드시 알아야 하는 **코일**과 **변압기**에 대해 알아보겠습니다. 코일은 변압기뿐만 아니라 모터, 릴레이, 솔레노이드 등 다양한 전기·전자 장치에서 사용되는 가장 기본적인 부품입니다. 먼저 코일의 원리를 이해한 후, 이를 응용한 다양한 장치들을 살펴보겠습니다.","변압기와 코일에 관한 시각 자료입니다. 변압기와 코일의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","코일은 전선을 여러 번 나선형으로 감아 만든 도체입니다. 코일에 전류가 흐르면 강한 자기장이 형성되며, 전류의 방향과 코일의 감긴 방향에 따라 자기장의 방향도 달라집니다. 코일은 자기장을 이용하는 거의 모든 전기 장치의 기본 요소이며, 변압기, 모터, 릴레이, 솔레노이드 등에서 널리 사용됩니다.","코일에 관한 시각 자료입니다. 코일의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","인덕터는 코일의 성질을 이용하여 전류의 변화를 방해하는 부품입니다. 이러한 성질을 인덕턴스(Inductance)라고 합니다. 인덕터의 주요 특징은 다음과 같습니다. - 전류가 갑자기 증가하는 것을 방해합니다. - 전압이 인가되는 순간 돌입전류(Inrush Current)가 발생할 수 있습니다.","인덕터(Inductor)에 관한 시각 자료입니다. 인덕터(Inductor)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","솔레노이드는 코일의 한 종류로, 원통형으로 길게 감은 구조를 가지고 있습니다. 코일에 전류가 흐르면 내부에 강한 자기장이 형성되며, 철심을 넣으면 자기력이 더욱 강해집니다. 이 자기력을 이용하여 직선 운동을 만들어 낼 수 있습니다.","솔레노이드에 관한 시각 자료입니다. 솔레노이드의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","솔레노이드는 자기력을 이용하여 다양한 장치를 동작시킵니다. 대표적인 예는 다음과 같습니다. - 솔레노이드 밸브(Solenoid Valve) - 솔레노이드 액추에이터(Solenoid Actuator) - 솔레노이드 릴레이(Solenoid Relay) 이처럼 코일 하나만으로도 전기 에너지를 기계적인 힘으로 변환할 수 있습니다.","솔레노이드 응용에 관한 시각 자료입니다. 솔레노이드 응용의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","변압기는 코일 두 개를 이용하여 교류 전압의 크기를 변경하는 장치입니다. 변압기는 철심(Core)에 감긴 두 개의 코일로 구성됩니다. 전원에 연결된 코일을 1차측, 전압을 출력하는 코일을 2차측이라고 합니다. 1차측 코일에 교류 전류가 흐르면 자기장이 형성되고, 변화하는 자기장이 코어를 통해 2차측 코일에 전달되면서 전압이 유도됩니다. 이러한 원리를 전자기 유도(Electromagnetic Induction)라고 합니다.","변압기 (Transformer)에 관한 시각 자료입니다. 변압기 (Transformer)의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","앞에서 살펴본 일반적인 변압기를 **복권 변압기(Isolation Transformer)**라고 합니다. 복권 변압기는 1차측과 2차측이 서로 다른 코일로 완전히 분리되어 있습니다. 따라서 제작 비용이 비교적 높고 크기와 무게도 큰 편입니다. 하지만 1차측과 2차측이 전기적으로 절연되어 있으므로 노이즈가 전달되지 않는 장점이 있습니다. '절연(絕緣)'이란 전기적으로 연결되지 않은 상태를 의미합니다.","복권 변압기에 관한 시각 자료입니다. 복권 변압기의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","단권 변압기(Auto Transformer)는 하나의 코일을 1차측과 2차측이 함께 사용하는 변압기입니다. 복권 변압기보다 구조가 단순하여 가격이 저렴하고 크기와 무게도 작습니다. 하지만 1차측과 2차측이 전기적으로 연결되어 있기 때문에 절연 기능이 없습니다. 따라서 외부의 노이즈가 그대로 전달될 수 있으며, 감전 보호 측면에서도 복권 변압기보다","단권 변압기에 관한 시각 자료입니다. 단권 변압기의 구성 요소를 배치와 연결 방향에 따라 살펴보면, 앞에서 설명한 원리가 실제 장치나 회로에 적용되는 과정을 확인할 수 있습니다.","전류가 도선을 따라 흐르면 항상 전력 손실이 발생합니다. 손실은 다음과 같이 계산합니다. P<sub>loss<\/sub> = I² × R 전력 손실을 줄이기 위해서는 다음 두 가지 방법이 있습니다. - 도선의 저항(R)을 줄입니다. - 흐르는 전류(I)를 줄입니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-06-transformer-coil-inductor-solenoid-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
