  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-6. 변압기, 코일, 인덕터, 솔레노이드을 학습하겠습니다. 코일에 흐르는 전류가 변하면 자기장이 변하고, 이 변화는 다시 전압을 만들어 냅니다. 변압기, 인덕터, 솔레노이드는 모두 이 전자기 유도 현상을 서로 다른 목적으로 이용했습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 전자기 유도와 코일의 기본 동작을 설명할 수 있습니다. 복권 변압기와 단권 변압기의 차이를 구분할 수 있습니다. 인덕터와 솔레노이드가 회로와 장치에서 하는 역할을 이해할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 변압기 (Transformer)에 관한 내용입니다. 변압기를 사용하면 1차측 전원에서 2차측 전원으로 전기가 전달됩니다. 전원에 연결된 구리선은 그림과 같이 코어를 감싸고 있는 형태인데 이를 코일이라고 합니다. 1차측에 연결된 코일과 2차측에 연결된 코일의 감기는 횟수에 따라 전압이 달라집니다. 이러한 원리로 변압기는 전압을 변경하는데 유용하게 사용됩니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","변압기를 사용하면 1차측 전원에서 2차측 전원으로 전기가 전달됩니다. 전원에 연결된 구리선은 그림과 같이 코어를 감싸고 있는 형태인데 이를 코일이라고 합니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","먼저 전류의 손실에서 꼭 알아야 할 내용을 정리해 보겠습니다. 전류는 이동을 할 때 손실이 발생하며 손실은 Ploss = I^2×R로 구합니다. 손실을 줄이기 위해서는 저항(R)을 낮추거나 전류(I)를 낮춰야 하는데, 저항을 낮추는 것은 물리적으로 한계가 있습니다. 같은 전력을 공급할 때, 전압을 높이면 전류를 낮출 수 있기 때문에 손실을 줄일 수 있습니다. 높은 전압(765kV)으로 공급 후 가정이나 공장에서 전압을 낮춰 사용합니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","복권 변압기의 핵심 내용을 짚어보겠습니다. 앞서 공부했던 변압기는 복권 변압기라고 합니다. 1차측과 2차측이 서로 다른 코일로 분리가 되어 있는 형태인데, 코일을 분리해서 사용하기 때문에 비교적 비싸며 무겁습니다. 다만, 1차측과 2차측이 완전히 절연되어 있어 노이즈 유입이 차단되는 장점이 있습니다. 절연(絕緣): 관계를 완전히 끊음 1:1 변압기 로 노이즈 필터 로도 사용. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","앞서 공부했던 변압기는 복권 변압기라고 합니다. 1차측과 2차측이 서로 다른 코일로 분리가 되어 있는 형태인데, 코일을 분리해서 사용하기 때문에 비교적 비싸며 무겁습니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","먼저 단권 변압기에서 꼭 알아야 할 내용을 정리해 보겠습니다. 복권 변압기와 다르게 코일이 한 개만 있는 변압기를 단권 변압기라 합니다. 1차측과 2차측의 코일을 공유하기 때문에 비용이 복권 변압기 대비 저렴하고 크기가 작고 가볍습니다. 다만, 1차측과 2차측이 절연되어 있지 않기 때문에 노이즈 유입의 통로가 되기도 합니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","복권 변압기와 다르게 코일이 한 개만 있는 변압기를 단권 변압기라 합니다. 1차측과 2차측의 코일을 공유하기 때문에 비용이 복권 변압기 대비 저렴하고 크기가 작고 가볍습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","먼저 코일과 변압기에서 꼭 알아야 할 내용을 정리해 보겠습니다. 전선을 나선형으로 감은 구조를 가진 도체. 전류가 흐르면 강한 자기장이 형성됩니다. 코일의 자기장은 전류의 방향과 전선의 감김 상태에 따라 달라집니다. 코일에 흐른 전류로 인해 자기장이 형성됩니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","전선을 나선형으로 감은 구조를 가진 도체. 전류가 흐르면 강한 자기장이 형성됩니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","인덕터의 핵심 내용을 짚어보겠습니다. 전압이 증가하면 저항이 증가. 전압이 공급되면 역기전력이 발생. 전압이 차단되면 역기전력으로 인한 회생전력 발생. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","전압이 증가하면 저항이 증가. 전압이 공급되면 역기전력이 발생. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","인덕터의 이해의 핵심 내용을 짚어보겠습니다. 자동차가 출발하거나 멈출 때 가속시간과 감속시간이 필요 사람이 달리기를 시작하거나 멈출 때 가속시간과 감속시간이 필요 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","자동차가 출발하거나 멈출 때 가속시간과 감속시간이 필요 사람이 달리기를 시작하거나 멈출 때 가속시간과 감속시간이 필요 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","솔레노이드의 핵심 내용을 짚어보겠습니다. 코일의 한 종류로, 나선형으로 감긴 긴 전선으로 구성된 구조. 보통 직선 모양의 원통형 형태. 전류가 흐를 때, 솔레노이드 내부에 강한 자기장 형성. 솔레노이드 밸브. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","코일의 한 종류로, 나선형으로 감긴 긴 전선으로 구성된 구조. 보통 직선 모양의 원통형 형태. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","다음은 핵심 정리에 관한 내용입니다. 변압기는 교류와 권선비를 이용해 전압을 변환했습니다. 복권 변압기는 1차측과 2차측이 절연되지만 단권 변압기는 전기적으로 연결되었습니다. 인덕터는 전류의 급격한 변화를 방해하고 자기장에 에너지를 저장했습니다. 솔레노이드는 코일의 자기장을 직선 운동으로 바꾸는 액추에이터였습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-06-transformer-coil-inductor-solenoid-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
