<body>
  <main>

  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-11. 회전기기와 발전기을 학습하겠습니다. 전동기는 전기에너지를 회전 운동으로 바꾸고, 발전기는 회전 운동을 전기에너지로 바꿉니다. 두 장치는 에너지 변환 방향만 다를 뿐 전자기 유도라는 같은 원리를 사용했습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 회전자와 고정자가 회전 자기장을 만드는 원리를 이해할 수 있습니다. 단상과 3상 전원에서 회전 특성이 달라지는 이유를 설명할 수 있습니다. Y 결선과 △ 결선의 전압 관계를 구분할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","단상과 회전체의 핵심 내용을 짚어보겠습니다. 자석을 그림과 같이 가운데를 고정 코일에 전류를 흐르게 하면 코일 주위에 자기장이 형성 이때, 단상 전원은 자석의 회전 방향을 결정할 수 없습니다. (AC 모터 원리에서 단상 모터의 경우 방향을 결정하는 추가적인 회로가 반드시 필요). 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","자석을 그림과 같이 가운데를 고정 코일에 전류를 흐르게 하면 코일 주위에 자기장이 형성 이때, 단상 전원은 자석의 회전 방향을 결정할 수 없습니다. (AC 모터 원리에서 단상 모터의 경우 방향을 결정하는 추가적인 회로가 반드시 필요). 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","먼저 3상과 회전체에서 꼭 알아야 할 내용을 정리해 보겠습니다. 자석을 그림과 같이 가운데를 고정 단상과 동일하게 코일에 전류를 흐르게 하면 코일 주위에 자기장이 형성 이때, 3상 전원은 자석 회전의 방향을 결정할 수 있습니다. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","자석을 그림과 같이 가운데를 고정 단상과 동일하게 코일에 전류를 흐르게 하면 코일 주위에 자기장이 형성 이때, 3상 전원은 자석 회전의 방향을 결정할 수 있습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 3상 3선식의 결선에 관한 내용입니다. 회전체에 3상 전원을 3개의 선으로 입력하는 방식 3개의 코일에 3상 3선식으로 결선하여 안정적인 전압원을 공급. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","회전체에 3상 전원을 3개의 선으로 입력하는 방식 3개의 코일에 3상 3선식으로 결선하여 안정적인 전압원을 공급. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","먼저 3상 3선식과 발전기에서 꼭 알아야 할 내용을 정리해 보겠습니다. 이번에는 회전체에 전원을 공급하는 대신 발전 원리를 살펴보았습니다. 회전체를 물리적인 힘으로 회전 시켜 봅니다. (풍력, 수력 발전기 원리는 회전체에서 전력을 얻습니다.). 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","이번에는 회전체에 전원을 공급하는 대신 발전 원리를 살펴보았습니다. 회전체를 물리적인 힘으로 회전 시켜 봅니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","그림의 구성 요소와 전류 또는 신호의 흐름을 차례로 확인하겠습니다. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 3상 3선식의 결선과 발전기에 관한 내용입니다. 회전체에 3상의 전원을 4개의 선으로 입력하는 방식 3개의 코일에 3상 4선식으로 결선하여 안정적인 전압원을 공급 3상 3선식과 마찬가지로 회전체에서 전력을 얻을 수 있습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","회전체에 3상의 전원을 4개의 선으로 입력하는 방식 3개의 코일에 3상 4선식으로 결선하여 안정적인 전압원을 공급 3상 3선식과 마찬가지로 회전체에서 전력을 얻을 수 있습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","그림의 구성 요소와 전류 또는 신호의 흐름을 차례로 확인하겠습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 3상 전원의 전압에 관한 내용입니다. 1개의 380V 3상 전원. 3개의 380V 단상 전원 (RS, ST, TR): 선간전압. 1개의 380V 3상 전원. 3개의 380V 단상 전원 (RS, ST, TR): 선간전압. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","1개의 380V 3상 전원. 3개의 380V 단상 전원 (RS, ST, TR): 선간전압. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 참고에 관한 내용입니다. R, S, T, L (또는 A, B, C, L)을 3상 4선식으로 정의. R, S, T, G (또는 A, B, C, G)은 3상 3선식 + 접지로 정의 (곧, 3상 4선식이 아님). 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다음은 핵심 정리에 관한 내용입니다. 전류가 흐르는 코일은 자기장을 만들고, 여러 상의 위상차는 회전 자기장을 만들었습니다. 3상 전원은 위상이 120°씩 어긋나 있어 안정적인 회전력을 만들기 유리했습니다. 발전기는 자속의 변화를 이용해 코일에 전압을 유도했습니다. 결선 방식에 따라 선간전압, 상전압, 선전류의 관계가 달라졌습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-11-rotating-machines-and-generators-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
