<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-5. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리) · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-05-battery-structure-and-operation-deck.html#1" title="1-5. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리) Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-5. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리)</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-5. 배터리 구조 및 동작 원리 (건전지, 리튬이온 배터리 충, 방전 원리) 내용을 시작하겠습니다.","배터리를 공부하다 보면 생각보다 다양한 종류와 원리가 있다는 것을 알게 됩니다. 하지만 현대의 배터리는 성능을 높이기 위해 많은 기술이 추가되어 있기 때문에 처음부터 이해하기에는 다소 어렵습니다. 배터리를 이해하는 가장 좋은 방법은 가장 단순한 구조의 전지부터 살펴보는 것입니다.","아연은 금속 원소이므로 내부에서는 금속 결합을 하고 있습니다. 금속 결합은 양이온인 $Zn^{2+}$ 사이를 자유전자가 이동하며 결합을 유지하는 구조입니다. 아연판이 소금물과 만나면 일부 아연 원자가 전자를 잃고 이온화됩니다. 생성된 아연 이온($Zn^{2+}$)은 소금물 속으로 녹아 들어가고, 잃어버린 전자는 아연판 내부에 남게 됩니다. 이 과정이 계속되면서 아연판에는 전자가 점점 많아지고, 결과적으로 **음극(-극)**이 형성됩니다.","구리판에서는 아연처럼 금속이 녹아 나오지는 않습니다. 아연판에 축적된 전자는 도선을 따라 구리판으로 이동합니다. 이 전자의 이동이 바로 **전류**입니다. 구리판에 도착한 전자는 소금물 속의 수소 이온($H^+$)과 반응하여 수소 기체를 생성합니다. 생성된 수소 기체는 구리판 표면에 작은 기포 형태로 나타납니다.","볼타 전지는 최초로 지속적인 전류를 만들어 낸 전지였지만 몇 가지 단점도 가지고 있었습니다. - 수소 기체가 발생하여 성능이 점차 감소합니다. - 한 번 사용하면 다시 충전하여 사용할 수 없습니다. - 출력과 효율이 낮습니다. 따라서 볼타 전지는 현대의 기준으로는 성능이 뛰어나지 않았지만, 이후 배터리 기술의 출발점이 되었다는 점에서 매우 중요한 의미를 가지고 있습니다.","앞에서 살펴본 볼타 전지는 한 번 사용하면 다시 사용할 수 없는 **1차 전지**입니다. 현대에는 충전과 방전을 반복할 수 있는 **2차 전지**가 널리 사용되고 있으며, 그 대표적인 예가 리튬 이온 배터리입니다. 리튬은 매우 가벼우면서도 전자를 잃기 쉬운 금속입니다. 이러한 특성 덕분에 작은 크기에서도 높은 전압과 높은 에너지 밀도를 얻을 수 있어 스마트폰, 노트북, 전기자동차 등에 가장 많이 사용되고 있습니다.","리튬 이온 배터리는 크게 네 가지 요소로 구성됩니다. - 음극(Anode) : 흑연(Graphite, $C_6$) - 양극(Cathode) : 리튬 코발트 산화물($LiCoO_2$) - 전해질(Electrolyte) : EC, DMC, DEC 등의 유기 전해액 - 분리막(Separator) : 양극과 음극이 직접 접촉하지 않도록 분리하는 절연막 볼타 전지와 비교하면 다음과 같이 대응할 수 있습니다. - 음극 → 아연판 - 양극 → 구리판 - 전해질 → 소금물.","충전기를 연결하면 외부 전압이 배터리에 인가됩니다. 외부 전압에 의해 전자는 양극에서 음극으로 강제로 이동합니다. 리튬 이온($Li^+$) 역시 전해질을 통하여 음극으로 이동하며 흑연 내부에 저장됩니다. 이 과정에서 양극의 리튬은 일부만 이동합니다. 예를 들어 $LiCoO_2$ 는 $Li_{0.5}CoO_2$ 또는 $Li_{0.4}CoO_2$ 와 같은 상태가 됩니다.","충전된 배터리에 부하를 연결하면 저장되어 있던 리튬 이온이 다시 양극으로 이동합니다. 리튬 이온은 전해질을 통하여 이동하고, 전자는 외부 회로를 따라 이동하면서 전기를 공급합니다. 즉, - 리튬 이온($Li^+$)은 전해질 내부를 이동합니다. - 전자($e^-$)는 도선을 따라 이동합니다. 이 과정에서 전기 에너지가 발생하며 외부 장치를 동작시킬 수 있습니다.","1차 전지와 2차 전지의 차이의 핵심 개념을 정리하겠습니다.","앞서 이야기한 배터리는 한번 사용하고 마는 1차전지였다. 현대에는 충전과 방전을 반복할 수 있는 2차전지를 많이 사용하게 되는데, 이 때 많이 사용되는 재료가 리튬을 사용한 리튬이온 배터리다. 리튬은 지구상에서 가장 전자를 버리고 싶어하는 금속이기에 가볍고 작은 크기로 엄청나게 높은 전압을 만들어 낼 수 있다.","- 음극 (=아연판): $C_6$ - 양극 (=구리판): $LiCoO_2$ - 유기 화합물 (=소금물): EC, DMC, DEC.","충전지에 외부 전압을 강제 입력하면, 전자가 도선을 통해 음극으로 강제 이동 되는데, 이 때 $Li^+$ 는 유기 화합물에 녹아 $Li_{0.5}CoO_2$ ~ $Li_{0.4}CoO_2$ 가 되며, (리튬 전체가 이동하게 되면 배터리 기능을 할 수 없다.) 마찬가지로 음극은 $Li_{0.5}C_6$ ~ $Li_{0.4}C_6$ 이 된다. 충전지를 해제한 상태에서 음극과 양극을 도선으로 연결하면 $Li^+$ 는 유기화합물로 녹아 양극으로 이동하며, 전자($e^-$) 는 도선을 통해 양극으로 이동하며 전기를 발생시킨다. 이 때, $Li_{0.5}CoO_2$ 이 $LiCoO_2$ 되면 완전히 방전된 상태로 더 이상 전압을 만들어 내지 않는다. 다시 외부 전압을 강제 입력하면, 음극은 $Li_{0.5}C_6$ 이 되고, 양극은 $Li_{0.5}CoO_2$ 이 되서 전압을 만들 수 있는 상태가 됩니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-05-battery-structure-and-operation-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
