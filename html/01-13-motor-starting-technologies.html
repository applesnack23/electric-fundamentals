<html lang="ko">
<head>

  <title>1-13. 모터 기동 기술 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }
    button:disabled { opacity: .35; cursor: default; }
    #counter { color: #9db1bf; font-variant-numeric: tabular-nums; }
    .hint { color: #71899b; font-size: 14px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }
      aside { border-left: 0; border-top: 1px solid #213247; padding: 20px 24px; }
      #script { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-13-motor-starting-technologies-deck.html#1" title="1-13. 모터 기동 기술 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-13. 모터 기동 기술</h1>
      <div id="script"></div>
    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 1-13. 모터 기동 기술 내용을 시작하겠습니다.","산업용 AC 모터는 정지 상태에서 기동할 떄 정격 운전 전류보다 훨씬 큰 전류를 순간적으로 소비합니다. 이를 기동 전류라고 합니다. 기동 전류가 지나치게 크면 다음과 같은 문제가 발생할 수 있습니다. - 전원 전압이 순간적으로 떨어집니다.","산업용 AC 모터는 정지 상태에서 기동할 떄 정격 운전 전류보다 훨씬 큰 전류를 순간적으로 소비합니다. 이를 기동 전류라고 합니다.","Y-△ 기동은 모터를 처음 기동할 때 **Y(Star) 결선**으로 연결한 후, 모터가 일정한 속도에 도달하면 **△(Delta) 결선**으로 변경하는 방식입니다. Y 결선에서는 각 권선에 걸리는 전압이 낮아지기 때문에 기동 전류를 줄일 수 있습니다. 모터가 충분히 가속되면 △ 결선으로 전환하여 정격 전압으로 정상 운전합니다. 여기서 Y 결선과 △ 결선은 모터 권선의 연결 방식이며, 각각 3상 4선식과 3상 3선식을 의미하는 것은 아닙니다. 일반적인 Y-△ 기동 모터는 중성선을 사용하지 않습니다.","Y-△ 기동은 모터를 처음 기동할 때 **Y(Star) 결선**으로 연결한 후, 모터가 일정한 속도에 도달하면 **△(Delta) 결선**으로 변경하는 방식입니다. Y 결선에서는 각 권선에 걸리는 전압이 낮아지기 때문에 기동 전류를 줄일 수 있습니다. 모터가 충분히 가속되면 △ 결선으로 전환하여 정격 전압으로 정상 운전합니다.","리액터 기동은 모터를 기동할 때 각 상에 리액터(Inductor)를 직렬로 연결하여 모터에 인가되는 전압을 낮추는 방식입니다. 전압이 낮아지면 기동 전류도 감소합니다. 모터가 일정한 속도에 도달하면 바이패스 회로를 이용해 리액터를 제거하고, 모터에 정격 전압을 직접 공급합니다. **장점** - 기동 전류를 줄일 수 있습니다. - 단계적으로 전압을 낮출 수 있습니다.","리액터 기동은 모터를 기동할 때 각 상에 리액터(Inductor)를 직렬로 연결하여 모터에 인가되는 전압을 낮추는 방식입니다. 전압이 낮아지면 기동 전류도 감소합니다. 모터가 일정한 속도에 도달하면 바이패스 회로를 이용해 리액터를 제거하고, 모터에 정격 전압을 직접 공급합니다.","전자식 소프트 스타터(Soft Starter)는 사이리스터와 같은 전력 반도체를 이용하여 모터에 공급되는 전압을 점진적으로 증가시키는 장치입니다. 기동 초기에는 낮은 전압을 공급하고, 설정된 시간에 따라 전압을 서서히 높여 모터를 부드럽게 가속합니다. 정지할 때도 전압을 서서히 낮추는 소프트 스톱(Soft Stop) 기능을 사용할 수 있습니다. **장점** - 기동 전류의 급격한 증가를 줄일 수 있습니다. - 모터를 부드럽게 가속할 수 있습니다.","전자식 소프트 스타터(Soft Starter)는 사이리스터와 같은 전력 반도체를 이용하여 모터에 공급되는 전압을 점진적으로 증가시키는 장치입니다. 기동 초기에는 낮은 전압을 공급하고, 설정된 시간에 따라 전압을 서서히 높여 모터를 부드럽게 가속합니다. 정지할 때도 전압을 서서히 낮추는 소프트 스톱(Soft Stop) 기능을 사용할 수 있습니다.","산업 현장에서 말하는 모터용 인버터는 AC 전원의 전압과 주파수를 조절하여 AC 모터를 제어하는 장치입니다. 정확한 명칭으로는 다음과 같은 표현을 사용합니다. - VFD(Variable Frequency Drive) - Variable Speed Drive - AC Drive - Motor Drive 국내 산업 현장에서는 이를 일반적으로 인버터라고 부릅니다. 모터용 인버터의 내부에서는 입력 AC 전원을 먼저 DC로 정류한 후, 전력 반도체를 이용해 원하는 전압과 주파수의 AC 전원을 다시 생성합니다. 따라서 기본적인 전력 변환 과정은 다음과 같습니다.","산업 현장에서 말하는 모터용 인버터는 AC 전원의 전압과 주파수를 조절하여 AC 모터를 제어하는 장치입니다. 정확한 명칭으로는 다음과 같은 표현을 사용합니다. - VFD(Variable Frequency Drive) - Variable Speed Drive - AC Drive - Motor Drive 국내 산업 현장에서는 이를 일반적으로 인버터라고 부릅니다.","서보 모터(Servo Motor)는 명령한 위치, 속도 또는 토크를 정확하게 따라가도록 구성된 모터 시스텝입니다. 서보 모터는 단순히 모터만을 의미하지 않습니다. 일반적으로 다음 장치가 하나의 서보 시스템을 구성합니다. - 서보 모터 - 서보 드라이브 - 엔코더 또는 리졸버 - 상위 제어기 (PLC, Motion Controller 등) 서보 모터의 회전축에는 엔코더가 장착되어 실제 위치와 속도를 측정합니다. 서보 드라이브는 명령값과 엔코더에서 측정한 실제값을 비교하여 오차를 계산하고, 그 오차가 줄어들도록 모터를 제어합니다.","- 위치 제어가 매우 정확합니다. - 속도와 토크를 정밀하게 제어할 수 있습니다. - 가속과 감속 응답이 빠릅니다. - 정지 상태에서도 위치를 유지할 수 있습니다. - 반복 위치 정밀도가 높습니다.","- 일반 인버터 모터보다 비용이 높습니다. - 모터와 드라이브를 서로 호환되는 제품으로 사용해야 합니다. - 엔코더 케이블과 모터 케이블이 필요합니다. - 게인과 필터 등의 파라미터 설정이 필요합니다.","서보 모터는 정확한 위치와 빠른 응답이 필요한 장비에 사용합니다. 대표적인 적용 분야는 다음과 같습니다. - 산업용 로봇 - 협동 로봇 - CNC 공작기계 - 반도체 장비 - 포장 장비 - 인쇄 장비 - 전자 부품 조립 장비 - 정밀 컨베이어 - Pick & Place 장비."];
    const deck = document.getElementById('deck');
    const deckBase = '01-13-motor-starting-technologies-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
