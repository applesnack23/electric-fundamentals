  <script>
    const scripts = ["안녕하세요. 1-12. 다이오드와 전력 변환 내용을 시작하겠습니다. 다이오드는 전자회로에서 가장 기본적으로 사용되는 반도체 소자 중 하나입니다. 다이오드는 전류가 한쪽 방향으로만 흐르도록 제어하는 특성을 가지고 있으며, 정류 회로, 역전압 보호 회로, LED, 전원 회로 등에 널리 사용됩니다. 이번에는 다이오드의 기본 동작과 선정 방법을 살펴보고, 이를 이용한 AC-DC 변환과 다양한 전력 변환 방식에 대해 알아보겠습니다.","다이오드는 전류가 한쪽 방향으로만 흐르도록 하는 반도체 소자입니다. 일반적인 다이오드는 애노드(Anode)에서 캐소드(Cathode) 방향으로 전류가 흐릅니다. - 애노드(Anode): 전류가 들어오는 쪽 - 캐소드(Cathode): 전류가 나가는 쪽 순방향으로 전압을 인가하면 전류가 흐르고, 역방향으로 전압을 인가하면 전류의 흐름을 차단합니다.","다이오드는 전류가 한쪽 방향으로만 흐르도록 하는 반도체 소자입니다. 일반적인 다이오드는 애노드(Anode)에서 캐소드(Cathode) 방향으로 전류가 흐릅니다. - 애노드(Anode): 전류가 들어오는 쪽 - 캐소드(Cathode): 전류가 나가는 쪽 순방향으로 전압을 인가하면 전류가 흐르고, 역방향으로 전압을 인가하면 전류의 흐름을 차단합니다.","다이오드의 순방향으로만 전류를 흐르게 하는 특성을 이용하면 교류 전압의 극성을 일정한 방향으로 정류하거나, 잘못된 극성의 전압이 회로에 인가되는 것을 방지할 수 있습니다.","다이오드의 순방향으로만 전류를 흐르게 하는 특성을 이용하면 교류 전압의 극성을 일정한 방향으로 정류하거나, 잘못된 극성의 전압이 회로에 인가되는 것을 방지할 수 있습니다.","다이오드를 선택할 때에는 최소한 다음 세 가지 항목을 확인해야 합니다. - 허용 순방향 전류 - 순방향 전압 강하 - 최대 역전압 예를 들어 다이오드 데이터시트의 내용을 확인해보겠습니다.. 다이오드의 허용 전류 확인 (Point) - Maximum average forward retified current 1.0 Amp - 다이오드가 연속적으로 흘릴 수 있는 평균 순방향 전류가 최대 1A라는 의미입니다. 순방향 전압 강하 - Maximum instantaneous forward voltate at 1.0A - 1.1Volts - 1A의 전류가 흐를 때 다이오드에서 최대 약 1.1V의 순방향 전압 강하가 발생한다는 의미입니다. 최대 역전압 - Maximum repetitive peak reverse voltate 1000 Volts - 다이오드가 견딜 수 있는 최대 역전압이 1,000V라는 의미입니다.","다이오드를 선택할 때에는 최소한 다음 세 가지 항목을 확인해야 합니다. - 허용 순방향 전류 - 순방향 전압 강하 - 최대 역전압 예를 들어 다이오드 데이터시트의 내용을 확인해보겠습니다.. 다이오드의 허용 전류 확인 (Point) - Maximum average forward retified current 1.0 Amp - 다이오드가 연속적으로 흘릴 수 있는 평균 순방향 전류가 최대 1A라는 의미입니다.","다이오드에 순방향 전류가 흐르면 다이오드 양단에서 일정한 전압이 감소합니다. 이를 순방향 전압 강하(Forward Voltage Drop)라고 합니다. 일반적인 실리콘 다이오드는 약 0.6~0.7V의 전압 강하가 발생하지만, 다이오드의 종류와 흐르는 전류에 따라 값이 달라질 수 있습니다. LED 역시 빛을 내는 다이오드이므로 순방향 전압 강하가 존재합니다. 예를 들어 어떤 LED의 사양이 다음과 같다고 가정하겠습니다.","다이오드에 순방향 전류가 흐르면 다이오드 양단에서 일정한 전압이 감소합니다. 이를 순방향 전압 강하(Forward Voltage Drop)라고 합니다. 일반적인 실리콘 다이오드는 약 0.6~0.7V의 전압 강하가 발생하지만, 다이오드의 종류와 흐르는 전류에 따라 값이 달라질 수 있습니다.","LED에 연결할 저항은 다음 공식으로 계산합니다. R = (공급 전압 - LED 순방향 전압) ÷ LED 전류 예제에 적용하면 다음과 같습니다. R = (5V - 1.8V) ÷ 0.02A R = 160Ω 계산값은 160Ω이지만, 실제 부품은 표준 저항값 중에서 계산값 이상을 선택하는 것이 일반적입니다. 따라서 이 회로에서는 200Ω 저항을 선택할 수 있습니다. 저항값을 더 크게 선택해도 LED는 손상되지 않지만, 흐르는 전류가 줄어들기 때문에 밝기가 낮아집니다.","LED에 연결할 저항은 다음 공식으로 계산합니다. R = (공급 전압 - LED 순방향 전압) ÷ LED 전류 예제에 적용하면 다음과 같습니다. R = (5V - 1.8V) ÷ 0.02A R = 160Ω 계산값은 160Ω이지만, 실제 부품은 표준 저항값 중에서 계산값 이상을 선택하는 것이 일반적입니다.","전원은 입력과 출력의 형태에 따라 다음과 같이 구분할 수 있습니다. - DC → DC: DC-DC 컨버터 - AC → DC: 정류기 또는 AC-DC 컨버터 - DC → AC: 인버터 또는 DC-AC 컨버터 - AC → AC: 변압기 또는 AC-AC 컨버터 각 방식은 입력 전압의 종류와 필요한 출력 형태에 따라 선택합니다.","AC 전압의 크기만 변경할 때에는 변압기를 사용합니다. 변압기는 1차측과 2차측 코일의 권선수비에 따라 출력 전압을 변경합니다. 교류는 변압기를 이용하면 비교적 간단한 구조와 낮은 비용으로 전압을 높이거나 낮출 수 있습니다. 다만 일반적인 변압기는 전압의 크기는 변경할 수 있지만 주파수는 변경하지 못합니다.","AC 전압의 크기만 변경할 때에는 변압기를 사용합니다. 변압기는 1차측과 2차측 코일의 권선수비에 따라 출력 전압을 변경합니다. 교류는 변압기를 이용하면 비교적 간단한 구조와 낮은 비용으로 전압을 높이거나 낮출 수 있습니다.","AC 전원을 DC 전원으로 변환하려면 일반적으로 다음 과정을 거칩니다. **변압** 필요한 경우 변압기를 이용하여 입력 AC 전압을 원하는 크기로 낮추거나 높입니다. 예를 들어 AC 220V를 저전압 전자회로에 사용하려면 먼저 변압기를 이용해 AC 12V 또는 AC 24V 등으로 낮출 수 있습니다. **정류** 교류는 전압의 극성이 주기적으로 바뀌므로 그대로는 일반적인 DC 회로에서 사용할 수 없습니다. 브리지 다이오드 회로를 사용하면 교류의 음의 반주기를 뒤집어 한쪽 방향의 전압으로 변환할 수 있습니다.","AC 전원을 DC 전원으로 변환하려면 일반적으로 다음 과정을 거칩니다. **변압** 필요한 경우 변압기를 이용하여 입력 AC 전압을 원하는 크기로 낮추거나 높입니다. 예를 들어 AC 220V를 저전압 전자회로에 사용하려면 먼저 변압기를 이용해 AC 12V 또는 AC 24V 등으로 낮출 수 있습니다.","DC 전원을 AC 전원으로 변환하는 장치를 **인버터(Inverter)**라고 합니다. DC는 전류의 방향이 일정하므로 그대로는 교류를 만들 수 없습니다. 따라서 반도체 스위치를 매우 빠르게 ON/OFF하여 전압의 극성을 주기적으로 바꾸어 AC 전압을 생성합니다. 일반적으로 스위칭 주파수는 일정하게 유지하면서 펄스의 ON 시간과 OFF 시간의 비율인 듀티비(Duty Ratio)를 조절합니다. 이러한 방식을 PWM(Pulse Width Modulation)이라고 합니다.","DC 전원을 AC 전원으로 변환하는 장치를 **인버터(Inverter)**라고 합니다. DC는 전류의 방향이 일정하므로 그대로는 교류를 만들 수 없습니다. 따라서 반도체 스위치를 매우 빠르게 ON/OFF하여 전압의 극성을 주기적으로 바꾸어 AC 전압을 생성합니다.","DC 전압을 다른 크기의 DC 전압으로 변경하는 장치를 DC-DC 컨버터라고 합니다. 대표적인 비절연 방식은 다음과 같습니다. - Buck Converter: DC 전압 강하(Step-Down) - Boost Converter: DC 전압 상승(Step-Up) - Buck-Boost Converter: 전압 상승 또는 강하 비절연 방식은 입력과 출력의 GND가 전기적으로 연결되어 있습니다. 반면 절연이 필요한 경우에는 DC를 고주파 AC로 변환한 후 변압기를 거쳐 다시 DC로 정류하는 방식을 사용합니다. 대표적인 예가 SMPS(Switched-Mode Power Supply)입니다.","일반적인 변압기는 AC 전압의 크기는 변경할 수 있지만 주파수는 변경하지 못합니다. AC 전원의 주파수를 변경하려면 다음 과정을 거칩니다. **AC → DC → AC** 먼저 입력 AC를 DC로 정류하고, 다시 인버터 회로를 이용하여 원하는 주파수의 AC를 생성합니다. 산업 현장에서 모터의 회전속도를 제어하기 위해 사용하는 장치를 일반적으로 **인버터**라고 부릅니다. 다만 기능적으로는 단순한 DC-AC 인버터라기보다"];
    const deck = document.getElementById('deck');
    const deckBase = '01-12-diodes-and-power-conversion-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
