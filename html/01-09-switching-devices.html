    const scripts = ["안녕하세요. 이번 영상에서는 1-9. 스위치, 트랜지스터, 릴레이, SSR, 포토커플러, MC, MOSFET의 동작 원리와 적용을 학습하겠습니다. 자동화 회로는 작은 제어 신호로 더 큰 전류를 켜고 끄는 장치를 사용합니다. 기계식 스위치부터 릴레이, 트랜지스터, MOSFET, SSR까지 동작 속도와 절연, 허용 전류를 비교했습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 접점과 시퀀스 회로의 기본 동작을 설명할 수 있습니다. 릴레이와 반도체 스위칭 소자의 장단점을 비교할 수 있습니다. 부하 종류에 따라 적절한 스위칭 소자를 선택하는 기준을 이해할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","스위치의 핵심 내용을 짚어보겠습니다. 표시등. 누름버튼 스위치. 조광형 누름버튼 스위치. 셀렉터 스위치. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","표시등. 누름버튼 스위치. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","표시등. 누름버튼 스위치. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","표시등 (=LAMP)의 핵심 내용을 짚어보겠습니다. 사양에 따른 전압을 공급하면 표시등을 ON 할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","사양에 따른 전압을 공급하면 표시등을 ON 할 수 있습니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","다음은 스위치 회로에 관한 내용입니다. Normal Closed (NC) : 1 → 2. B접점 또는 B-Contact. Normal Open (NO) : 4 → 3. A접점 또는 A-Contact. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","Normal Closed (NC) : 1 → 2. B접점 또는 B-Contact. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","Normal Closed (NC) : 1 → 2. B접점 또는 B-Contact. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 소자 설명에 관한 내용입니다. 스위치 장치 DC 배터리 장치 부하 (Lamp, Motor 등). 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","스위치 장치 DC 배터리 장치 부하 (Lamp, Motor 등). 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","스위치 장치 DC 배터리 장치 부하 (Lamp, Motor 등). 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","먼저 시퀀스 회로에서 꼭 알아야 할 내용을 정리해 보겠습니다. A 접점을 사용해서 Lamp On. B 접점을 사용해서 Lamp Off. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","A 접점을 사용해서 Lamp On. B 접점을 사용해서 Lamp Off. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 스위치 종류에 관한 내용입니다. 누르면 ON, 떼면 OFF. 누르면 OFF, 떼면 ON. 왼쪽 OFF, 오른쪽 ON. 왼쪽 ON, 오른쪽 OFF. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","누르면 ON, 떼면 OFF. 누르면 OFF, 떼면 ON. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","그림의 구성 요소와 전류 또는 신호의 흐름을 차례로 확인하겠습니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","다음은 DO (=Digital Output)에 관한 내용입니다. Source (원천, 근원, 출처, 얻다). Sink (빠지다, 가라앉다). 부하를 기준으로 극성이 변경. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","Source ( 러 (=Optocoupler)에 관한 내용입니다. 비교적 비싼 비용 기계적 접점이 없는 반도체로 반영구적인 사용 기계적 접점이 없는 반도체로 속도가 릴레이 대비 빠름 반도체로 스위칭에 필요한 소모 전류 낮음 고전류 제어 불가 트랜지스터 와 다르게 전원 분리 가능. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","비교적 비싼 비용 기계적 접점이 없는 반도체로 반영구적인 사용 기계적 접점이 없는 반도체로 속도가 릴레이 대비 빠름 반도체로 스위칭에 필요한 소모 전류 낮음 고전류 제어 불가 트랜지스터 와 다르게 전원 분리 가능. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 Optocoupler vs Transistor에 관한 내용입니다. Optocoupler. 트랜지스터. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","Optocoupler. 트랜지스터. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","먼저 MOSFET (=Metal-Oxide-Semiconductor Field-Effect Transistor)에서 꼭 알아야 할 내용을 정리해 보겠습니다. 트랜지스터 (=BJT) 대비 비쌈 빠른 스위칭 속도와 높은 효율 제공 전력소자 스위칭 용도로 많이 사용 (예: SMPS). 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","트랜지스터 (=BJT) 대비 비쌈 빠른 스위칭 속도와 높은 효율 제공 전력소자 스위칭 용도로 많이 사용 (예: SMPS). 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","트랜지스터 (=BJT) 대비 비쌈 빠른 스위칭 속도와 높은 효율 제공 전력소자 스위칭 용도로 많이 사용 (예: SMPS). 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","다음은 IGBT (=Insulated Gate Bipolar Transistor)에 관한 내용입니다. 고전력 고속 스위칭 소자 모터 구동 스위치로 많이 사용됨 (예: 인버터, 모터 드라이브). 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","고전력 고속 스위칭 소자 모터 구동 스위치로 많이 사용됨 (예: 인버터, 모터 드라이브). 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","고전력 고속 스위칭 소자 모터 구동 스위치로 많이 사용됨 (예: 인버터, 모터 드라이브). 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 SSR (=Solid State Relay)에 관한 내용입니다. 반도체로 만든 릴레이 SSR은 릴레이처럼 부하 전원을 제어하지만 기계적 접점이 없습니다. 반영구적으로 사용 할 수 있습니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","반도체로 만든 릴레이 SSR은 릴레이처럼 부하 전원을 제어하지만 기계적 접점이 없습니다. 반영구적으로 사용 할 수 있습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다음은 핵심 정리에 관한 내용입니다. 스위치와 릴레이는 물리적 접점으로 회로를 연결하거나 차단했습니다. 트랜지스터와 MOSFET은 전기 신호로 빠르게 스위칭하는 반도체 소자였습니다. 포토커플러는 빛을 이용해 입력과 출력을 전기적으로 절연했습니다. SSR은 반도체로 부하를 스위칭하므로 빠르고 수명이 길지만 발열과 누설 전류를 고려해야 합니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-09-switching-devices-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
