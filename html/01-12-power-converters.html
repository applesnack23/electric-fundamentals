<html lang="ko">

  <title>1-12. 전력 변환기 및 컨버터 회로 구조 · 발표 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #08111f; color: #eaf2f5; font-family: Pretendard, "Noto Sans KR", sans-serif; }
    body { display: grid; grid-template-rows: 1fr 68px; overflow: hidden; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); min-height: 0; }
    .stage { display: flex; align-items: center; justify-content: center; background: #02060d; padding: 18px; min-width: 0; min-height: 0; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; background: #02060d; box-shadow: 0 18px 60px rgba(0,0,0,.45); pointer-events: none; }
    aside { min-width: 0; border-left: 1px solid #213247; background: #0d1b2b; padding: 34px 38px; overflow: auto; }
    .eyebrow { color: #52d3d6; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 28px; color: white; }
    #script { white-space: pre-wrap; font-size: 20px; line-height: 1.75; color: #dce8ec; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 0 24px; background: #07101d; border-top: 1px solid #213247; }
    .left, .right { display: flex; align-items: center; gap: 10px; }
    .right { justify-content: flex-end; }
    button { border: 1px solid #36506a; background: #14283c; color: white; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a3d55; }

    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .stage { padding: 8px; }

<body>
  <main>
    <section class="stage"><iframe id="deck" src="01-12-power-converters-deck.html#1" title="1-12. 전력 변환기 및 컨버터 회로 구조 Marp 발표자료"></iframe></section>
    <aside>
      <div class="eyebrow">YouTube Recording Script</div>
      <h1>1-12. 전력 변환기 및 컨버터 회로 구조</h1>

    </aside>
  </main>
  <footer>
      <div class="left"><button id="prev">← 이전</button><span class="hint">슬라이드와 대본 함께 이동 · ← / → 방향키</span></div>
    <div id="counter"></div>
    <div class="right"><button id="next">다음 →</button></div>
  </footer>
  <script>
    const scripts = ["안녕하세요. 이번 영상에서는 1-12. 전력 변환기 및 컨버터 회로 구조을 학습하겠습니다. 전자장치는 필요한 전압과 전류의 형태가 서로 다릅니다. 다이오드와 반도체 스위치를 이용하면 AC와 DC를 변환하거나 같은 종류의 전원 안에서도 전압 크기를 바꿀 수 있습니다. 이 장을 마치면 핵심 개념을 그림과 연결해 설명할 수 있습니다.","학습 목표의 핵심 내용을 짚어보겠습니다. 다이오드의 순방향·역방향 동작을 설명할 수 있습니다. AC-DC, DC-AC, DC-DC, AC-AC 변환을 구분할 수 있습니다. 부품의 전압·전류·전력 정격을 고려해 기본 소자를 선정할 수 있습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 다이오드에 관한 내용입니다. 다이오드는 한쪽 방향으로만 전류가 흐르는 특징이 있는 소자. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다.","다이오드는 한쪽 방향으로만 전류가 흐르는 특징이 있는 소자. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","다이오드 선정의 핵심 내용을 짚어보겠습니다. Maximum average forward retified current 1.0 Amp. Maximum instantaneous forward voltage at 1.0 A: 1.1 V. Maximum repetitive peak reverse voltage: 1000 V. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","Maximum average forward retified current 1.0 Amp. Maximum instantaneous forward voltage at 1.0 A: 1.1 V. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","먼저 순방향 전압 강하에서 꼭 알아야 할 내용을 정리해 보겠습니다. LED(발광 다이오드)와 저항 선택 예제 순방향 전압 강하는 1.8 V이고 허용 전류는 20 mA입니다. 5 V 전압 공급 시 추천 저항은 100 ~ 300옴. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","LED(발광 다이오드)와 저항 선택 예제 순방향 전압 강하는 1.8 V이고 허용 전류는 20 mA입니다. 5 V 전압 공급 시 추천 저항은 100 ~ 300옴. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","먼저 저항 선정에서 꼭 알아야 할 내용을 정리해 보겠습니다. R = (5V - 1.8V) / 0.02A 저항 160Ω 이상인 200Ω 선택 (이상도 가능 단, 밝기가 어두움) 이때 200Ω 저항에 걸리는 전압은 3.2V 이기 때문에 전류는 V = I × R에 의해 I = 3.2V / 200Ω = 16mA 이때, 전력은 P = V × I에 의해 P = 3.2V × 16mA = 51mW 의 전력이 가능한 저항을 선택. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","R = (5V - 1.8V) / 0.02A 저항 160Ω 이상인 200Ω 선택 (이상도 가능 단, 밝기가 어두움) 이때 200Ω 저항에 걸리는 전압은 3.2V 이기 때문에 전류는 V = I × R에 의해 I = 3.2V / 200Ω = 16mA 이때, 전력은 P = V × I에 의해 P = 3.2V × 16mA = 51mW 의 전력이 가능한 저항을 선택. 각 요소가 어디에 연결되고 어떤 역할을 하는지 순서대로 확인해 보겠습니다.","먼저 컨버터에서 꼭 알아야 할 내용을 정리해 보겠습니다. DC to DC 컨버터. AC to DC 컨버터. DC to AC 컨버터 : 인버터. AC to AC 컨버터 : 변압기. 이 관계를 이해해 두면 뒤에 나오는 회로 설명도 훨씬 쉽게 따라갈 수 있습니다.","AC to AC 컨버터의 핵심 내용을 짚어보겠습니다. 코일의 권선수에 따라 전압 레벨이 변경 됩니다. 가장 간단하며 비용이 저렴합니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","코일의 권선수에 따라 전압 레벨이 변경 됩니다. 가장 간단하며 비용이 저렴합니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","AC to DC 컨버터의 핵심 내용을 짚어보겠습니다. 브릿지 다이오드를 사용해서 극성을 바꾸어 줍니다. 커패시터를 사용해 평활회로를 만들어 줍니다. 마지막 정전압 장치로 DC를 만듭니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","브릿지 다이오드를 사용해서 극성을 바꾸어 줍니다. 커패시터를 사용해 평활회로를 만들어 줍니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","브릿지 다이오드를 사용해서 극성을 바꾸어 줍니다. 커패시터를 사용해 평활회로를 만들어 줍니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","DC to AC 컨버터의 핵심 내용을 짚어보겠습니다. DC를 AC로 변경하는 것은 상당한 비용을 만들어 냅니다. 자세한 PWM 제어 방법은 마이크로컨트롤러 과정에서 다루므로 여기서는 기본 원리만 학습했습니다. DC 전원 주파수로 나누어 아주 빠르게 ON/OFF를 반복해 AC로 변경합니다. 출력 전압을 모니터링하면서 스위칭 주파수는 고정하고 듀티비를 조절했습니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","DC를 AC로 변경하는 것은 상당한 비용을 만들어 냅니다. 자세한 PWM 제어 방법은 마이크로컨트롤러 과정에서 다루므로 여기서는 기본 원리만 학습했습니다. 그림에서 입력과 출력의 관계를 중심으로 살펴보겠습니다.","DC를 AC로 변경하는 것은 상당한 비용을 만들어 냅니다. 자세한 PWM 제어 방법은 마이크로컨트롤러 과정에서 다루므로 여기서는 기본 원리만 학습했습니다. 강조된 기호와 연결 방향을 따라가면 동작 원리를 이해하기 쉽습니다.","DC to DC 컨버터의 핵심 내용을 짚어보겠습니다. Buck 컨버터: DC 전압 강하 (Step-Down). Boost 컨버터: DC 전압 상승 (Step-Up). SMPS 등. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","AC to AC 컨버터의 핵심 내용을 짚어보겠습니다. 앞서 사용했던 AC to AC 컨버터 는 전압 레벨만 변경 가능 AC의 주파수까지 변경하려면 먼저 AC를 DC로 변환한 뒤 다시 원하는 주파수의 AC로 변환해야 합니다. 재밌게도 이것이 우리가 알고 있는 모터 구동용 인버터 이지만, 사실 정식 명칭은 아닙니다. AC 전원을 입력 받아서 모터의 회전속도를 변경하기 위해서는 주파수 변경이 필요하기 때문에 모터 구동용 인버터 (=모터 구동용 컨트롤러 또는 모터 드라이브)를 사용합니다. 각 개념이 서로 어떤 관계를 갖는지 생각하며 정리해 보세요.","다음은 핵심 정리에 관한 내용입니다. 다이오드는 전류를 한 방향으로 흐르게 하며 정류회로의 기본이 되었습니다. AC-DC 변환기는 교류를 직류로 정류하고 평활·안정화했습니다. DC-AC 인버터는 스위칭을 통해 교류 파형을 만들었습니다. 컨버터를 선정할 때는 입력 범위, 출력 정격, 효율, 절연 여부, 발열을 함께 확인해야 합니다. 용어 자체보다 실제 회로에서 어떤 역할을 하는지에 집중하면 이해하기 쉽습니다."];
    const deck = document.getElementById('deck');
    const deckBase = '01-12-power-converters-deck.html';
    const stage = document.querySelector('.stage');
    const scriptBox = document.getElementById('script');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let index = 0;
    function render(updateDeck = true) {
      index = Math.max(0, Math.min(index, scripts.length - 1));
      scriptBox.textContent = scripts[index];
      counter.textContent = `${index + 1} / ${scripts.length}`;
      prev.disabled = index === 0;
      next.disabled = index === scripts.length - 1;
      if (updateDeck) deck.src = `${deckBase}#${index + 1}`;
    }
    function go(delta) { index += delta; render(true); }
    prev.addEventListener('click', () => go(-1));
    next.addEventListener('click', () => go(1));
    stage.addEventListener('click', (event) => {
      const bounds = stage.getBoundingClientRect();
      go(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
    });
    window.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === 'Home') { index = 0; render(true); }
      if (event.key === 'End') { index = scripts.length - 1; render(true); }
    });
    render(false);
  </script>
</body>
</html>
